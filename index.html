  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0a0f1a;--bg2:#0e1520;--bg3:#111d2e;--bg4:#1a2640;--card:#0d1525;
      --acc:#e63946;--acc2:#ff4d5a;--gold:#f5a623;--teal:#06b6d4;
      --green:#10b981;--purple:#8b5cf6;--blue:#3b82f6;--orange:#f97316;
      --text:#f0f4f8;--text2:#94a3b8;--text3:#475569;
      --border:#1e2d42;--border2:#243347;
      --font-d:'Bebas Neue',cursive;--font-b:'DM Sans',sans-serif;
      --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-b);overflow:hidden}
    #root{height:100%;display:flex;flex-direction:column}
    ::-webkit-scrollbar{display:none}
    input,textarea,select{font-family:var(--font-b)}
  .btn-back{background:#1b263b;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}

.card{overflow-wrap:break-word;word-break:break-word}
input,select,textarea{box-sizing:border-box}

/* Largeur uniforme bilans : forcer tous les onglets à pleine largeur */
.scroll > div { width:100% !important; box-sizing:border-box; }
.scroll .card { width:100% !important; box-sizing:border-box; }
.scroll .section-hdr { width:100%; box-sizing:border-box; }

/* Anti-débordement page Routine */
.scroll{overflow-x:hidden!important}
.section-hdr{max-width:100%;box-sizing:border-box;overflow-wrap:break-word}
.cat-badge{flex-shrink:0;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.tag{flex-shrink:0;white-space:normal}
</style>

    "description": "Couche intermédiaire entre le catalogue d'exercices (exercices individuels) et le moteur de l'app (choix du jour). Chaque type de séance définit ses créneaux (slots) : quelle(s) qualité(s) et catégorie(s) du catalogue chaque slot doit couvrir. L'app résout ensuite chaque slot en un exercice concret selon la fenêtre active (matériel dispo) et les contre-indications du jour, en suivant la chaîne de substituts du catalogue.",
    "regle_bascule": "v4.1 (30/08/2026) — LE GATE DES 28 JOURS EST ABROGÉ. Arbre D : le type de semaine se détermine par le MATÉRIEL disponible, pas par la durée du séjour ; Arbre E : la durée ne décide plus que de la FORME de progression (vague 3+1 si ≥4 semaines connues à l'avance, sinon semaine-type répétée sans vague). Aucune séance n'est verrouillée par la durée de fenêtre : le seul filtre réel est le matériel (windows_ok du catalogue, croisé avec le matériel coché dans l'app) et les contre-indications du jour. Le code applique déjà cette règle (moteurBlocQualiteActive() renvoie true en permanence) ; c'est ce texte qui décrivait encore l'ancienne règle. Le champ 'semaine_classique' de chaque session_type est DÉPRÉCIÉ et neutralisé (toutes les valeurs passées à true) : il est conservé pour compatibilité, il ne doit plus servir à décider quoi que ce soit.",
    "changelog_v1_2": "v1.2 (31/08/2026, chantier 46) — trois corrections, toutes issues de décisions déjà validées par J mais jamais descendues jusqu'à la couche qui pilote la séance réelle. ① CRÉNEAU HINGE LOURD DE FB2 : l'exercice de référence était la trap bar et la note disait « SDT LOURD … Trap bar / DL / RDL au sélecteur ». Le mouvement de référence est le RDL hanches hautes barre du sol (Hinge Lift MTI) ; la trap bar reste au sélecteur à la maison ; le soulevé de terre conventionnel est sorti du sélecteur. ② T2 EN FINISHER DE LA VO2max : l'arbitrage 18 a été validé par J le 30/08 et intégré au programme en v4_68 — l'app ne le portait nulle part, la séance J1 était donc incomplète. Slot ajouté (optionnel, ~4 min). ③ Le statut de la séance T1/T2 disait « remplacé par Portage 2 », ce qui n'est plus vrai que pour T1. Corrigé.",
    "resolution_slot": "Pour un slot donné : filtrer catalogue.exercises par category (et qualities si précisé) -> exclure ceux dont une contraindication est un flag actif du bilan du jour -> parmi les restants, garder ceux dont current_window ∈ windows_ok -> si aucun ne matche, suivre substitutes du meilleur candidat pour la fenêtre. side_rule G_first du catalogue reste prioritaire à volume/charge égal.",
    "changelog_v1_3": "v1.3 (31/08/2026, chantier 49) — SOURCE UNIQUE DES FORMATS, RPE ET REPOS. Jusqu'ici, quand un creneau ne fixait pas lui-meme format_fixe / rpe_fixe / repos, le moteur allait chercher la valeur dans les FICHES DE SEANCE DU SPLIT (Haut 1-3, Bas 1-2), plan abandonne le 08/08, par correspondance de mots-cles sur le NOM de l'exercice. Deux consequences. (a) Aucune tracabilite : rien a l'ecran ne disait d'ou venait la valeur. (b) Surtout, la valeur etait attachee a l'EXERCICE et non au CRENEAU : un mouvement qui a change de role trainait le repos de son ancien creneau. Le Zercher, passe du volume de Bas 2 au TOP SET de FB1, affichait 2 min de repos ; le RDL, passe du volume au HINGE LOURD de FB2, affichait 2-3 min. Les deux series les plus lourdes de la semaine etaient sous-recuperees a l'ecran. Les 51 valeurs concernees sont desormais PORTEES DANS LES CRENEAUX ci-dessous ; celles qui contredisaient le programme sont corrigees et portent un champ repos_motif. Le repli vers les fiches du split est supprime du code (il ne subsiste que pour la note technique quand le catalogue n'en a pas, et il est alors affiche comme herite).",
    "changelog_v1_4": "v1.4 (31/08/2026, chantier 55) — LE SEUL TIRAGE HORIZONTAL DE LA SEMAINE ETAIT UN CRENEAU OPTIONNEL. Le comptage du 31/08 donne 4 poussees horizontales + 3 verticales contre 1 tirage horizontal charge (row bucheron, FB1). Ce creneau unique etait 'obligatoire: false' — et le moteur reserve le repli generique (pattern/categorie) aux creneaux OBLIGATOIRES : un creneau optionnel dont l'exercice est indisponible est purement saute. KB non coche ou contre-indication active = zero tirage horizontal dans la semaine, sans aucun message. Creneau rendu obligatoire, et le row dote de substituts (Pendlay, TRX row, poulie basse) qui existaient deja au catalogue sans etre relies a rien.",
    "substituts_slot_note": "CHANTIER 68 (31/08) — `substituts` sur un CRÉNEAU : liste ordonnée d'identifiants d'exercices essayés quand l'exercice préféré est indisponible, AVANT les substituts déclarés sur la fiche et AVANT le repli générique. Le créneau connaît le rôle et l'INTENSITÉ ; la fiche ne connaît que le mouvement. Une même fiche sert plusieurs créneaux (le vélo porte la Z2, le seuil ET la VO2max) : un substitut déclaré sur elle est donc forcément aveugle au rôle, et c'est ainsi qu'un bloc de seuil pouvait se résoudre en Z2. Même principe que le chantier 49 : une valeur se rattache au créneau, jamais au mouvement. `absence_acceptable` : motif écrit ; un créneau obligatoire ainsi marqué qui ne trouve rien ne bloque plus la séance — il s'affiche absent, avec son motif, et ne prend surtout pas l'exercice d'un autre créneau."

// pas dans la taxonomie (puissance, explosivite, gainage, rotation, force, unilateral…). Elles ne

// les résout ; null = ce n'est pas une qualité mais une méthode (excentrique) ou une catégorie.

// Séances Moteur faites, stockées DANS le log du jour (log.moteur_sessions = [sessionId,...]) —
// une seule source de vérité, cohérente avec tout le reste (export/import, calendrier).
function moteurWeekDates(){
  const dow = today.getDay() || 7; // 1=lundi..7=dimanche
  const monday = new Date(today); monday.setDate(today.getDate()-(dow-1));
  const dates=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
  }
  return dates;
}
function moteurToggleSessionDoneToday(sessionId){
  const log = getLog();
  const arr = log.moteur_sessions || [];
  const idx = arr.indexOf(sessionId);
  if(idx>=0) arr.splice(idx,1); else arr.push(sessionId);
  log.moteur_sessions = arr;
  saveLog(log);
  render();
}
function moteurIsSessionDoneToday(sessionId){
  return (getLog().moteur_sessions||[]).includes(sessionId);
}
function moteurSessionDoneCountThisWeek(sessionId){
  return moteurWeekDates().filter(ds=>{
    const l = ds===todayStr ? getLog() : (load('log:'+ds)||{});
    return (l.moteur_sessions||[]).includes(sessionId);
  }).length;
}
function moteurMissionTarget(freqText){
  const m = /(\d+)\s*x/i.exec(freqText||'');
  return m ? Number(m[1]) : null;
}

// acquise. Il ne peut donc pas figurer dans cette frise. C\'est lui, et lui seul, qui déclenche le
// gabarit E (spécification 3-4 sem. + affûtage). Le déplacement à Lyon n\'est PAS un test.
// ⚠ Retour course : le palier 1 (30 min continu × 2-3 sorties) et le protocole de cadence (7 sorties)
// n\'ont volontairement pas de date — ils avancent à la tolérance du tissu, pas au calendrier.
// ⚠ ORDRE DES PALIERS — INVERSÉ le 31/08, validé par J (arbitrage 47) :
//   P1 tenir 30 min continu (2-3 sorties) + cadence 166  →  P2 SORTIR DU TAPIS (ex-③)
//   →  P3 accélérations progressives (ex-②)  →  P4 pente réelle ≥3 % et descente.
// Raison : seul P2 a une échéance (le 12/10 décide si Lyon est une fenêtre de course ou un trou), et

// paramètre directement corrélé à la contrainte sur la bandelette.
// ⚠ Les conditions écrites « après le palier 2 » ailleurs dans le dossier désignent un NOMBRE de
// paliers franchis (≥2), pas le palier « accélérations ». Le critère de bascule de la VO2max vers la
// course, lui, reste nommément lié aux ACCÉLÉRATIONS — devenues P3.
function moteurJalons(){
  const now = new Date(); now.setHours(0,0,0,0);
  return M_JALONS.map(j=>{
    const d = new Date(j.date+'T00:00:00');
    const days = Math.round((d - now)/86400000);
    return Object.assign({}, j, {days});

// ── Rampe d'approche du top set : séries montantes calculées en kg réels ──────────────────
// Approches NON fatigantes (reps basses, RIR élevé) : elles préparent le top set, elles ne
// le préparent pas au prix de la fraîcheur. Arrondi au palier de 2,5 kg (disques).
function moteurRampeTopSet(target){
  if(!(target > 0)) return null;
  const r = v => Math.round(v/2.5)*2.5;
  const BAR = 20;
  const steps = [{lbl:'Barre à vide', kg:BAR, reps:'×5'}];
  [[0.50,'×3'],[0.70,'×3'],[0.85,'×2']].forEach(([pct,reps])=>{
    const kg = r(target*pct);
    if(kg > BAR && kg < target) steps.push({lbl:Math.round(pct*100)+' %', kg, reps});
  });
  steps.push({lbl:'TOP SET', kg:r(target), reps:'×3', top:true});
  steps.push({lbl:'Back-off ×2', kg:r(target*0.90), reps:'×5'});
  return steps;
}
// ── Nombre de séries à cocher, déduit du format ──────────────────────────────────────────
// parseInt('3-4×8') renvoyait 3 : une fourchette affichait toujours sa borne BASSE.
// Ici on prend la borne HAUTE (c'est le plafond prévu ; cocher moins reste possible).
// Cas top set : top set + back-off = séries de travail (les approches ne se cochent pas).
function moteurNbSeries(format){
  if(!format) return 3;
  if(/top set/i.test(format)){
    const bo = format.match(/back-?off\s*(\d+)\s*[-\u2013]?\s*(\d+)?\s*[\u00D7x]/i);
    return 1 + (bo ? Number(bo[2] || bo[1]) : 2);
  }
  const m = format.match(/(\d+)\s*[-\u2013]\s*(\d+)\s*[\u00D7x]/);
  if(m) return Number(m[2]);
  const s = format.match(/(\d+)\s*[\u00D7x]/);
  if(s) return Number(s[1]);
  const n = parseInt(format);
  return isFinite(n) && n > 0 ? n : 3;
}
function moteurWindowElapsedDays(){

// v4.1 : sans cet offset, l'app plaçait le PIC de la vague sur la semaine où la doctrine prévoit
// le DÉLOAD — décalage systématique d'une semaine à chaque retour de déplacement.
function moteurVagueElapsedDays(){

function moteurProtocolFor(ex){
  const info = moteurCycleInfo();
  if(!info) return null;
  // Primer/AGT alactique — s'applique largement, indépendamment du mouvement porteur.
  if(ex.category === 'alactique_finisher' && info.protocole_par_qualite && info.protocole_par_qualite.alactique){
    const protoId = info.protocole_par_qualite.alactique;
    const p = MPER.protocoles[protoId];
    return {nom:p.nom, format:p.format, rpe:p.rpe, phase:info.phase, volume_pct:info.volume_pct};
  }
  // Focus tests — format spécifique par exercice, sinon pas de protocole affiché pour cet exercice.
  if(MS.focusManuel === 'semaine_tests'){
    const t = M_TEST_FORMAT[ex.id];
    return t ? {nom:'Test officiel', format:t, rpe:'9-10', phase:'focus_manuel', volume_pct:info.volume_pct} : null;
  }
  if(MS.focusManuel === 'prep_tests'){
    return M_TEST_FORMAT[ex.id] ? {nom:'Préparation test', format:'Paliers progressifs vers sous-max, vitesse gardée', rpe:'7-8', phase:'focus_manuel', volume_pct:info.volume_pct} : null;
  }
  // Déload — VOLUME −50 %, INTENSITÉ MAINTENUE (programme §2 · manuel ch. 11, v4.34).
  // v4.1 : l'ancienne version renvoyait '3×3 déload' @RPE 4-5, c.-à-d. une baisse d'intensité sur une
  // semaine entière. C'est le volume qui coûte de la récupération ; l'intensité tient les adaptations
  // neuromusculaires. On garde donc le top set à son RPE et on supprime tout le volume autour.
  if(info.phase === 'deload'){
    const dlType = info.type === 'puissance' ? 'puissance' : 'force';
    const dlMethod = dlType === 'force'
      ? (M_FORCE_TOPSET.has(ex.id) ? 'top_set' : null)
      : (M_PUISSANCE_METHOD[ex.id] || null);
    if(dlMethod === 'top_set'){
      return {nom:'Déload', format:'Top set ×3 @RIR 1-2 — AUCUN back-off (volume −50 %, intensité maintenue)',
              rpe:'8', phase:'deload', volume_pct:50};
    }
    if(dlMethod){
      const mfd = M_METHOD_FORMATS[dlMethod];
      return {nom:'Déload', format:mfd.modere+' — séries divisées par deux, vitesse et charge inchangées',
              rpe:mfd.rpe.modere, phase:'deload', volume_pct:50};
    }
    return {nom:'Déload', format:'Volume −50 % (séries de travail divisées par deux) — charge et technique inchangées',
            rpe:'inchangé', phase:'deload', volume_pct:50};
  }
  const cycleType = info.type;
  let method = null;
  if(cycleType === 'force') method = M_FORCE_TOPSET.has(ex.id) ? 'top_set' : null;
  else if(cycleType === 'puissance') method = M_PUISSANCE_METHOD[ex.id] || null;
  if(!method) return null;
  const mf = M_METHOD_FORMATS[method];
  const phaseKey = ['leger','modere','pic'].includes(info.phase) ? info.phase : 'modere';
  return {nom:mf.nom, format:mf[phaseKey], rpe:mf.rpe[phaseKey], phase:info.phase, volume_pct:info.volume_pct};
}

function moteurProgressionSuggestion(exId){
  const ex = M_EX_BY_ID[exId];
  const last = moteurLastExerciseLog(exId);
  if(!ex || !last || last.entry.rpe == null || last.entry.rpe === '') return null;
  // Une donnée trop ancienne ne sert pas à valider un poids aujourd'hui — seulement informatif
  // au-delà de 10 jours (le corps a pu changer, mieux vaut resaisir un RPE frais avant de suggérer).
  if(last.date !== todayStr && moteurDaysAgo(last.date) > 10) return null;
  const rir = moteurRpeToApproxRIR(last.entry.rpe);
  if(rir == null) return null;
  if(ex.progression_type === 'barre'){
    const step = ex.category === 'bas_force' ? 3 : 1.5;
    if(rir >= 3) return {action:'augmenter', text:'+'+step+' kg conseillé (RPE '+last.entry.rpe+' → marge élevée)'};
    if(rir === 2) return {action:'maintenir_ou_leger', text:'Maintenir ou +'+(step/2)+' kg'};
    if(rir === 1) return {action:'maintenir', text:'Conserver la charge (proche du max)'};
    return {action:'reduire', text:'Réduire légèrement ou répéter la séance (RPE '+last.entry.rpe+')'};
  }
  if(ex.progression_type === 'halteres_kb'){
    if(rir >= 3) return {action:'augmenter', text:'Palier disponible le plus proche (ou changement de KB)'};
    if(rir === 2) return {action:'maintenir_ou_leger', text:'Maintenir, palier suivant si séance très propre'};
    if(rir === 1) return {action:'maintenir', text:'Conserver la charge/le KB actuel'};
    return {action:'reduire', text:'Revenir au palier/KB précédent'};
  }
  if(ex.progression_type === 'isometrie'){
    if(rir >= 3) return {action:'augmenter', text:'+2-5s de tenue'};
    return {action:'maintenir', text:'Maintenir la durée'};
  }
  return null;
}

  const sugg = moteurProgressionSuggestion(exId);
  if(!sugg || ex.progression_type !== 'barre') return;
  const cur = Number(moteurGetCharge(exId)) || 0;
  const step = ex.category === 'bas_force' ? 3 : 1.5;
  let next = cur;
  if(sugg.action === 'augmenter') next = cur + step;
  else if(sugg.action === 'maintenir_ou_leger') next = cur + step/2;
  else if(sugg.action === 'reduire') next = Math.max(0, cur - step/2);
  moteurSetTodayField(exId, 'charge', Math.round(next*2)/2, sessionId);
  render();
}

function moteurExerciseStatus(exId){
  const ex = M_EX_BY_ID[exId];
  if(!ex) return {ok:false, reason:'Exercice introuvable'};
  const avail = moteurEquipment();
  const missing = ex.equipment_required.filter(r => !avail.includes(r));
  if(missing.length) return {ok:false, reason:'Matériel manquant : ' + missing.map(m=>M_EQUIP_LABEL[m]||m).join(', ')};
  const sev = moteurSeverityFromBilan();
  for(const c of (ex.contraindications||[])){
    if(c === 'epaule_G'){
      if(ex.delestage_tier != null && ex.delestage_tier <= MS.delestageEpauleTier){
        return {ok:false, reason:'Délestage épaule G actif (étage ' + ex.delestage_tier + ' coupé)'};
      }
    } else {
      const threshold = (ex.severity_overrides && ex.severity_overrides[c] != null) ? ex.severity_overrides[c] : 1;
      if((sev[c]||0) >= threshold){
        return {ok:false, reason:'Contre-indication active (' + (sev[c]>=2?'forte':'légère') + ') : ' + (M_CONTRA_LABEL[c]||c)};
      }
    }
  }
  return {ok:true, reason:null};
}

// Résolution d'un slot : préférence déclarée -> substituts déclarés -> repli par PATTERN
// (même mouvement fonctionnel) -> repli par simple catégorie/qualité en dernier recours.
function moteurResolveSlot(slot, usedIds){
  const pref = slot.exercice_pref;
  const prefEx = pref ? M_EX_BY_ID[pref] : null;
  const wantedQualities = slot.qualities || (prefEx ? prefEx.qualities : []) || [];
  const wantedPattern = prefEx ? prefEx.pattern : null;

  function tryFind(predicateExtra){
    return MCAT.exercises.find(e => !usedIds.has(e.id) && predicateExtra(e) && moteurExerciseStatus(e.id).ok);
  }
  // CHANTIER 72 — GARDE-FOU DU DERNIER RECOURS. Le repli par catégorie est volontairement aveugle
  // au pattern : c'est un filet, pas un choix. Mais « haut_force » contient les poussées ET les
  // tirages, « bas_force » les squats ET les hinges — et l'exercice retenu est le PREMIER du
  // catalogue qui passe, donc un simple effet d'ordre de saisie. Mesuré sur le gabarit D (Lyon) :
  // sans barre de traction, un créneau de TIRAGE pouvait se résoudre en POMPES. Un filet a le droit
  // d'être grossier ; il n'a pas le droit de proposer l'exercice antagoniste.
  const famille = p => !p ? null : (p.indexOf('push_')===0 ? 'push' : (p.indexOf('pull_')===0 ? 'pull'
                     : ((p==='squat'||p==='squat_unilat') ? 'squat' : (p.indexOf('hinge')===0 ? 'hinge' : null))));
  const familleVoulue = famille(wantedPattern);
  function fallback(excludeId){
    if(wantedPattern && wantedPattern !== 'none'){
      const byPattern = tryFind(e => e.id !== excludeId && e.pattern === wantedPattern);
      if(byPattern) return {ex: byPattern, viaPattern:true};
    }
    // Un créneau dont l'ABSENCE est motivée (absence_acceptable) ne prend pas « à peu près » :
    // même pattern, ou rien. Sinon il consomme l'exercice qu'un autre créneau attend.
    if(slot.absence_acceptable) return null;
    const byCategory = tryFind(e => e.id !== excludeId && e.category === slot.category &&
      (!familleVoulue || famille(e.pattern) === null || famille(e.pattern) === familleVoulue) &&
      (!wantedQualities.length || wantedQualities.some(q => e.qualities.includes(q))));
    if(byCategory) return {ex: byCategory, viaPattern:false};
    return null;
  }

  if(pref){
    const st = moteurExerciseStatus(pref);
    if(st.ok && !usedIds.has(pref)) return {exId: pref, substituted:false};
    if(prefEx && prefEx.substitutes){
      // Priorité : le substitut déclaré EXACTEMENT pour la contre-indication qui bloque cet exercice
      // (ex. genou_G_itband -> presse_cuisse) — plus pertinent qu'un substitut générique par matériel.
      const sev = moteurSeverityFromBilan();
      const activeContra = (prefEx.contraindications||[]).find(c=>{
        if(c==='epaule_G') return prefEx.delestage_tier!=null && prefEx.delestage_tier<=MS.delestageEpauleTier;
        const threshold = (prefEx.severity_overrides && prefEx.severity_overrides[c]!=null) ? prefEx.severity_overrides[c] : 1;
        return (sev[c]||0) >= threshold;
      });
      if(activeContra && prefEx.substitutes[activeContra]){
        const subId = prefEx.substitutes[activeContra];
        const subSt = moteurExerciseStatus(subId);
        if(subSt.ok && !usedIds.has(subId)) return {exId: subId, substituted:true, from: pref, blockedReason: st.reason, viaContraindication:true};
      }
    }
    // CHANTIER 68 — SUBSTITUTS DÉCLARÉS SUR LE CRÉNEAU, servis AVANT ceux de la fiche.
    // Le créneau connaît le rôle et l'INTENSITÉ ; la fiche ne connaît que le mouvement. Une même
    // fiche sert plusieurs créneaux — le vélo porte la Z2, le seuil et la VO2max — donc un substitut
    // déclaré sur elle est aveugle au rôle : c'est ainsi qu'un bloc de SEUIL pouvait se résoudre en
    // KB swings Z2. Même principe que le chantier 49 : une valeur se rattache au créneau.
    for(const subId of (slot.substituts || [])){
      const subSt = moteurExerciseStatus(subId);
      if(subSt.ok && !usedIds.has(subId))
        return {exId: subId, substituted:true, from: pref, blockedReason: st.reason, viaSlot:true};
    }
    if(prefEx && prefEx.substitutes){
      for(const subId of Object.values(prefEx.substitutes)){
        const subSt = moteurExerciseStatus(subId);
        if(subSt.ok && !usedIds.has(subId)) return {exId: subId, substituted:true, from: pref, blockedReason: st.reason};
      }
    }
    // Repli générique (pattern/catégorie) réservé aux slots OBLIGATOIRES : la séance doit avoir
    // son mouvement. Un slot optionnel indisponible est sauté — jamais remplacé par l'exercice
    // principal d'une autre séance (sinon Bas 2 se transforme en Bas 1 bis : RDL/Bulgarian dupliqués).
    if(slot.obligatoire !== false){
      const alt = fallback(pref);
      if(alt) return {exId: alt.ex.id, substituted:true, from: pref, blockedReason: st.reason, viaPattern: alt.viaPattern};
    }
    // CHANTIER 71 — ABSENCE MOTIVÉE. Un créneau obligatoire qui ne trouve rien bloque toute la
    // séance, et une séance bloquée n'est plus proposée par le sélecteur. Or certaines absences sont
    // RÉELLES et prévues par le programme (sans barre de traction il n'existe aucun tirage vertical) :
    // les traiter comme des pannes retirait deux des six jours de la semaine de Lyon.
    if(slot.absence_acceptable)
      return {exId: null, blocked:true, absenceMotivee:true,
              blockedReason: 'Absence assumée — ' + slot.absence_acceptable};
    return {exId: null, blocked:true, blockedReason: st.reason || 'Aucun substitut disponible'};
  }
  const alt = fallback(null);
  if(alt) return {exId: alt.ex.id, substituted:false};
  return {exId: null, blocked:true, blockedReason: 'Aucun exercice disponible dans cette catégorie'};
}
const M_PRIMING_ROLES = new Set(['echauffement_general','cars_echauffement','mobilite_thoracique',
  'activation_epaule','priming_iso_militaire','primer_alactique','activation_fessier','activation_petersen']);
function moteurResolveSession(session){
  const usedIds = new Set();
  const results = [];
  // Table unique role → groupe de swap (doit rester alignée avec SWAP_GROUPS de l'UI).
  const M_SWAP_ROLE_GROUP = {
    hinge_principal:'hinge', test_hinge_dl:'hinge', hinge_volume:'hinge', hinge_lourd:'hinge',
    squat_bilateral:'squat', test_rsa_front_squat:'squat',
    gainage_finisher:'gainage_ae', anti_extension_finisher:'gainage_ae',
    anti_rotation:'anti_rotation', rotation_puissance:'rotation',
    unilateral_genou:'unilat',
    volume_quadriceps:'quad_bfr', rappel_puissance:'rappel_puiss',
    ischio_jambiers:'ischios', finisher_bfr_jambes:'ischios',
    agt_rotation:'agt_rot', agt_puissance:'agt_vecteur'
  };
  session.slots.forEach(slot=>{
    // Swap manuel : si l'utilisateur a choisi une variante pour ce créneau, on l'honore.
    let effSlot = slot;
    const grp = M_SWAP_ROLE_GROUP[slot.role];
    if(grp){
      const l = getLog(); const swaps = l._swaps || {};
      const swapKey = grp+'_swap@'+(session&&session.id?session.id:'')+'@'+slot.role;
      const chosen = swaps[swapKey];
      if(chosen && M_EX_BY_ID[chosen]) effSlot = Object.assign({}, slot, {exercice_pref: chosen});
    }
    const r = Object.assign({slot: effSlot}, moteurResolveSlot(effSlot, usedIds));
    // Le priming ne « consomme » pas son exercice : la rotation externe sert en activation ET en
    // prophylaxie, les CARs peuvent revenir, etc. Seuls les créneaux de travail réservent leur exercice.
    if(r.exId && !M_PRIMING_ROLES.has(slot.role)) usedIds.add(r.exId);
    results.push(r);
  });
  // Le priming (échauffement, mobilité, activation, primers) prépare la séance : son indisponibilité
  // ne doit JAMAIS la rendre impossible — sinon un élastique manquant bloque un militaire lourd.
  const oblFails = results.filter(r => r.slot.obligatoire && r.blocked && !r.absenceMotivee &&
    !M_PRIMING_ROLES.has(r.slot.role));
  const optFails = results.filter(r => (!r.slot.obligatoire || r.absenceMotivee) && r.blocked);
  let status = 'ok';
  if(oblFails.length) status = 'blocked';
  else if(optFails.length || results.some(r=>r.substituted)) status = 'partial';
  return {results, status, oblFails, optFails};
}
function moteurSessionLockedByPhase(session){

}

function _initAudio(){
  try{
    if(!_audioCtx) _audioCtx=new(window.AudioContext||window.webkitAudioContext)();
    if(_audioCtx.state==='suspended') _audioCtx.resume();
  }catch(e){}
}

function parseReposAll(r){
  if(!r||r==='\u2014'||r==='-') return [];
  const out=[];
  // Split on / but keep "4-5 min/paire" as one (no sec before /)
  const parts = r.split('/');
  for(const part of parts){
    const mm=part.match(/(\d+)(?:-(\d+))?\s*min/);
    if(mm){const v=mm[2]?parseInt(mm[2]):parseInt(mm[1]);out.push({sec:v*60,lbl:v+'min'});continue;}
    const ss=part.match(/(\d+)(?:-(\d+))?s(?!\w)/);
    if(ss){const v=ss[2]?parseInt(ss[2]):parseInt(ss[1]);out.push({sec:v,lbl:v+'s'});}
  }
  // Deduplicate by sec value, keep unique
  return out.filter((t,i,a)=>a.findIndex(x=>x.sec===t.sec)===i).filter(t=>t.sec>0);
}

function _beep(freq,dur){
  try{
    if(!_audioCtx) return;
    if(_audioCtx.state==='suspended') _audioCtx.resume();
    const o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
    o.type='square';
    o.connect(g);g.connect(_audioCtx.destination);
    o.frequency.value=freq;
    g.gain.setValueAtTime(1.0,_audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,_audioCtx.currentTime+dur);
    o.start(_audioCtx.currentTime);o.stop(_audioCtx.currentTime+dur+0.05);
  }catch(e){}
}


function _speak(txt){
  try{
    window.speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(txt);
    u.lang='fr-FR';u.rate=1.1;u.volume=1;u.pitch=1;
    window.speechSynthesis.speak(u);
  }catch(e){}
}

function _bell(){
  try{
    if(!_audioCtx)return;
    if(_audioCtx.state==='suspended')_audioCtx.resume();
    const t=_audioCtx.currentTime;
    [[880,1.0,2.5],[1320,0.5,1.8],[2200,0.25,1.2],[440,0.3,2.0]].forEach(([freq,gain,decay])=>{
      const o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
      o.type='sine';o.connect(g);g.connect(_audioCtx.destination);
      o.frequency.value=freq;
      g.gain.setValueAtTime(gain,t);
      g.gain.exponentialRampToValueAtTime(0.001,t+decay);
      o.start(t);o.stop(t+decay+0.05);
    });
  }catch(e){}
}

// ── FLAG SYSTEM ────────────────────────────────────────────────────────────
function getRecentLogs(days){
  const out=[];
  for(let i=0;i<days;i++){
    const d=new Date(today);d.setDate(d.getDate()-i);
    const ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    out.push({date:ds,log:load('log:'+ds)||{}});
  }
  return out;
}

function computeFlags(){
  const flags=[];
  const L7=getRecentLogs(7);
  const L14=getRecentLogs(14);
  const L28=getRecentLogs(28);

  // ── Douleurs ──────────────────────────────────────────────────────────────
  const dGenou7=L7.filter(d=>d.log.matin?.douleur_genou==='forte');
  const dPoignet7=L7.filter(d=>d.log.matin?.douleur_poignet==='forte');
  const dGenouLeg=L7.slice(0,3).filter(d=>d.log.matin?.douleur_genou==='légère');
  if(dGenou7.length>0)
    flags.push({lvl:'red',icon:'🛑',metric:'Genou G · douleur forte',msg:'Suspendre Bulgarian, Zercher et Nordic Curl. Seule la marche et les exercices sans appui.'});
  else if(dGenouLeg.length>=2)
    flags.push({lvl:'orange',icon:'⚠️',metric:'Genou G · douleur légère persistante',msg:'Réduire volume Lower de 20%. Surveiller avant progression de charge.'});
  if(dPoignet7.length>0)
    flags.push({lvl:'red',icon:'🛑',metric:'Poignet G · douleur forte',msg:'Suspendre KB Press, Dead hang et exercices portés en main G. Maintenir militaire barre si indolore.'});

  // ── Épaule G : règle de délestage ─────────────────────────────────────────
  const dEpaule7=L7.filter(d=>d.log.matin?.douleur_epaule==='forte');
  const dEpauleLeg=L7.slice(0,3).filter(d=>d.log.matin?.douleur_epaule==='légère');
  if(dEpaule7.length>0)
    flags.push({lvl:'red',icon:'🛑',metric:'Épaule G · douleur forte',msg:'DÉLESTAGE épaule : couper dans l\'ordre 1) GTG militaire → 2) ISO militaire H3 → 3) DB press H2 → en dernier militaire lourd H1. Face pull + rotation externe JAMAIS coupés. Observer 4-5 jours par étage.'});
  else if(dEpauleLeg.length>=2)
    flags.push({lvl:'orange',icon:'⚠️',metric:'Épaule G · gêne persistante',msg:'Premier étage de délestage : couper le GTG militaire quotidien. Maintenir face pull + rotation externe. Surveiller avant de charger le press vertical.'});

  // ── RPE effectif vs semaine courante ─────────────────────────────────────
  const rpeVals=L7.map(d=>({rpe:Number(d.log.soir?.rpe)||0,date:d.date})).filter(d=>d.rpe>0);
  if(rpeVals.length>=2){
    const avg=rpeVals.reduce((s,v)=>s+v.rpe,0)/rpeVals.length;
    const weekBloc=getBlocId(S.week);
    const blocData=weekBloc?BLOCS.find(b=>b.id===weekBloc):null;
    const prescrit=blocData?parseFloat(blocData.color==='#3b82f6'?6:blocData.color==='#8b5cf6'?7:8):7;
    if(avg>prescrit+2)
      flags.push({lvl:'red',icon:'🔴',metric:`RPE moyen ${avg.toFixed(1)}/10 (prescrit ~${prescrit})`,msg:'Fatigue accumulée importante. Déload cette semaine conseillé — réduire charges de 30% et couper 1 séance.'});
    else if(avg>prescrit+1)
      flags.push({lvl:'orange',icon:'⚠️',metric:`RPE moyen ${avg.toFixed(1)}/10`,msg:'Au-dessus du prescrit. Garder les charges mais ne pas progresser cette semaine.'});
  }

  // ── HRV ──────────────────────────────────────────────────────────────────
  const hrv7=L7.map(d=>Number(d.log.matin?.hrv)).filter(v=>v>0);
  const hrv14=L14.map(d=>Number(d.log.matin?.hrv)).filter(v=>v>0);
  if(hrv7.length>=3&&hrv14.length>=5){
    const base=hrv14.reduce((a,b)=>a+b,0)/hrv14.length;
    const rec=hrv7.slice(0,3).reduce((a,b)=>a+b,0)/Math.min(3,hrv7.length);
    const drop=(base-rec)/base;
    if(drop>0.2)
      flags.push({lvl:'red',icon:'❤️',metric:`HRV -${Math.round(drop*100)}% vs baseline`,msg:'Chute HRV significative. SNC sous tension. Priorité récupération : réduire intensité, pas volume.'});
    else if(drop>0.1)
      flags.push({lvl:'orange',icon:'⚠️',metric:`HRV -${Math.round(drop*100)}% vs baseline`,msg:'Tendance baissière HRV. Éviter les surcharges cette semaine.'});
  }

  // ── Sommeil ───────────────────────────────────────────────────────────────
  const sq3=L7.slice(0,3).map(d=>d.log.matin?.sleep_quality).filter(v=>v);
  if(sq3.length>=2&&sq3.filter(v=>v<=2).length>=2)
    flags.push({lvl:'red',icon:'😴',metric:'Sommeil dégradé (≤2/5 sur 2+ nuits)',msg:'Récupération insuffisante. Couper la séance la plus intense cette semaine.'});
  else if(sq3.length>=3&&sq3.reduce((a,b)=>a+b,0)/sq3.length<3)
    flags.push({lvl:'orange',icon:'⚠️',metric:`Qualité sommeil moy. ${(sq3.reduce((a,b)=>a+b,0)/sq3.length).toFixed(1)}/5`,msg:'Réduire le volume de 15% et prioriser le protocole cohérence cardiaque soir.'});

  // ── BOLT ─────────────────────────────────────────────────────────────────
  const bolt7=L7.map(d=>Number(d.log.matin?.bolt)).filter(v=>v>0);
  if(bolt7.length>=3){
    const trend=bolt7[0]-bolt7[bolt7.length-1];
    if(trend<-4)
      flags.push({lvl:'orange',icon:'🫁',metric:`BOLT -${Math.abs(Math.round(trend))}s cette semaine`,msg:'Régression BOLT. Augmenter cohérence cardiaque + humming. Vérifier respiration nasale pendant AGT.'});
  }

  // ── ACWR (Gabbett) ────────────────────────────────────────────────────────
  const acute=L7.reduce((s,d)=>s+(Number(d.log.soir?.rpe)||0),0);
  const chronic4w=L28.reduce((s,d)=>s+(Number(d.log.soir?.rpe)||0),0)/4;
  if(acute>0&&chronic4w>0){
    const acwr=acute/chronic4w;
    if(acwr>1.5)
      flags.push({lvl:'red',icon:'📈',metric:`ACWR ${acwr.toFixed(2)} · zone rouge`,msg:'Risque blessure élevé (Gabbett >1.5). Déload obligatoire cette semaine.'});
    else if(acwr>1.3)
      flags.push({lvl:'orange',icon:'⚠️',metric:`ACWR ${acwr.toFixed(2)} · attention`,msg:'Au-dessus du seuil optimal (0.8-1.3). Pas de surcharge. Maintenir les charges actuelles.'});
  }

  // ── SÉANCE COMPRESSÉE (jour rouge) ─────────────────────────────────────────
  // Déclencheurs : sommeil <6h OU HRV -10% OU douleur >= modérée (légère persistante ou forte)
  const todayLog = L7[0] ? L7[0].log : {};
  const tm = todayLog.matin || {};
  const sleepLow = tm.sleep_hours!==undefined && tm.sleep_hours!=='' && Number(tm.sleep_hours) < 6;
  let hrvDrop10 = false;
  if(hrv7.length>=3 && hrv14.length>=5){
    const base=hrv14.reduce((a,b)=>a+b,0)/hrv14.length;
    const rec=hrv7.slice(0,3).reduce((a,b)=>a+b,0)/Math.min(3,hrv7.length);
    if((base-rec)/base > 0.1) hrvDrop10 = true;
  }
  const painMod = (tm.douleur_genou==='forte'||tm.douleur_genou==='légère'||tm.douleur_poignet==='forte'||tm.douleur_epaule==='forte'||tm.douleur_epaule==='légère');
  if(sleepLow || hrvDrop10 || painMod){
    const raisons=[];
    if(sleepLow) raisons.push('sommeil <6h');
    if(hrvDrop10) raisons.push('HRV -10%');
    if(painMod) raisons.push('douleur ≥ modérée');
    flags.unshift({lvl:'orange',icon:'🗜️',metric:'Jour compressé conseillé ('+raisons.join(' · ')+')',msg:'Signaux de récupération basse. La version allégée du jour s\'affiche en tête de l\'onglet Séance. Règle : on coupe du VOLUME et des séances, on GARDE l\'intensité du top set (programme §2 · manuel ch. 11). Ne saute pas, allège — sauf VO2max (à remplacer par une Z2) et AGT (à supprimer) : celles-là se font entières ou pas du tout.',compressed:true});
  }

  return flags;
}

function renderFlagsCard(){
  const flags=computeFlags();
  const card=$('div',{class:'card',style:{
    borderColor:flags.some(f=>f.lvl==='red')?'#e63946':flags.some(f=>f.lvl==='orange')?'#f5a623':'#10b981',
    borderWidth:'1.5px'
  }});
  const title=$('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:flags.length?'10px':'0'}});
  const dot=flags.some(f=>f.lvl==='red')?'🔴':flags.some(f=>f.lvl==='orange')?'🟠':'🟢';
  title.appendChild($('span',{style:{fontSize:'14px',fontWeight:'700',color:'#f0f4ff'}},'📊 Analyse automatique'));
  title.appendChild($('span',{style:{fontSize:'13px',marginLeft:'auto'}},dot));
  card.appendChild(title);
  if(flags.length===0){
    card.appendChild($('div',{style:{fontSize:'12px',color:'#10b981',fontWeight:'600'}},'✓ Tous les indicateurs sont dans les normes'));
  } else {
    flags.forEach(f=>{
      const row=$('div',{style:{display:'flex',gap:'8px',alignItems:'flex-start',padding:'8px',background:'#0d1626',borderRadius:'8px',marginBottom:'6px',borderLeft:'3px solid '+(f.lvl==='red'?'#e63946':'#f5a623')}});
      row.appendChild($('span',{style:{fontSize:'16px',flexShrink:'0'}},f.icon));
      const txt=$('div',{style:{minWidth:'0'}});
      txt.appendChild($('div',{style:{fontSize:'11px',fontWeight:'700',color:f.lvl==='red'?'#e63946':'#f5a623',marginBottom:'2px'}},f.metric));
      txt.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8',lineHeight:'1.4'}},f.msg));
      row.appendChild(txt);
      card.appendChild(row);
    });
  }
  return card;
}

function tLoad(){ return load('tests_results') || {}; }
function tSave(d){ save('tests_results', d); }

// ── SCORES COMPOSITES ─────────────────────────────────────────────────────
function tPDC(){ const r=tLoad().pdc; const v=r?parseFloat(r.val):NaN; return isNaN(v)?null:v; }

function tRSA(){
  const d=tLoad(), pdc=tPDC();
  const g=k=>{ const r=d[k]; const v=r?parseFloat(r.val):NaN; return isNaN(v)?null:v; };
  const fs=g('fs3'), bp=g('bench3'), hg=g('hinge3'), tr=g('tractions');
  if(pdc==null||fs==null||bp==null||hg==null||tr==null) return null;
  const e1=x=>x*1.10;                       // 3RM → 1RM estimé (Epley)
  const pts=Math.min(tr,20)*0.10*pdc;       // tractions plafonnées à 20
  return (e1(fs)+e1(bp)+e1(hg)+pts)/pdc;
}
function tRSALabel(v){ return v==null?'—' : v<5.75?'Poor' : v<6.5?'Good' : 'Excellent'; }

function tMTI45(){
  const d=tLoad(), pdc=tPDC();
  const g=k=>{ const r=d[k]; const v=r?parseFloat(r.val):NaN; return isNaN(v)?null:v; };
  let total=0, n=0, detail=[];
  const hg=g('hinge3');
  if(hg!=null && pdc){ const r=hg/pdc;
    const p = r<1.36?0 : r<1.46?1 : r<1.56?2 : r<=1.65?3 : 4;
    total+=p; n++; detail.push(['Hinge '+r.toFixed(2)+'× PDC', p]); }
  [['pompes','Pompes HR'],['keglift','Keg lift'],['longue','Épreuve longue']].forEach(([k,lbl])=>{
    const ep=T_EPREUVES.find(e=>e.id===k), v=g(k);
    if(v!=null && ep.score){ const p=ep.score(v); total+=p; n++; detail.push([lbl,p]); }
  });
  return {total, n, detail};
}
function tMTILabel(t){ return t<8?'Poor' : t<12?'Good' : 'Excellent'; }

// VO2max estimé depuis le test 3 min all-out (course) — équation validée athlètes fonctionnels
function tVO2fromCS(){
  const r=tLoad().test3min; const cs=r?parseFloat(r.val):NaN;
  if(isNaN(cs)||cs<=0) return null;
  return 8.449*cs + 4.387 + 14.683;   // homme
}
// VO2max retenu : saisie directe prioritaire, sinon estimation 3 min
function tVO2(){
  const d=tLoad().vo2max; const v=d?parseFloat(d.val):NaN;
  if(!isNaN(v)&&v>0) return {val:v, src:'mesuré'};
  const e=tVO2fromCS();
  return e!=null ? {val:e, src:'estimé 3 min'} : null;
}

function tScoreOf(ep, res){
  if(!res || res.val===''||res.val==null) return null;
  const v = parseFloat(res.val);
  if(isNaN(v)) return null;
  return ep.score ? ep.score(v) : null;
}

// axes du radar = qualités uniques, score = meilleur score disponible sur l'axe
function tAxes(){
  const res = tLoad();
  const map = {};
  const pdc = tPDC();
  T_EPREUVES.forEach(ep=>{
    if(!ep.axe) return;                     // PDC : donnée, pas une qualité
    if(!map[ep.axe]) map[ep.axe] = {axe:ep.axe, cat:ep.cat, scores:[], tested:false};
    const r = res[ep.id];
    if(r && r.val!=='') map[ep.axe].tested = true;
    let sc = null;
    if(ep.ratio && r && r.val!=='' && pdc){  // 3RM : score = ratio atteint / ratio Good
      const ratio = parseFloat(r.val)/pdc;
      const g = ep.ratio;
      sc = ratio < g*0.8 ? 0 : ratio < g*0.92 ? 1 : ratio < g ? 2 : ratio < g*1.15 ? 3 : 4;
    } else { sc = tScoreOf(ep, r); }
    if(sc!=null) map[ep.axe].scores.push(sc);
  });
  // VO2max : compléter par l'estimation issue du test 3 min si pas de mesure directe
  const vo2 = tVO2();
  if(vo2 && map['VO2max / PMA'] && !map['VO2max / PMA'].scores.length){
    map['VO2max / PMA'].tested = true;
    const v=vo2.val;
    map['VO2max / PMA'].scores.push(v<45?0 : v<50?1 : v<55?2 : v<60?3 : 4);
  }
  // Le RSA n'alimente AUCUN axe : les axes Force max sont déjà notés en ratio du PDC.
  // Il reste un score composite, affiché en bas — sinon les mêmes 3RM compteraient deux fois.
  return Object.values(map).map(a=>({
    ...a, score: a.scores.length ? a.scores.reduce((x,y)=>x+y,0)/a.scores.length : null
  }));
}


// ══════════════════════════════════════════════════════════════════════════
// CHANTIER 57 — LE PONT ENTRE CE QUI SE NOTE ET CE QUI S'ENTRAÎNE
// ══════════════════════════════════════════════════════════════════════════
// L'app portait DEUX vocabulaires de qualités qui ne se parlaient pas :
//   · taxonomies.qualities du catalogue (20 depuis ce chantier) — ce qui S'ENTRAÎNE,
//     porté par les fiches d'exercice ;
//   · T_EPREUVES[].axe (18 axes) — ce qui SE NOTE, les branches du radar.
// Le manuel prescrit une « grille d'audit permanente : toute qualité exigée qui n'y figure pas
// est un manque à traiter » — mais cette grille ne pouvait pas tourner, faute de correspondance
// déclarée entre les deux listes. Résultat : le front squat sans créneau, les dips sans vecteur
// et le sélecteur quadriceps mort ont tous dû être trouvés À LA MAIN, en trois audits successifs.
//
// Cette table déclare, pour chaque axe noté, CE QUI COMPTE COMME VECTEUR D'ENTRAÎNEMENT :
//   quals    — qualités canoniques (après résolution des alias) ;
//   cats     — filtre de catégorie : « Force max BAS » et « Force max HAUT » partagent la même
//              qualité (force_max) et ne se distinguent que par là. Sans ce filtre, un trou sur
//              une moitié du corps serait masqué par l'autre ;
//   patterns — filtre de pattern, quand la catégorie ne suffit pas (axes de puissance) ;
//   roles    — créneaux nommés, quand la donnée ne peut PAS distinguer : le vélo porte un seul
//              identifiant pour la Z2, le seuil et la VO2max ; seul le rôle du créneau les sépare ;
//   exclure  — fiches à ne pas compter, avec le motif écrit ;
//   couches  — où le vecteur a le droit de vivre : 'seance', 'gtg', 'matin' ;
//   plancher — nombre de vecteurs GARANTIS attendus par semaine ;
//   motif    — absence ASSUMÉE : l'axe s'affiche en gris, pas en rouge.
//
// ⚠ RÈGLE DE LECTURE, ET C'EST TOUT L'INTÉRÊT DU COMPTEUR :
// un créneau OPTIONNEL n'est pas un vecteur garanti. Le moteur saute sans substitut un créneau
// optionnel indisponible — c'est exactement ce qui a rendu invisible pendant des semaines le fait
// que l'unique tirage horizontal de la semaine pouvait disparaître en silence (chantier 55).
// Le compteur sépare donc TOUJOURS obligatoires et optionnels : un axe tenu uniquement par des
// créneaux optionnels s'affiche en orange — il disparaît intégralement dès qu'on comprime.
const T_AXE_SPEC = {
  'Force max BAS':        {quals:['force_max','force_unilat_antiasym'], cats:['bas_force'],
                           couches:['seance'], plancher:2},
  'Force max HAUT':       {quals:['force_max'], cats:['haut_force'],
                           couches:['seance','gtg'], plancher:2},
  'Endur. force HAUT':    {quals:['endurance_force'], cats:['haut_force','haut_iso_volume'],
                           couches:['seance'], plancher:1},
  'Endur. force BAS':     {quals:['endurance_force'], cats:['bas_force'],
                           couches:['seance','gtg','matin'], plancher:1},
  // Puissance : la qualité seule ne suffit pas — le pattern dit quel segment produit l'effort.
  // Le bench et le militaire portent un tag « alactique » qui décrit leur MÉTHODE (top set
  // conjugate), pas un geste balistique : ils sont exclus des axes de puissance, où ils
  // masqueraient l'absence de vrai vecteur explosif du haut du corps.

// Couverture d'un axe sur la semaine active : ce que la semaine FAIT réellement, créneau par
// créneau, en passant par le résolveur du moteur — donc matériel coché, contre-indications du
// jour et substitutions comprises. Ce n'est pas la lecture d'une intention, c'est un comptage.
function tAxeCouverture(axeName, gabKey){
  const spec = T_AXE_SPEC[axeName];
  if(!spec) return null;
  // CHANTIER 70 — périmètre du comptage : semaine active par défaut, sinon le gabarit simulé.
  const gab = (gabKey && gabKey!=='actif') ? M_GABARITS[gabKey] : null;
  const SEM = gab && gab.semaine ? gab.semaine : M_SEMAINE_ACTIVE;
  const SEM_IDS = Object.keys(SEM);
  const motifGabarit = gab && gab.absences ? gab.absences[axeName] : null;
  const out = {axe:axeName, spec, obl:[], opt:[], gtg:[], matin:[], gabarit:gabKey||'actif',
               motifGabarit};
  if(gab && gab.equip) M_EQUIP_OVERRIDE = gab.equip;
  try {
  const matchQuals = (quals) => spec.quals && quals.some(q => spec.quals.indexOf(q)>=0);
  const hitSeance = (exId, role) => {
    if(spec.exclure && spec.exclure.indexOf(exId)>=0) return false;
    if(spec.roles) return spec.roles.indexOf(role)>=0;
    const ex = M_EX_BY_ID[exId]; if(!ex) return false;
    if(!matchQuals(M_QUAL_OF(exId))) return false;
    if(spec.cats && spec.cats.indexOf(ex.category)<0) return false;
    if(spec.patterns && spec.patterns.indexOf(ex.pattern)<0) return false;
    return true;
  };
  if(spec.couches.indexOf('seance')>=0){
    SEM_IDS.forEach(sid=>{
      const st = MTPL.session_types.find(x=>x.id===sid); if(!st) return;
      let res;
      try { res = moteurResolveSession(st).results; } catch(_){ return; }
      res.forEach(r=>{
        if(!r.exId || !hitSeance(r.exId, r.slot.role)) return;
        const item = {jour:SEM[sid], seance:st.nom,
                      role:(M_ROLE_LABEL[r.slot.role] || r.slot.role.replace(/_/g,' ')),
                      ex:(M_EX_BY_ID_NAME[r.exId]||r.exId)};
        (r.slot.obligatoire ? out.obl : out.opt).push(item);
      });
    });
  }
  if(spec.couches.indexOf('gtg')>=0){
    GTG_EXERCICES.forEach(g=>{
      if(!matchQuals(M_QUALS_GTG[g.id]||[])) return;
      const gx = M_GTG_EX[g.id];                                   // chantier 69
      if(gx && !moteurExerciseStatus(gx).ok) return;
      out.gtg.push({ex:g.name});
    });
  }
  if(spec.couches.indexOf('matin')>=0){
    const dispo = moteurEquipment();
    ROUTINE_MATIN.forEach(r=>{
      if(!matchQuals(M_QUALS_MATIN[r.id]||[])) return;
      const eq = M_MATIN_EQ[r.id];                                  // chantier 69
      if(eq && !eq.every(x=>dispo.indexOf(x)>=0)) return;
      out.matin.push({ex:r.name});
    });
  }
  } finally { M_EQUIP_OVERRIDE = null; }
  const garantis = out.obl.length + out.gtg.length + out.matin.length;
  out.garantis = garantis;
  out.total = garantis + out.opt.length;
  out.niveau = (spec.motif || motifGabarit) ? 'assume'
             : (out.total === 0 ? 'trou'
             : (garantis === 0 ? 'optionnel'
             : (garantis < spec.plancher ? 'mince' : 'ok')));
  return out;
}
const T_NIVEAU_STYLE = {
  ok:        {c:'#10b981', p:'●'},
  mince:     {c:'#f59e0b', p:'▲'},
  optionnel: {c:'#f97316', p:'▲'},
  trou:      {c:'#ef4444', p:'■'},
  assume:    {c:'#475569', p:'○'}
};
function tCouvertureTexte(cv){
  if(cv.niveau === 'assume' && !cv.obl.length && !cv.opt.length && !cv.gtg.length && !cv.matin.length)
    return 'aucun vecteur — absence assumée';
  const bits = [];
  if(cv.obl.length)   bits.push(cv.obl.length+' créneau'+(cv.obl.length>1?'x':'')+' obligatoire'+(cv.obl.length>1?'s':''));
  if(cv.opt.length)   bits.push(cv.opt.length+' optionnel'+(cv.opt.length>1?'s':''));
  if(cv.gtg.length)   bits.push(cv.gtg.length+' GTG');
  if(cv.matin.length) bits.push(cv.matin.length+' routine');
  if(!bits.length) return 'AUCUN VECTEUR dans la semaine';
  if(cv.niveau === 'optionnel') return bits.join(' · ')+' — aucun vecteur garanti';
  return bits.join(' · ');
}
function tCouvertureTooltip(cv){
  const L = [];
  L.push('AXE : '+cv.axe);
  L.push('Ce qui compte comme vecteur : '+
    (cv.spec.roles ? 'créneaux ['+cv.spec.roles.join(', ')+']'
                   : 'qualités ['+(cv.spec.quals||[]).join(', ')+']'
                     + (cv.spec.cats ? ' · catégories ['+cv.spec.cats.join(', ')+']' : '')
                     + (cv.spec.patterns ? ' · patterns ['+cv.spec.patterns.join(', ')+']' : '')));
  L.push('Couches lues : '+cv.spec.couches.join(' + '));
  if(cv.gabarit && cv.gabarit!=='actif')
    L.push('Périmètre simulé : '+M_GABARITS[cv.gabarit].label);
  if(cv.motifGabarit){ L.push(''); L.push('⬛ '+cv.motifGabarit); return L.join('\n'); }
  if(cv.spec.motif){ L.push(''); L.push('⬛ '+cv.spec.motif); return L.join('\n'); }
  L.push('');
  const bloc = (titre, arr) => { if(!arr.length) return;
    L.push(titre+' ('+arr.length+')');
    arr.forEach(i=>L.push('  · '+(i.jour? i.jour+' '+i.seance+' — '+i.role+' : ' : '')+i.ex)); L.push(''); };
  bloc('CRÉNEAUX OBLIGATOIRES', cv.obl);
  bloc('CRÉNEAUX OPTIONNELS — sautés sans substitut si indisponibles', cv.opt);
  bloc('GTG (quotidien, non fatigant)', cv.gtg);
  bloc('ROUTINE DU MATIN', cv.matin);
  if(cv.niveau==='optionnel')
    L.push('⚠ Aucun créneau obligatoire : cet axe disparaît intégralement dès qu\'une séance est '+
           'comprimée, ou dès qu\'un matériel manque — sans aucun message. C\'est le défaut qui a '+
           'coûté des semaines sur le tirage horizontal (chantier 55).');
  else if(cv.niveau==='trou')
    L.push('⛔ Aucun vecteur, et aucun motif écrit. Soit l\'axe mérite un créneau, soit son absence '+
           'doit être argumentée dans T_AXE_SPEC — pas laissée en silence.');
  else if(cv.niveau==='mince')
    L.push('Plancher attendu : '+cv.spec.plancher+' vecteurs garantis par semaine.');
  return L.join('\n');
}

const T_CAT_LABEL = {force:'FORCE', puiss:'PUISSANCE', filiere:'FILIÈRES', oper:'OPÉRATIONNEL', struct:'STRUCTURE'};

// regroupe les 18 axes en 5 familles (mêmes familles que la carte de couverture du manuel)
function tAxesGrouped(){
  const axes = tAxes();
  return ['force','puiss','filiere','oper','struct'].map(cat=>{
    const subs = axes.filter(a=>a.cat===cat);
    const scored = subs.filter(a=>a.score!=null);
    return {
      cat, label:T_CAT_LABEL[cat],
      score: scored.length ? scored.reduce((s,a)=>s+a.score,0)/scored.length : null,
      tested: subs.some(a=>a.tested),
      nTested: subs.filter(a=>a.tested).length,
      n: subs.length,
      subs
    };
  });
}

// items: [{label, score(0-4|null), tested, color}] · onItemClick(it,i) rend les points/labels cliquables
function tRadarSVGGeneric(items, onItemClick){
  // v4.5 : avec 18 axes, les libellés voisins se chevauchaient en haut du radar. On resserre
  // le polygone pour dégager de la marge et on éloigne un peu les libellés de l'anneau.
  const n = items.length, cx=190, cy=175, R = n <= 6 ? 112 : 96;
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 380 350');
  svg.setAttribute('width','100%');
  const mk=(t,at)=>{ const e=document.createElementNS(NS,t); Object.entries(at).forEach(([k,v])=>e.setAttribute(k,v)); return e; };
  // cercles
  [1,2,3,4].forEach(lv=>{
    svg.appendChild(mk('circle',{cx,cy,r:R*lv/4,fill:'none',stroke:'#1e293b','stroke-width':1,'stroke-dasharray':'3 3'}));
  });
  const pt=(i,r)=>{ const a=-Math.PI/2 + i*2*Math.PI/n; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  // v4.5 : la lisibilité dépend du NOMBRE d'axes, pas du fait qu'ils soient cliquables.
  // 5 familles → gros labels ; 18 qualités → petits, sinon ça se chevauche.
  const fs = n <= 6 ? 10.5 : 8.2;
  const hitR = n <= 6 ? 22 : 13;
  // rayons + labels
  items.forEach((it,i)=>{
    const [x,y]=pt(i,R);
    const grp = mk('g',{});
    svg.appendChild(grp);
    grp.appendChild(mk('line',{x1:cx,y1:cy,x2:x,y2:y,stroke:'#1e293b','stroke-width':1}));
    const [lx,ly]=pt(i, R + (n <= 6 ? 17 : 20));
    const anchor = lx>cx+6?'start':(lx<cx-6?'end':'middle');
    // découpe en 2 lignes si le libellé est long
    const w = it.label.split(' ');
    let l1=it.label, l2='';
    if(it.label.length>13 && w.length>1){
      let acc='';
      for(let k=0;k<w.length;k++){
        if((acc+' '+w[k]).trim().length<=13){ acc=(acc+' '+w[k]).trim(); }
        else { l1=acc; l2=w.slice(k).join(' '); break; }
      }
      if(!l2){ l1=it.label; }
    }
    const col = it.tested? '#e2e8f0':'#475569';
    const dy = l2 ? -3 : 0;
    const t=mk('text',{x:lx,y:ly+dy,'font-size':fs,'font-weight':700,fill:col,'text-anchor':anchor});
    t.textContent = l1;
    grp.appendChild(t);
    if(l2){
      const t2=mk('text',{x:lx,y:ly+7,'font-size':fs,'font-weight':700,fill:col,'text-anchor':anchor});
      t2.textContent = l2;
      grp.appendChild(t2);
    }
    if(onItemClick){
      grp.setAttribute('style','cursor:pointer');
      grp.appendChild(mk('circle',{cx:lx,cy:ly,r:hitR,fill:'transparent'}));
      grp.addEventListener('click',()=>onItemClick(it,i));
    }
  });
  // polygone des scores
  const pts = items.map((it,i)=> pt(i, it.score!=null ? R*it.score/4 : 0));
  if(items.some(it=>it.score!=null)){
    svg.appendChild(mk('polygon',{points:pts.map(p=>p.join(',')).join(' '),
      fill:'#f5a623','fill-opacity':0.18,stroke:'#f5a623','stroke-width':2}));
  }
  items.forEach((it,i)=>{
    const [x,y]=pt(i, it.score!=null ? R*it.score/4 : 0);
    if(it.score!=null){
      svg.appendChild(mk('circle',{cx:x,cy:y,r:3.5,fill:it.color||'#f5a623',stroke:'#0d1525','stroke-width':1.5}));
    } else {
      const [ox,oy]=pt(i,R);
      svg.appendChild(mk('circle',{cx:ox,cy:oy,r:3,fill:'none',stroke:'#475569','stroke-width':1.5,'stroke-dasharray':'2 2'}));
    }
  });
  return svg;
}

// v4.5 — TROIS MODES DE RADAR, tous cliquables :
//   null   → les 5 FAMILLES (vue d'ensemble) · un clic zoome sur la famille
//   'all'  → les 18 QUALITÉS d'un coup (vue historique, réintroduite à la demande de J)
//   <cat>  → les qualités d'UNE famille
// Dans les deux derniers, un clic sur un axe FILTRE la liste des tests sur cette qualité :
// le radar cesse d'être une image et devient la navigation de l'écran.
function tRadarSVG(mode){
  if(mode === 'all'){
    const items = tAxes().map(a=>({label:a.axe, score:a.score, tested:a.tested, color:T_CAT_COLOR[a.cat], axe:a.axe}));
    return tRadarSVGGeneric(items, (it)=>{ S.testsAxeFocus = it.axe; render(); });
  }
  if(mode){
    const g = tAxesGrouped().find(g=>g.cat===mode);
    if(g){
      const items = g.subs.map(a=>({label:a.axe, score:a.score, tested:a.tested, color:T_CAT_COLOR[a.cat], axe:a.axe}));
      return tRadarSVGGeneric(items, (it)=>{ S.testsAxeFocus = it.axe; render(); });
    }
  }
  const items = tAxesGrouped().map(g=>({label:g.label, score:g.score, tested:g.nTested>0, color:T_CAT_COLOR[g.cat], cat:g.cat}));
  return tRadarSVGGeneric(items, (it)=>{ S.testsRadarZoom = it.cat; S.testsAxeFocus = null; render(); });
}

function renderTests(){
  const wrap=$('div',{});
  const res=tLoad();
  const axes=tAxes();
  const done=axes.filter(a=>a.tested).length;
  const moy=axes.filter(a=>a.score!=null);
  const scoreGlobal = moy.length ? (moy.reduce((s,a)=>s+a.score,0)/moy.length) : null;

  wrap.appendChild($('div',{class:'section-hdr'},'🎯 Batterie BE READY'));
  wrap.appendChild($('div',{style:{fontSize:'11px',color:'#64748b',marginBottom:'8px'}},
    done+' / '+axes.length+' qualités mesurées'+(scoreGlobal!=null? ' · moyenne '+scoreGlobal.toFixed(2)+'/4':'')));

  // plancher éliminatoire
  const asym = res.asym ? parseFloat(res.asym.val) : null;
  const lg = res.longue ? tScoreOf(T_EPREUVES.find(e=>e.id==='longue'), res.longue) : null;
  const rsaFloor = tRSA();
  const alerts=[];
  if(asym!=null && asym>20) alerts.push('Asymétrie '+asym+' % > 20 % — score plafonné');
  if(lg===0) alerts.push('Épreuve longue à 0 pt — score plafonné');
  if(rsaFloor!=null && rsaFloor<5.0) alerts.push('RSA '+rsaFloor.toFixed(2)+' < 5,0 — score plafonné');

  // ── SCORES COMPOSITES (info) ──
  const rsa = tRSA(), mti = tMTI45();
  const box=$('div',{style:{background:'#0d1525',border:'1px solid #1e2d42',borderRadius:'10px',padding:'10px 12px',marginTop:'10px'}});
  box.appendChild($('div',{style:{fontSize:'10px',fontWeight:'800',color:'#f5a623',marginBottom:'4px'}},'SCORES COMPOSITES'));
  box.appendChild($('div',{style:{fontSize:'8.5px',color:'#64748b',marginBottom:'8px',lineHeight:'1.45'}},
    'Deux lectures complémentaires. Le RSA mesure la FORCE RELATIVE seule : il dit si tu es assez fort pour le métier. Le MTI 45+ mesure la POLYVALENCE — force, endurance de force, work capacity, moteur : il dit si aucune qualité ne décroche. Un RSA élevé avec un 45+ bas signale un athlète fort mais incomplet.'));

  const l1=$('div',{style:{display:'flex',alignItems:'baseline',gap:'7px',marginBottom:'3px'}});
  l1.appendChild($('span',{style:{fontSize:'11px',fontWeight:'700',flex:'1'}},'RSA (MTI)'));
  l1.appendChild($('span',{style:{fontSize:'14px',fontWeight:'800',
    color: rsa==null?'#475569' : rsa>=6.5?'#10b981' : rsa>=5.75?'#f59e0b':'#ef4444'}},
    rsa==null?'—':rsa.toFixed(2)));

  box.appendChild($('div',{style:{fontSize:'8.5px',color:'#475569',marginBottom:'7px'}},

  const l2=$('div',{style:{display:'flex',alignItems:'baseline',gap:'7px',marginBottom:'3px'}});

    color: mti.total>=12?'#10b981' : mti.total>=8?'#f59e0b':'#ef4444'}}, mti.total+'/16'));
  l2.appendChild($('span',{style:{fontSize:'10px',color:'#64748b'}}, mti.n?tMTILabel(mti.total):''));
  box.appendChild(l2);
  box.appendChild($('div',{style:{fontSize:'8.5px',color:'#475569'}},
    mti.n ? mti.detail.map(d=>d[0]+' '+d[1]+'pt').join(' · ')+(mti.n<4?' — '+(4-mti.n)+' épreuve(s) manquante(s)':'')
          : 'Hinge 3RM + pompes + keg lift + épreuve longue'));
  box.appendChild($('div',{style:{fontSize:'8.5px',color:'#475569',marginTop:'2px'}},'Good 8-11 · Excellent ≥ 12'));

  const v2=tVO2();
  if(v2){
    const l3=$('div',{style:{display:'flex',alignItems:'baseline',gap:'7px',marginTop:'7px',paddingTop:'7px',borderTop:'1px solid #1e2d42'}});
    l3.appendChild($('span',{style:{fontSize:'11px',fontWeight:'700',flex:'1'}},'VO2max'));

  wrap.appendChild(box);

  return wrap;
}

function showTooltip(e, text){
  closeTooltip();
  // Support multi-lignes : découpe sur les retours à la ligne, une idée par ligne.
  const lines = String(text).split(/\n+/).filter(x=>x.trim());
  const body = $('div',{});
  if(lines.length>1){
    lines.forEach(ln=>body.appendChild($('div',{style:{padding:'2px 0'}}, ln.trim())));
  } else {
    body.appendChild($('span',{}, text));
  }
  const tt = $('div',{class:'tooltip'}, body, $('span',{class:'tooltip-close',onclick:closeTooltip},'✕ fermer'));
  const rect = e.target.getBoundingClientRect();
  document.body.appendChild(tt);
  const ttH = tt.offsetHeight;
  const top = rect.top > ttH + 20 ? rect.top - ttH - 8 : rect.bottom + 8;
  tt.style.top = top+'px';
  tt.style.left = Math.max(8, Math.min(window.innerWidth - 296, rect.left - 140))+'px';
  S.tooltipTarget = tt;
}

function closeTooltip(){ if(S.tooltipTarget){ S.tooltipTarget.remove(); S.tooltipTarget=null; } }
document.addEventListener('click', e=>{ if(S.tooltipTarget && !S.tooltipTarget.contains(e.target)) closeTooltip(); });

// ── STATS: progression chart per exercise ──────────────────────────────────
let _statsEx = null;
let _statsFmt = null;

// ── Libellé de format normalisé pour les statistiques ────────────────────────────────────
// Les stats séparent les charges par schéma de séries (un 3 reps et un 8-12 ne se comparent pas),
// mais le TEXTE des formats a changé au fil des versions : le même top set apparaissait alors sous
// trois libellés différents. On ramène chaque format à son schéma de répétitions.
function moteurCanonFmt(fmt){
  if(!fmt) return '';
  const f = String(fmt);
  if(/top set/i.test(f) && !/jamais|pas de|sans/i.test(f)) return 'Top set ×3';
  if(/3RM|1RM|test/i.test(f)) return 'Test RM';
  let m = f.match(/[×x]\s*(\d+)\s*[-\u2013]\s*(\d+)\s*s\b/i);  // 3×30-40 s -> tenue
  if(m) return m[1]+'-'+m[2]+' s';
  m = f.match(/[×x]\s*(\d+)\s*s\b/i);                          // 3×45 s -> tenue
  if(m) return m[1]+' s';
  m = f.match(/[×x]\s*(\d+)\s*[-\u2013]\s*(\d+)/);      // 3-4×8-12 -> 8-12
  if(m) return m[1]+'-'+m[2]+' reps';
  m = f.match(/[×x]\s*(\d+)/);                                  // 4×5 -> 5
  if(m) return m[1]+' reps';
  m = f.match(/(\d+)\s*[-\u2013]\s*(\d+)\s*(?:reps?|r\b)/i);
  if(m) return m[1]+'-'+m[2]+' reps';
  m = f.match(/(\d+)\s*[-\u2013]\s*(\d+)\s*s\b/i);           // 30-40 s -> tenue
  if(m) return m[1]+'-'+m[2]+' s';
  return f.length>18 ? f.slice(0,18)+'…' : f;
}
// Catégorie de stats basée sur les REPS RÉELLES quand elles sont saisies.
// Sinon on garde la catégorie prévue (moteurCanonFmt du format).
// Exceptions gardant la catégorie prévue même avec reps réelles : top set (le ×3 est nominal, la
// perf réelle est la charge du triple), tests RM, et tenues en secondes (pas des reps).
function moteurCanonFmtReps(fmtVal, reps){
  const prevu = moteurCanonFmt(fmtVal||'');
  if(reps==null || reps==='' || isNaN(Number(reps))) return prevu;
  // Cas spéciaux : on NE recatégorise PAS sur les reps réelles.
  if(/top set|test rm/i.test(prevu)) return prevu;   // top set / test : catégorie nominale conservée
  if(/\bs\b|\bs$| s$/.test(prevu)) return prevu;         // tenues en secondes : pas des reps
  // Sinon : la catégorie DEVIENT le nombre de reps réellement effectuées.
  return Number(reps)+' reps';
}

function getAllExerciseData(){
  // Scan all localStorage logs, collect {exName: [{date, charge, rpe}]}
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(!k || !k.startsWith('log:')) continue;
    const dateStr = k.substring(4);
    let log;
    try{ log = JSON.parse(localStorage.getItem(k)); }catch(e){ continue; }
    if(!log) continue;
    Object.keys(log).forEach(key=>{
      if(!key.startsWith('ex_')) return;
      const entry = log[key];
      if(!entry || (!entry.charge && !entry.rpe)) return;

      let baseName, blocId, fmtVal, sessionLabel;
      const mMoteur = key.match(/^ex_moteur_(.+)$/);
      if(mMoteur){
        // Clé = ex_moteur_<exerciceId>[@<séance>]. Le suffixe de séance isole les séries cochées
        // d'une séance à l'autre, mais NE DOIT PAS scinder les statistiques : un même mouvement
        // garde un seul historique de performance quelle que soit la séance où il a été fait.
        const rawId = mMoteur[1].split('@')[0];
        const exObj = (typeof M_EX_BY_ID_NAME!=='undefined') ? M_EX_BY_ID_NAME[rawId] : null;
        baseName = exObj || rawId;
        blocId = 0; fmtVal = moteurCanonFmt(entry.fmt||'');
        const doneSessions = (log.moteur_sessions||[]).map(sid=>{
          const st = (typeof MTPL!=='undefined') ? MTPL.session_types.find(s=>s.id===sid) : null;
          return st ? st.nom : sid;
        });
        sessionLabel = doneSessions.length ? doneSessions.join('/') : 'Moteur';
      } else {
        // Ancien format Guyane : ex_<seance>_b<bloc>_<idx>
        const m = key.match(/^ex_(.+)_b(\d)_(\d+)(?:_\w+)?$/);
        if(!m) return;
        const seanceName=m[1], blocNum=Number(m[2]), exIdx=Number(m[3]);
        const seance=SEANCES[seanceName];
        if(!seance||!seance.blocs||!seance.blocs[blocNum]) return;
        const exList=seance.blocs[blocNum].exercices||[];
        const ex=exList[exIdx];
        if(!ex) return;
        baseName=ex.name.replace(/[\u2605\u26a1\u26a0]/g,'').replace(/\s+/g,' ').trim().split('\u00b7')[0].trim();
        blocId = blocNum; fmtVal = moteurCanonFmt(ex.fmt||'');
        sessionLabel = seanceName;
      }
      // Un id brut qui aurait échappé au catalogue (underscores, pas d'espace) est normalisé
      // avant canonicalisation, sinon il crée un bucket parasite à côté du vrai exercice.
      if(baseName && baseName.indexOf('_')>=0 && baseName.indexOf(' ')<0){
        baseName = baseName.replace(/_/g,' ').replace(/\b\w/g, ch=>ch.toUpperCase());
      }
      // Canonicalisation : fusionner les variantes du même exercice (noms changés entre blocs, et entre
      // l'ancien système Guyane et le nouveau moteur — mêmes mouvements, même bucket de stats)
      const _canon=[
        [/militaire/i,'Militaire'],
        [/db bench inclin/i,'DB Bench incliné'],
        [/bench plat/i,'Bench plat'],
        [/db press vertical/i,'DB Press vertical'],
        [/pendlay/i,'Pendlay Row'],
        [/gorilla/i,'Gorilla Row'],
        [/chin-ups|pull-up/i,'Chin-ups'],
        [/romanian|^rdl|\brdl\b/i,'RDL'],
        [/zercher/i,'Zercher'],
        [/front squat/i,'Front Squat'],
        [/copenhagen/i,'Copenhagen'],
        [/bulgarian/i,'Bulgarian'],
        [/nordic/i,'Nordic Curl'],
        [/pallof/i,'Pallof'],
        [/face pull/i,'Face Pull'],
        [/rotation ext/i,'Rotation externe'],
        [/nuque/i,'Nuque ISO'],
        [/farmer carry/i,'Farmer carry'],
        [/alactique|kb swing/i,'Alactique KB'],
        [/dragon flag/i,'Dragon flag'],
        [/back extension/i,'Back extension'],
      ];
      for(const [re,name] of _canon){ if(re.test(baseName)){ baseName=name; break; } }
      if(!data[baseName]) data[baseName]=[];
      const chargeNum=(()=>{
        if(typeof entry.charge === 'number') return entry.charge;
        let raw=String(entry.charge||'').replace(',','.').trim();
        if(!raw) return null;
        // Format "NxM" ou "Nx M kg" → prendre M (la charge par main), pas N (le nombre)
        let mx=raw.match(/(\d+(?:\.\d+)?)\s*[x\u00d7]\s*(\d+(?:\.\d+)?)/i);
        if(mx) return parseFloat(mx[2]);
        // Format "PDC+Nkg" → prendre N (le lest)
        let mp=raw.match(/(?:PDC|pdc)\s*\+\s*(\d+(?:\.\d+)?)/);
        if(mp) return parseFloat(mp[1]);
        // Sinon premier nombre
        let m1=raw.match(/(\d+(?:\.\d+)?)/);
        return m1?parseFloat(m1[1]):null;
      })();
      if(chargeNum===null||isNaN(chargeNum)) return; // skip if no charge entered
      const repsReel = (entry.reps!=null&&entry.reps!=='')?Number(entry.reps):null;
      const fmtCat = moteurCanonFmtReps(fmtVal, repsReel);
      data[baseName].push({date:dateStr, charge:chargeNum, chargeRaw: entry.charge!=null?String(entry.charge):'', rpe:Number(entry.rpe)||null, reps:repsReel, fmt:fmtCat, fmtPrevu:fmtVal, bloc:blocId, session:sessionLabel});
    });
  }
  // Sort each by date
  Object.values(data).forEach(arr=>arr.sort((a,b)=>a.date.localeCompare(b.date)));
  return data;
}

// Ratios ×PDC (1RM), sourcés par exercice — convertis en 3RM (Epley ≈ ×0.909) pour être directement
// comparables aux séances réelles en 5×3 (le top set d'un 5×3 est un effort proche du 3RM).
// Le vrai MTI Relative Strength Assessment (màj janvier 2021) = Front Squat + Hinge Lift + Bench Press
// (1RM chacun) + tractions strictes (plafond 20), score = (somme 1RM + tractions×10%PDC) / PDC.
// Military Press n'est PAS dans le RSA ni dans aucun standard MTI — retiré des standards sourcés,
// suivi à la place en % du Bench (repère auto-calibré, pas de prétention de standard externe).
const M_STANDARDS_RATIOS = {
  bench_plat_barre: {label:'Bench Press', min:1.0, obj:1.25, exc:1.5, source:'MTI (RSA)'},
  rdl: {label:'Hinge — RDL hanches-hautes (test MTI Hinge Lift)', min:1.5, obj:1.75, exc:2.0, source:'MTI Hinge Lift (RSA)'},
  front_squat: {label:'Front Squat', min:1.0, obj:1.25, exc:1.5, source:'MTI (RSA)'},

  squat_clean: {label:'Squat Clean', min:null, obj:null, exc:1.25, source:'MTI (hors RSA — seule Excellence publiée)'},
  // ⏸ CHANTIER 45 — EN ATTENTE D'ARBITRAGE DE J. Le Zercher n'a AUCUN standard externe publié :
  // le barème ci-dessous est celui du front squat, appliqué à un mouvement que le manuel décrit
  // lui-même comme « structurellement plus dur ». Un standard sans référence externe n'en est pas un.
  // Recommandation du chantier : le RETIRER du tableau et suivre le Zercher en tendance personnelle
  // (comme le Pendlay Row). Alternative : abattement explicite de −10 à −15 %.
  // Conservé à titre CONSERVATOIRE tant que J n'a pas tranché — le libellé le dit à l'écran.
  zercher_squat: {label:'Zercher Squat ⏸ (repère indicatif)', min:1.0, obj:1.25, exc:1.5, source:'⏸ à arbitrer — barème du front squat appliqué par défaut ; aucun standard Zercher publié, et le Zercher est structurellement plus dur'},
};
const M_RM_FACTOR = 0.909; // 3RM ≈ 1RM × 0.909 (Epley)
// e1RM honnête : Epley avec les reps réelles du format + la réserve (RIR = 10 − RPE, plafonné à 4).
// Ne suppose plus que la dernière charge est un 3RM — un 4×6 @RPE 8 et un top set 5×3 @RPE 9
// donnent chacun leur vraie estimation. Formats gérés : '3RM', '4×6', '3-4×6', '3×6-8' (borne
// basse), rejet des durées ('2-3×8s'). Sans format ni RPE : défaut historique 3 reps, RIR 0.
function moteurEst1RM(entry){
  if(!entry || entry.charge==null || entry.charge==='') return null;
  const w = parseFloat(String(entry.charge).replace(',','.'));
  if(!isFinite(w) || w<=0) return null;
  const fmt = entry.fmt ? String(entry.fmt) : '';
  let reps = null;
  let m = fmt.match(/(\d+)\s*RM/i);
  if(m) reps = Number(m[1]);
  if(reps==null){
    m = fmt.match(/[×x]\s*(\d+)\s*([a-z]?)/i);
    if(m && m[2].toLowerCase()!=='s') reps = Number(m[1]); // '×8s' = secondes, pas des reps
  }
  if(reps==null) reps = 3;
  let rir = 0;
  const rpe = parseFloat(entry.rpe);
  if(isFinite(rpe)) rir = Math.min(4, Math.max(0, 10 - rpe));
  return w * (1 + (reps + rir)/30);
}
function moteurGetBodyweight(){

  const log = load('user_bodyweight_log') || [];

function moteurStandardsFor(exId){
  const r = M_STANDARDS_RATIOS[exId];
  if(!r) return null;
  const pdc = moteurGetBodyweight();
  const conv = v => v==null ? null : Math.round(v*pdc*M_RM_FACTOR);
  return { label: r.label, source: r.source, min: conv(r.min), obj: conv(r.obj), exc: conv(r.exc) };
}
// Score composite du vrai MTI Relative Strength Assessment, à partir des derniers 1RM estimés connus
// (dérivés des dernières charges/RPE saisies). Score ≥5 = "Good" ou mieux pour un athlète tactique.
function moteurRSAScore(){
  const pdc = moteurGetBodyweight();
  const est1RM = exId => {
    const last = moteurLastExerciseLog(exId);
    return last ? moteurEst1RM(last.entry) : null; // Epley reps réelles + RIR (plus de ÷0,909 aveugle)
  };
  const trm = moteurGetTestRM();
  const from3RM = v => { const n = Number(v); return (v!=null && v!=='' && isFinite(n) && n>0) ? n / M_RM_FACTOR : null; };
  // RM testé prioritaire, e1RM estimé des séances en repli
  const fs = from3RM(trm.front_squat_3rm) || est1RM('front_squat') || est1RM('zercher_squat');
  // Composante hinge = RDL hanches hautes barre du sol (= Hinge Lift MTI). Le RM testé prime ;
  // à défaut on estime sur le RDL lui-même, puis sur la trap bar (proxy maison le plus proche).
  // ⚠ Le SOULEVÉ DE TERRE CONVENTIONNEL est EXCLU du score (décision de J, 30/08 : « il n'entre
  // dans aucun score ») — il figurait encore ici comme repli, ce qui pouvait injecter dans le RSA
  // un mouvement officiellement retiré. Retiré en v4.3.
  const hinge = from3RM(trm.rdl_3rm) || est1RM('rdl') || est1RM('trap_bar_deadlift');
  const bench = from3RM(trm.bench_3rm) || est1RM('bench_plat_barre');
  const pullReps = moteurGetPullupsMax(); // saisie dédiée — charge de chin_ups = lest en kg, pas des reps
  if(fs==null || hinge==null || bench==null) return null;
  const pullScore = pullReps!=null ? Math.min(pullReps,20) * 0.1 * pdc : 0;
  const score = (fs + hinge + bench + pullScore) / pdc;
  return Math.round(score*100)/100;
}
// Les repères 3RM n'ont de sens que si le format affiché EST un effort proche du 3RM (ex. le top
// set d'un "5×3"). Sur un 4×5, 3×8, etc., la charge est structurellement plus légère — pas comparable.
function moteurFormatIsThreeRM(fmt){
  if(!fmt) return false;
  if(/3RM/i.test(fmt)) return true;
  const m = fmt.match(/[×x]\s*(\d+)/);
  return !!(m && Number(m[1])===3);
}
// Strict press suivi en % du Bench (pas de standard externe tactique pour ce mouvement) — repère
// auto-calibré : cible usuelle ~60-65% pour un pousseur équilibré.
function moteurMilitairePctBench(){
  const m = moteurLastExerciseLog('militaire_barre');
  const b = moteurLastExerciseLog('bench_plat_barre');
  const t = moteurGetTestRM();
  const m3 = Number(t.militaire_3rm), b3 = Number(t.bench_3rm);
  const m1 = (isFinite(m3) && m3>0) ? m3/M_RM_FACTOR : (m ? moteurEst1RM(m.entry) : null);
  const b1 = (isFinite(b3) && b3>0) ? b3/M_RM_FACTOR : (b ? moteurEst1RM(b.entry) : null);
  if(m1==null || b1==null || !b1) return null;
  return Math.round((m1/b1)*100); // ratio de 1RM estimés — robuste même si les formats diffèrent (5RM vs 3RM, etc.)
}

    pts.forEach((p,i)=>{
      const col=p.rpe?(p.rpe>=9?'#e63946':p.rpe>=7?'#f5a623':'#10b981'):'#3b82f6';
      svg+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.charge).toFixed(1)+'" r="4.5" fill="'+col+'" stroke="#0a0f1a" stroke-width="1.5"/>';
      // Date labels (max 6, evenly spread)
      if(pts.length<=6 || i%Math.ceil(pts.length/6)===0 || i===pts.length-1){
        const d=p.date.substring(5).replace('-','/');
        svg+='<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" fill="#475569" font-size="8.5" text-anchor="middle">'+d+'</text>';
      }
    });
    svg+='</svg>';

    const chartWrap=$('div',{style:{background:'#0d1525',borderRadius:'10px',padding:'10px 6px 4px'}});
    chartWrap.innerHTML=svg;
    card.appendChild(chartWrap);

    // Legend + summary
    const first=pts[0].charge, last=pts[pts.length-1].charge;
    const delta=last-first;
    const sum=$('div',{style:{display:'flex',gap:'12px',marginTop:'10px',flexWrap:'wrap'}});
    sum.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8'}},'Début: '+first+' kg'));
    sum.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8'}},'Actuel: '+last+' kg'));
    sum.appendChild($('div',{style:{fontSize:'11px',fontWeight:'700',color:delta>=0?'#10b981':'#e63946'}},
      (delta>=0?'+':'')+delta.toFixed(1)+' kg ('+(first?((delta/first*100).toFixed(0)):'—')+'%)'));
    card.appendChild(sum);
    card.appendChild($('div',{style:{fontSize:'10px',color:'#475569',marginTop:'8px'}},
      'Points = charge réellement saisie. 🟢 RPE ≤6 · 🟠 7-8 · 🔴 ≥9.'+(_statsFmt==='__all__'?' ⚠ Formats mélangés — les poids ne sont pas directement comparables entre eux.':' Filtré sur le format « '+_statsFmt+' ».')));

    // Data table: last entries with format
    const tbl=$('div',{style:{marginTop:'12px'}});
    tbl.appendChild($('div',{style:{fontSize:'11px',fontWeight:'700',color:'#94a3b8',marginBottom:'6px'}},'Dernières séances'));
    pts.slice(-8).reverse().forEach(p=>{
      const row=$('div',{style:{display:'flex',gap:'8px',alignItems:'center',padding:'5px 8px',background:'#0d1525',borderRadius:'6px',marginBottom:'4px',fontSize:'11px'}});
      row.appendChild($('span',{style:{color:'#475569',minWidth:'42px'}},p.date.substring(5).replace('-','/')));
      row.appendChild($('span',{style:{color:'#f0f4ff',fontWeight:'700',minWidth:'52px'}},p.chargeRaw||p.charge+' kg'));
      // p.fmt = catégorie basée sur les reps réelles. Si le prévu diffère, on le rappelle en gris.
      const prevuDiff = (p.fmtPrevu && moteurCanonFmt(p.fmtPrevu)!==p.fmt) ? moteurCanonFmt(p.fmtPrevu) : null;
      const fmtCell = $('span',{style:{color:'#8b5cf6',flex:'1'}}, p.fmt||'—');
      if(prevuDiff) fmtCell.appendChild($('span',{style:{color:'#475569',fontSize:'9.5px'}},'  (prévu '+prevuDiff+')'));
      row.appendChild(fmtCell);
      row.appendChild($('span',{style:{color:'#475569',fontSize:'10px'}},p.session||('B'+p.bloc)));
      if(p.rpe)row.appendChild($('span',{style:{color:p.rpe>=9?'#e63946':p.rpe>=7?'#f5a623':'#10b981',fontWeight:'700'}},'RPE '+p.rpe));
      tbl.appendChild(row);
    });
    card.appendChild(tbl);
  }

  el.appendChild(card);
  return el;
}
