function moteurStandardsFor(exId){
  const r = M_STANDARDS_RATIOS[exId];
  if(!r) return null;
  const pdc = moteurGetBodyweight();
  const conv = v => v==null ? null : Math.round(v*pdc*M_RM_FACTOR);
  return { label: r.label, source: r.source, min: conv(r.min), obj: conv(r.obj), exc: conv(r.exc) };
}
// Score composite du vrai MTI Relative Strength Assessment, à partir des derniers 1RM estimés connus
// (dérivés des dernières charges/RPE saisies). Score ≥5 = "Good" ou mieux pour un athlète tactique.
function moteurRSAScore(){
  const pdc = moteurGetBodyweight();
  const est1RM = exId => {
    const last = moteurLastExerciseLog(exId);
    return last ? moteurEst1RM(last.entry) : null; // Epley reps réelles + RIR (plus de ÷0,909 aveugle)
  };
  const trm = moteurGetTestRM();
  const from3RM = v => { const n = Number(v); return (v!=null && v!=='' && isFinite(n) && n>0) ? n / M_RM_FACTOR : null; };
  // RM testé prioritaire, e1RM estimé des séances en repli
  const fs = from3RM(trm.front_squat_3rm) || est1RM('front_squat') || est1RM('zercher_squat');
  // Composante hinge = RDL hanches hautes barre du sol (= Hinge Lift MTI). Le RM testé prime ;
  // à défaut on estime sur le RDL lui-même, puis sur la trap bar (proxy maison le plus proche).
  // ⚠ Le SOULEVÉ DE TERRE CONVENTIONNEL est EXCLU du score (décision de J, 30/08 : « il n'entre
  // dans aucun score ») — il figurait encore ici comme repli, ce qui pouvait injecter dans le RSA
  // un mouvement officiellement retiré. Retiré en v4.3.
  const hinge = from3RM(trm.rdl_3rm) || est1RM('rdl') || est1RM('trap_bar_deadlift');
  const bench = from3RM(trm.bench_3rm) || est1RM('bench_plat_barre');
  const pullReps = moteurGetPullupsMax(); // saisie dédiée — charge de chin_ups = lest en kg, pas des reps
  if(fs==null || hinge==null || bench==null) return null;
  const pullScore = pullReps!=null ? Math.min(pullReps,20) * 0.1 * pdc : 0;
  const score = (fs + hinge + bench + pullScore) / pdc;
  return Math.round(score*100)/100;
}
// Les repères 3RM n'ont de sens que si le format affiché EST un effort proche du 3RM (ex. le top
// set d'un "5×3"). Sur un 4×5, 3×8, etc., la charge est structurellement plus légère — pas comparable.
function moteurFormatIsThreeRM(fmt){
  if(!fmt) return false;
  if(/3RM/i.test(fmt)) return true;
  const m = fmt.match(/[×x]\s*(\d+)/);
  return !!(m && Number(m[1])===3);
}
// Strict press suivi en % du Bench (pas de standard externe tactique pour ce mouvement) — repère
// auto-calibré : cible usuelle ~60-65% pour un pousseur équilibré.
function moteurMilitairePctBench(){
  const m = moteurLastExerciseLog('militaire_barre');
  const b = moteurLastExerciseLog('bench_plat_barre');
  const t = moteurGetTestRM();
  const m3 = Number(t.militaire_3rm), b3 = Number(t.bench_3rm);
  const m1 = (isFinite(m3) && m3>0) ? m3/M_RM_FACTOR : (m ? moteurEst1RM(m.entry) : null);
  const b1 = (isFinite(b3) && b3>0) ? b3/M_RM_FACTOR : (b ? moteurEst1RM(b.entry) : null);
  if(m1==null || b1==null || !b1) return null;
  return Math.round((m1/b1)*100); // ratio de 1RM estimés — robuste même si les formats diffèrent (5RM vs 3RM, etc.)
}

function renderStats(){
  const el = $('div',{style:{width:'100%',minWidth:'100%',display:'flex',flexDirection:'column',alignItems:'stretch',boxSizing:'border-box'}});
  const data = getAllExerciseData();
  const exNames = Object.keys(data).filter(n=>data[n].some(d=>d.charge!==null));
  const bw = moteurGetBodyweight();

  // ── Standards opérationnels — tous en 3RM, dépendent du poids de corps saisi ci-dessous ──
  const stdCard = $('div',{class:'card'});
  const stdBtn = $('button',{style:{width:'100%',textAlign:'left',background:'none',border:'none',color:'#f5a623',fontWeight:'700',fontSize:'13px',cursor:'pointer',padding:'0'},
    onclick:()=>{ S.statsStdOpen=!S.statsStdOpen; render(); }
  }, '🎯 Standards opérationnels (3RM)  '+(S.statsStdOpen?'▲':'▼'));
  stdCard.appendChild(stdBtn);
  if(S.statsStdOpen){
    const bwRow = $('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginTop:'8px',marginBottom:'8px'}},
      $('span',{style:{fontSize:'11px',color:'#94a3b8'}},'Ton poids de corps (kg) :'),
      $('input',{class:'input-mod',type:'number',step:'0.5',value:String(bw),
        onchange:(e)=>moteurSetBodyweight(e.target.value===''?75:Number(e.target.value))})
    );
    stdCard.appendChild(bwRow);
    (function(){
      const wl = moteurBodyweightLog();
      if(wl.length){
        const last = wl.slice(-3).map(e => e.kg + ' kg (' + e.date.slice(5) + ')').join(' · ');
        stdCard.appendChild($('div',{style:{fontSize:'10px',color:'#64748b',marginBottom:'8px'}},
          'Pesées : ' + last + (wl.length>3 ? ' — ' + wl.length + ' au total' : '') + '. Hebdomadaire à la maison — alimente standards ×PDC et RSA.'));
      }

    // ── Score RSA : déplacé dans l'onglet 🎯 Tests (saisie des 3RM + calcul auto) ──
    stdCard.appendChild($('div',{style:{marginTop:'10px',padding:'8px',background:'#111d2e',borderRadius:'7px'}},
      $('div',{style:{fontSize:'11px',fontWeight:'700',color:'#f5a623',marginBottom:'2px'}},'🎯 Score RSA'),
      $('div',{style:{fontSize:'10px',color:'#64748b'}},'Saisie des 3RM et calcul du score dans l\'onglet Tests.')
    ));

    // ── Strict Press en % du Bench (pas de standard externe tactique — repère perso) ──
    const pctB = moteurMilitairePctBench();
    stdCard.appendChild($('div',{style:{marginTop:'8px',padding:'8px',background:'#111d2e',borderRadius:'7px'}},
      $('div',{style:{fontSize:'11px',fontWeight:'700',color:'#f5a623',marginBottom:'3px'}},'Military Press — % du Bench (repère perso, pas de standard MTI)'),
      $('div',{style:{fontSize:'16px',fontWeight:'700',color: pctB==null?'#475569':'#e8edf5'}},
        pctB!=null ? pctB+'%' : 'Pas assez de données'),
      $('div',{style:{fontSize:'9.5px',color:'#64748b',marginTop:'3px'}},'Cible usuelle ~60-65% pour un pousseur équilibré (ratio des 1RM estimés — Epley reps+RIR — des dernières charges Militaire/Bench).')
    ));
  }
  el.appendChild(stdCard);

  const card = $('div',{class:'card'});
  card.appendChild($('div',{class:'card-title'},'📈 Progression des charges'));

  if(exNames.length===0){
    card.appendChild($('div',{style:{fontSize:'12px',color:'#475569',lineHeight:'1.6'}},
      'Aucune donnée encore. Saisis la charge utilisée sur les cards d\'exercices pendant tes séances — les courbes apparaîtront ici automatiquement.'));
    el.appendChild(card);
    return el;
  }

  if(!_statsEx || !exNames.includes(_statsEx)) _statsEx = exNames[0];

  // Exercise selector chips
  const selRow = $('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',marginBottom:'14px'}});
  exNames.forEach(n=>{
    selRow.appendChild($('button',{
      style:{
        padding:'6px 10px',borderRadius:'8px',fontSize:'11px',fontWeight:'600',cursor:'pointer',
        border:'1.5px solid '+(n===_statsEx?'#3b82f6':'#1e2d42'),
        background:n===_statsEx?'#1a2942':'#111d2e',
        color:n===_statsEx?'#3b82f6':'#94a3b8'
      },
      onclick:()=>{ _statsEx=n; _statsFmt=null; render(); }
    }, n.length>22?n.substring(0,22)+'…':n));
  });
  card.appendChild(selRow);

  // ── Filtre par format : un 5×3 (top set) et un 3×8 (volume) ne sont pas comparables sur le
  // même graphique — la charge attendue diffère structurellement, pas seulement par progrès. ──
  const allPts = data[_statsEx];
  // Ceinture-et-bretelles : on recanonise le fmt à la lecture. Les entrées écrites avant la mise en
  // place de la canonisation (ou avec un ancien libellé long) sont ainsi regroupées avec les récentes,
  // au lieu de créer plusieurs buckets « Top set ×3 » distincts selon le libellé source.
  allPts.forEach(d=>{ if(d.fmt) d.fmt = moteurCanonFmt(d.fmt); });
  const distinctFmts = [...new Set(allPts.map(d=>d.fmt).filter(f=>f))];
  if(!_statsFmt || (distinctFmts.length && !distinctFmts.includes(_statsFmt) && _statsFmt!=='__all__')){
    _statsFmt = distinctFmts.length ? distinctFmts[distinctFmts.length-1] : '__all__';
  }
  if(distinctFmts.length>1){
    const fmtRow = $('div',{style:{display:'flex',gap:'5px',flexWrap:'wrap',marginBottom:'10px'}});
    fmtRow.appendChild($('div',{style:{fontSize:'10px',color:'#64748b',width:'100%'}},'Format (poids non comparables entre formats différents) :'));
    distinctFmts.forEach(f=>{
      fmtRow.appendChild($('button',{
        style:{padding:'4px 8px',borderRadius:'6px',fontSize:'10px',cursor:'pointer',
          border:'1px solid '+(f===_statsFmt?'#8b5cf6':'#1e2d42'),
          background:f===_statsFmt?'#241a3d':'#111d2e', color:f===_statsFmt?'#c4b5fd':'#64748b'},
        onclick:()=>{ _statsFmt=f; render(); }
      }, f));
    });
    fmtRow.appendChild($('button',{
      style:{padding:'4px 8px',borderRadius:'6px',fontSize:'10px',cursor:'pointer',
        border:'1px solid '+(_statsFmt==='__all__'?'#8b5cf6':'#1e2d42'),
        background:_statsFmt==='__all__'?'#241a3d':'#111d2e', color:_statsFmt==='__all__'?'#c4b5fd':'#64748b'},
      onclick:()=>{ _statsFmt='__all__'; render(); }
    }, 'Tous (mélangé)'));
    card.appendChild(fmtRow);
  }

  // Build SVG chart
  const M_BASENAME_TO_EXID = {'Bench plat':'bench_plat_barre','RDL':'rdl','Zercher':'zercher_squat','Front Squat':'front_squat'};
  const stdForChart = (M_BASENAME_TO_EXID[_statsEx] && _statsFmt!=='__all__' && moteurFormatIsThreeRM(_statsFmt))
    ? moteurStandardsFor(M_BASENAME_TO_EXID[_statsEx]) : null;
  const pts = data[_statsEx].filter(d=>d.charge!==null && (_statsFmt==='__all__' || !d.fmt || d.fmt===_statsFmt));
  if(pts.length===0){
    card.appendChild($('div',{style:{fontSize:'12px',color:'#475569'}},'Pas de charge numérique saisie pour cet exercice.'));
  } else {
    const W=320,H=180,P={t:14,r:14,b:28,l:34};
    const vals=pts.map(p=>p.charge);
    let vMin=Math.min(...vals), vMax=Math.max(...vals);
    if(stdForChart){ vMin=Math.min(vMin, stdForChart.min); vMax=Math.max(vMax, stdForChart.exc); }
    if(vMin===vMax){ vMin-=2; vMax+=2; }
    const pad=(vMax-vMin)*0.12; vMin-=pad; vMax+=pad;
    const x=i=>P.l+(pts.length===1?((W-P.l-P.r)/2):(i*(W-P.l-P.r)/(pts.length-1)));
    const y=v=>P.t+(H-P.t-P.b)*(1-(v-vMin)/(vMax-vMin));

    let svg='<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block">';
    // Grid lines (3)
    for(let g=0;g<=3;g++){
      const gv=vMin+(vMax-vMin)*g/3, gy=y(gv);
      svg+='<line x1="'+P.l+'" y1="'+gy+'" x2="'+(W-P.r)+'" y2="'+gy+'" stroke="#1e2d42" stroke-width="1"/>';
      svg+='<text x="'+(P.l-5)+'" y="'+(gy+3)+'" fill="#475569" font-size="9" text-anchor="end">'+gv.toFixed(0)+'</text>';
    }
    // Repères standards (Min / Objectif / Excellence, en 3RM, selon le poids de corps saisi)
    if(stdForChart){
      [['min','#64748b','Min'],['obj','#f5a623','Obj'],['exc','#10b981','Exc']].forEach(([k,col,lbl])=>{
        const gy=y(stdForChart[k]);
        svg+='<line x1="'+P.l+'" y1="'+gy.toFixed(1)+'" x2="'+(W-P.r)+'" y2="'+gy.toFixed(1)+'" stroke="'+col+'" stroke-width="1.2" stroke-dasharray="5,3" opacity="0.75"/>';
        svg+='<text x="'+(W-P.r-2)+'" y="'+(gy-3).toFixed(1)+'" fill="'+col+'" font-size="8" text-anchor="end">'+lbl+' '+stdForChart[k]+'</text>';
      });
    }
    // Line path
    if(pts.length>1){
      let path='M';
      pts.forEach((p,i)=>{ path+=(i?' L':'')+x(i).toFixed(1)+' '+y(p.charge).toFixed(1); });
      svg+='<path d="'+path+'" fill="none" stroke="#3b82f6" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
    }
    // Bloc change separators (vertical dashed lines)
    for(let i=1;i<pts.length;i++){
      if(pts[i].bloc!==pts[i-1].bloc){
        const sx=(x(i)+x(i-1))/2;
        svg+='<line x1="'+sx.toFixed(1)+'" y1="'+P.t+'" x2="'+sx.toFixed(1)+'" y2="'+(H-P.b)+'" stroke="#475569" stroke-width="1" stroke-dasharray="3,3"/>';
        svg+='<text x="'+(sx+3).toFixed(1)+'" y="'+(P.t+8)+'" fill="#475569" font-size="8">B'+pts[i].bloc+'</text>';
      }
    }
    // Points + RPE color
    pts.forEach((p,i)=>{
      const col=p.rpe?(p.rpe>=9?'#e63946':p.rpe>=7?'#f5a623':'#10b981'):'#3b82f6';
      svg+='<circle cx="'+x(i).toFixed(1)+'" cy="'+y(p.charge).toFixed(1)+'" r="4.5" fill="'+col+'" stroke="#0a0f1a" stroke-width="1.5"/>';
      // Date labels (max 6, evenly spread)
      if(pts.length<=6 || i%Math.ceil(pts.length/6)===0 || i===pts.length-1){
        const d=p.date.substring(5).replace('-','/');
        svg+='<text x="'+x(i).toFixed(1)+'" y="'+(H-8)+'" fill="#475569" font-size="8.5" text-anchor="middle">'+d+'</text>';
      }
    });
    svg+='</svg>';

    const chartWrap=$('div',{style:{background:'#0d1525',borderRadius:'10px',padding:'10px 6px 4px'}});
    chartWrap.innerHTML=svg;
    card.appendChild(chartWrap);

    // Legend + summary
    const first=pts[0].charge, last=pts[pts.length-1].charge;
    const delta=last-first;
    const sum=$('div',{style:{display:'flex',gap:'12px',marginTop:'10px',flexWrap:'wrap'}});
    sum.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8'}},'Début: '+first+' kg'));
    sum.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8'}},'Actuel: '+last+' kg'));
    sum.appendChild($('div',{style:{fontSize:'11px',fontWeight:'700',color:delta>=0?'#10b981':'#e63946'}},
      (delta>=0?'+':'')+delta.toFixed(1)+' kg ('+(first?((delta/first*100).toFixed(0)):'—')+'%)'));
    card.appendChild(sum);
    card.appendChild($('div',{style:{fontSize:'10px',color:'#475569',marginTop:'8px'}},
      'Points = charge réellement saisie. 🟢 RPE ≤6 · 🟠 7-8 · 🔴 ≥9.'+(_statsFmt==='__all__'?' ⚠ Formats mélangés — les poids ne sont pas directement comparables entre eux.':' Filtré sur le format « '+_statsFmt+' ».')));

    // Data table: last entries with format
    const tbl=$('div',{style:{marginTop:'12px'}});
    tbl.appendChild($('div',{style:{fontSize:'11px',fontWeight:'700',color:'#94a3b8',marginBottom:'6px'}},'Dernières séances'));
    pts.slice(-8).reverse().forEach(p=>{
      const row=$('div',{style:{display:'flex',gap:'8px',alignItems:'center',padding:'5px 8px',background:'#0d1525',borderRadius:'6px',marginBottom:'4px',fontSize:'11px'}});
      row.appendChild($('span',{style:{color:'#475569',minWidth:'42px'}},p.date.substring(5).replace('-','/')));
      row.appendChild($('span',{style:{color:'#f0f4ff',fontWeight:'700',minWidth:'52px'}},p.chargeRaw||p.charge+' kg'));
      // p.fmt = catégorie basée sur les reps réelles. Si le prévu diffère, on le rappelle en gris.
      const prevuDiff = (p.fmtPrevu && moteurCanonFmt(p.fmtPrevu)!==p.fmt) ? moteurCanonFmt(p.fmtPrevu) : null;
      const fmtCell = $('span',{style:{color:'#8b5cf6',flex:'1'}}, p.fmt||'—');
      if(prevuDiff) fmtCell.appendChild($('span',{style:{color:'#475569',fontSize:'9.5px'}},'  (prévu '+prevuDiff+')'));
      row.appendChild(fmtCell);
      row.appendChild($('span',{style:{color:'#475569',fontSize:'10px'}},p.session||('B'+p.bloc)));
      if(p.rpe)row.appendChild($('span',{style:{color:p.rpe>=9?'#e63946':p.rpe>=7?'#f5a623':'#10b981',fontWeight:'700'}},'RPE '+p.rpe));
      tbl.appendChild(row);
    });
    card.appendChild(tbl);
  }

  el.appendChild(card);
  return el;
}

function dateAddDays(str, n){
  const [y,mo,d] = str.split('-').map(Number); const dt = new Date(y, mo-1, d+n);
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
// Couleur du jour (programme v4_97) : statut VFC Garmin + sommeil. Sans statut → couleur de la veille.
function couleurDuJour(dateStr, profondeur){
  dateStr = dateStr || todayStr; profondeur = profondeur||0;
  const m = (load('log:'+dateStr)||{}).matin || {};
  const h = parseFloat(m.sleep_hours);
  let c = null;
  if(m.vfc_statut==='bas' || (isFinite(h) && h<5)) c='rouge';
  else if(m.vfc_statut==='desequilibre' || (isFinite(h) && h<6)) c='orange';
  else if(m.vfc_statut==='equilibre') c='vert';
  if(c) return {c, herite:profondeur>0};
  if(profondeur<3) return couleurDuJour(dateAddDays(dateStr,-1), profondeur+1);
  return {c:null, herite:false};
}
const COULEUR_INFO = {
  vert:{e:'🟢', col:'#10b981', txt:'Séance prévue.'},
  orange:{e:'🟠', col:'#f5a623', txt:'Séance prévue à −30 % de volume, aucune intensité (ni Seuil, ni VO2max).'},
  rouge:{e:'🔴', col:'#e63946', txt:'Z2 vélo 30 min nasale ou repos.'}
};
// Palier course conseillé à partir des soirs logués depuis le début de la reprise.
function palierCourseConseille(){
  const ent = [];
  for(let d=REPRISE.du; d<=todayStr; d=dateAddDays(d,1)){
    const c = ((load('log:'+d)||{}).soir||{}).course;
    if(c && c.palier) ent.push(Object.assign({date:d}, c));
  }
  const idx = id => Math.max(0, PALIERS_COURSE.findIndex(p=>p.id===id));
  if(!ent.length) return {id:PALIER_DEPART, motif:'Départ de la reprise (programme v4_97).'};
  const last = ent[ent.length-1]; const i = idx(last.palier);
  const gm = Number(last.gene_max);
  if(isFinite(gm) && last.gene_max!=='' && gm>3) return {id:PALIERS_COURSE[Math.max(0,i-1)].id, motif:'Gêne > 3/10 à la dernière séance → palier inférieur.'};
  const prev = ent[ent.length-2];
  const propre = e => e && e.gene_max!=='' && e.gene_max!=null && Number(e.gene_max)<=1;
  if(prev && prev.palier===last.palier && propre(prev) && propre(last) && i<PALIERS_COURSE.length-1)
    return {id:PALIERS_COURSE[i+1].id, motif:'Deux séances à 0-1/10 au palier '+last.palier+' → palier suivant.'};
  return {id:last.palier, motif:'Rester au palier : il faut deux séances consécutives à 0-1/10 pour monter.'};
}

    for(let d=lundi; d<=todayStr; d=dateAddDays(d,1)){

  return card;
}

function renderRoutine(){
  const log = getLog();
  const done = log.routine || [];
  const el = $('div',{style:{width:'100%',maxWidth:'100%',boxSizing:'border-box',overflowX:'hidden'}});
  el.appendChild($('div',{class:'section-hdr'},'☀️ Routine du Matin'));

  // v4.22 (07/09) — correction : GTG est un onglet du sélecteur comme les autres (CARs, Renfo,
  // Respiration), en PREMIÈRE position — pas un bloc séparé rendu au-dessus du sélecteur (c'était
  // la mauvaise interprétation en v4.21, corrigée sur demande explicite de J : "un onglet comme
  // eux mais le premier").
  const cats = ['GTG', ...new Set(ROUTINE_MATIN.map(r=>r.cat))];
  // repli si la catégorie mémorisée n'existe plus (ancienne version) → évite un onglet vide
  const curCat = cats.includes(S.routineCat) ? S.routineCat : cats[0];
  if(S.routineCat && !cats.includes(S.routineCat)) S.routineCat = cats[0];

  const seg = $('div',{class:'seg-ctrl'});
  cats.forEach(cat=>{
    seg.appendChild($('button',{
      class:'seg-btn'+(curCat===cat?' active':''),
      onclick:()=>{ S.routineCat=cat; render(); }
    }, cat==='GTG' ? '🔁 GTG' : cat));
  });
  el.appendChild(seg);

  if(curCat==='GTG'){
    el.appendChild(renderGTG());
    return el;
  }

  const filtered = ROUTINE_MATIN.filter(r=>r.cat===curCat);
  const card = $('div',{class:'card'});

  const doneCount = filtered.filter(r=>done.includes(r.id)).length;
  const progress = filtered.length > 0 ? Math.round(doneCount/filtered.length*100) : 0;
  const pbar = $('div',{style:{marginBottom:'12px'}},

      $('div',{style:{height:'100%',width:progress+'%',background: progress===100?'#10b981':'#f5a623',borderRadius:'2px',transition:'width .3s'}})
    )
  );
  card.appendChild(pbar);

  filtered.forEach(item=>{
    const isDone = done.includes(item.id);
    const row = $('div',{
      class:'check-item',
      onclick:()=>{
        const l=getLog(); const d=[...(l.routine||[])];
        const idx=d.indexOf(item.id); if(idx>-1) d.splice(idx,1); else d.push(item.id);
        l.routine=d; saveLog(l); render();

    },
      $('div',{class:'check-box'+(isDone?' done':'')}, isDone?'✓':''),
      $('div',{style:{flex:1}},
        $('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'2px',minWidth:'0',width:'100%'}},
          $('span',{class:'cat-badge cat-'+(item.cat==='CARs'?'cars':item.cat.indexOf('Renfo')>=0?'renfo':'resp'),style:{flexShrink:'0',whiteSpace:'nowrap'}},item.cat.indexOf('obligatoire')>=0?'obligatoire':item.cat.indexOf('optionnel')>=0?'optionnel':item.cat==='CARs'?'CARs':item.cat.indexOf('Respir')>=0?'resp':item.cat),
          $('span',{style:{fontSize:'13px',fontWeight:isDone?'400':'600',color:isDone?'#475569':'var(--text)',textDecoration:isDone?'line-through':'none',minWidth:'0',flex:'1',overflowWrap:'break-word'}},item.icon+' '+item.name),
        ),
        $('div',{style:{fontSize:'11px',color:'#475569'}},item.detail),

      $('button',{class:'info-btn',onclick:(e)=>{ e.stopPropagation(); showTooltip(e,item.note); }}, '?')

// (carte « Sport » du bloc Aujourd'hui) sans dupliquer la logique de sélection/repli.
function moteurCurrentSession(){
  // v4.24 (11/09) — S.moteurSessionId n'est qu'un état d'exécution (S), jamais persisté : à chaque
  // rechargement de l'app, il repartait à `undefined` et le repli plus bas retombait TOUJOURS sur le
  // premier type de séance non bloqué de MTPL.session_types (VO2max), quel que soit le jour ou la
  // séance réellement en cours — le bug qu'Accueil affichait (signalé par J le 11/09). On resynchronise
  // depuis MS.currentSessionId (persisté) avant de chercher un repli.
  if(!S.moteurSessionId && MS.currentSessionId) S.moteurSessionId = MS.currentSessionId;
  let current = MTPL.session_types.find(s=>s.id===S.moteurSessionId);
  const currentStillOk = current && !moteurSessionLockedByPhase(current) && moteurResolveSession(current).status!=='blocked';
  if(!current || !currentStillOk){
    current = MTPL.session_types.find(s=>{
      if(moteurSessionLockedByPhase(s)) return false;
      return moteurResolveSession(s).status!=='blocked';
    }) || MTPL.session_types[0];
    S.moteurSessionId = current.id;
  }
  if(MS.currentSessionId !== S.moteurSessionId){ MS.currentSessionId = S.moteurSessionId; save('moteur_state', MS); }
  return current;
}
function renderSeance(){
  moteurMaybeAutoSuggestDelestage();
  const el = $('div',{});

  // ── Sélecteur compact des séances — statut (couleur), fait cette semaine (barré),
  // pertinent pour le focus (encadré doré). Remplace l'ancienne liste pleine largeur. ──
  let current = moteurCurrentSession();

  const selectorCard = $('div',{class:'card',style:{paddingBottom:'8px'}});
  const selectorWrap = $('div',{style:{display:'flex',flexWrap:'wrap',gap:'6px',alignItems:'center'}});
  // Séparateurs de jour — semaine ENDURANCE (cf. programme §2, gabarit 1)
  // Gabarit B (ENDURANCE), semaine en vigueur 12/08 → 11/10 — programme v4_72 §2 :
  // J1 VO2max + T2 · J2 Z2 courte + Portage 2 (soir) · J3 FB1 + Z2 vélo · J4 Z2 longue + Portage 1
  // (soir) · J5 AGT (matin) + Seuil (soir) · J6 FB2 + Z2 vélo · J7 repos.
  // v4.3 : les créneaux du SOIR (portages, seuil) étaient absents de la frise — la semaine réelle
  // compte 11 séances, la frise n'en jalonnait que 6.
  // v4.14 (chantier v6-1, demande de J du 04/09) — FUSION DES LABELS JOUR/SOIR : « J5 c'est J5, pas J5 et
  // J5 soir ». Le jour reste le même repère quel que soit le nombre de séances ce jour-là ; le label ne
  // porte plus la distinction matin/soir, qui n'apportait rien que le nom des séances elles-mêmes ne dise
  // déjà (AGT le matin, Seuil le soir, etc. — voir le commentaire de semaine ci-dessus).
  const M_JOURS = {vo2max:'J1', z2:'J2', portage_2:'J2', fb_1:'J3', z2_long:'J4',
    portage:'J4', agt:'J5', seuil:'J5', fb_2:'J6', wc_glyco:'···'};
  const sepStyle={fontSize:'9px',fontWeight:'800',color:'#f5a623',padding:'0 2px 0 4px',
    borderLeft:'2px solid #f5a623',lineHeight:'1',alignSelf:'stretch',display:'flex',alignItems:'center'};
  // v4.14 (correctif du 04/09, même chantier) — GROUPÉ, PAS RÉPÉTÉ : le label ne se réaffiche pas pour la
  // 2e séance du même jour (J2 = Z2 + Portage 2, J4 = Z2 long + Portage 1, J5 = AGT + Seuil) — un seul « J2 »
  // devant les deux boutons du jour, pas « J2 … J2 … ».
  let lastJourLbl = null;
  MTPL.session_types.forEach(session=>{
    const jourLbl = M_JOURS[session.id];
    if(jourLbl && jourLbl !== lastJourLbl){ selectorWrap.appendChild($('div',{style:sepStyle}, jourLbl)); lastJourLbl = jourLbl; }
    const lockedByPhase = moteurSessionLockedByPhase(session);
    const target = moteurMissionTarget(session.frequence_cible);
    const done = moteurSessionDoneCountThisWeek(session.id);
    const doneThisWeek = target ? done>=target : done>0;
    let statusColor, canOpen;
    if(lockedByPhase){ statusColor='#e63946'; canOpen=false; }
    else {
      const r = moteurResolveSession(session);
      canOpen = r.status!=='blocked';
      statusColor = r.status==='ok' ? '#10b981' : r.status==='partial' ? '#f5a623' : '#e63946';
    }
    const relevant = !lockedByPhase && moteurSessionRelevant(session);
    const isSel = current.id===session.id;
    selectorWrap.appendChild($('button',{
      style:{
        padding:'6px 9px', borderRadius:'8px', fontSize:'11px', fontWeight:'700',
        cursor: canOpen?'pointer':'default',
        border: relevant?'1.5px solid #f5a623':(isSel?'1px solid #3b82f6':'1px solid #1e2d42'),
        background: isSel?'#1a2942':'#111d2e',
        color: !canOpen?'#475569':(doneThisWeek?'#64748b':'#f0f4f8'),
        textDecoration: doneThisWeek?'line-through':'none',
        opacity: lockedByPhase?0.5:1,
        display:'inline-flex', alignItems:'center', gap:'5px'
      },
      onclick:()=>{ if(!canOpen) return; S.moteurSessionId=session.id; MS.currentSessionId=session.id; saveMoteurState(); }
    },
      $('span',{style:{width:'7px',height:'7px',borderRadius:'50%',background:statusColor,flexShrink:'0'}}),
      session.nom
    ));
  });
  selectorCard.appendChild(selectorWrap);
  selectorCard.appendChild($('button',{class:'info-btn',style:{marginTop:'6px'},
    onclick:(e)=>{ e.stopPropagation(); showTooltip(e,
      'PASTILLES\n'+
      '🟢  Faisable telle quelle\n'+
      '🟠  Faisable avec substitutions (matériel manquant ou contre-indication active)\n'+
      '🔴  Mouvement principal indisponible, ou séance verrouillée derrière un bloc qualité\n\n'+
      'MISE EN FORME\n'+
      'Encadré doré  —  prioritaire selon le focus actuel\n'+
      'Titre barré  —  déjà réalisée cette semaine\n'+
      'Titre grisé  —  non ouvrable\n\n'+
      'À SAVOIR\n'+
      'Le priming (échauffement, mobilité, activation, primers) ne bloque jamais une séance : '+
      's\'il manque un élastique ou une corde, la séance reste faisable.'); }
  },'?'));
  el.appendChild(selectorCard);

  renderSessionCards(el, current);
  return el;
}

// Construit les cartes d'exercice de la séance sélectionnée, directement dans `el` (pas de page séparée).
function renderSessionCards(el, session){

  el.appendChild($('div',{class:'section-hdr'},'🏋️ '+session.nom));

  // ── Module WC : sélecteur de modalité (banque G1-G5 glyco / S1-S5 seuil) ───────────────
  if(session.id === 'wc_glyco' || session.id === 'wc_seuil'){
    try {
      const BANQUE = {
        wc_glyco: {
          titre:'Modalité glycolytique (banque G)',
          items:[
            ['G1','G1 sandbag','to-shoulder 40/40 ×4 + sled push A/R 40/40 ×4 + bear-hug carry 40/40 ×3'],
            ['G2','G2 barre/DB','thrusters 40/40 ×4 + row explosif 40/40 ×4 + push press 40/40 ×4'],
            ['G3','G3 KB/haut','swing lourd 30/30 ×4 + clean&press alterné 30/30 ×4 + snatch léger 30/30 ×4'],
            ['G4','G4 complexe KB','6 swings + 4 cleans + 2 press sans poser, 40s, D puis G ×5-6'],
            ['G5','G5 pneu/corde','pneu flip 30/60 ×5-6 + battle ropes 30/30 ×4 + frappe pneu masse (poignet G)'],
            ['G6','G6 conditioning','rounds 3min/1min combat : swings rapides 30/30 + shadow/sprawl + KB clean D + tronc au sol (⚠ IT band : pas de sprint/saut/pivot)'],
            ['G7','G7 complexe barre','12 soulevés + 9 cleans + 6 push press enchaînés (⚠ DL maîtrisé requis ; épaule/poignet G OK — sinon écarter)']
          ]
        },
        wc_seuil: {
          titre:'Modalité seuil (banque S)',
          items:[
            ['S1','S1 sled continu','push/drag continu 15-20 min A/R — idéal IT band, zéro impact'],
            ['S2','S2 portage+mannequin','circuit 15 min : sandbag carry 40m + traînage mannequin + farmer carry'],
            ['S3','S3 circuit KB','boucle 15-20 min : 10 swings → 5 goblet → 10 swings → 5 push press'],
            ['S4','S4 EMOM long','18-20 min : 10 swings + 5 pull-ups/TRX row / minute, reste en récup'],
            ['S5','S5 escaliers/gilet','15-20 min allure seuil sous gilet — ⚠ recoupe T1, ne pas doubler la semaine'],
            ['S6','S6 squat thrust (burpee allégé)','30s effort / 30s récup × 12-15 min. Burpee SANS pompe NI saut (down-up, recul de jambes) = zéro impact genou, poignet/épaule G ménagés. Rythme CONTRÔLÉ et régulier = seuil (153-166) ; si trop fort → bascule en glyco. Monte vraiment la FC (grande masse, pas de limite grip).'],
            ['S7','S7 portage/tenue (ex-carry+swing)','4 tours 90/90/90 carry 16/16 + swing — ⚠ N\'ATTEINT PAS le seuil (limité par le grip/avant-bras, FC reste sous SV1). WC de TENUE DE CHARGE/portage, pas seuil cardio. Zéro impact.']
          ]
        }
      };
      const conf = BANQUE[session.id];
      const K = 'wcmod_'+session.id;
      let choix; try{ choix = load(K) || conf.items[0][0]; }catch(_){ choix = conf.items[0][0]; }
      const setChoix=(v)=>{ try{ save(K,v); }catch(_){} render(); };
      const card=$('div',{class:'card'});
      card.appendChild($('div',{class:'card-title'},'⚙️ '+conf.titre));
      const row=$('div',{style:{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'8px'}});
      conf.items.forEach(it=>{
        const on = (choix===it[0]);
        row.appendChild($('button',{
          style:{padding:'7px 11px',borderRadius:'7px',fontSize:'12px',cursor:'pointer',
            border:'1px solid '+(on?'#8b5cf6':'#334155'),background:on?'#8b5cf6':'#0d1525',
            color:on?'#fff':'#cbd5e1',fontWeight:on?'700':'500'},
          onclick:()=>setChoix(it[0])}, it[1]));
      });
      card.appendChild(row);
      const sel = conf.items.find(it=>it[0]===choix) || conf.items[0];
      card.appendChild($('div',{style:{marginTop:'2px',padding:'8px',background:'#0d2b1f',borderRadius:'7px',fontSize:'12px',color:'#6ee7b7',fontWeight:'600'}},
        '▶ '+sel[1]+' : '+sel[2]));
      // Encadré note éditable du jour (modif de format, charges, ressenti). Persistant par jour + séance.
      const noteKey = 'wcnote_'+session.id;
      let noteVal=''; try{ const lg=getLog(); noteVal=(lg[noteKey]!=null?lg[noteKey]:''); }catch(_){}
      const noteWrap=$('div',{style:{marginTop:'8px'}});
      noteWrap.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8',marginBottom:'4px'}},'📝 Détails du jour (charges, modif de format, ressenti)'));
      const ta=$('textarea',{class:'textarea-field',rows:'3',placeholder:'ex : G3 — swing 28kg 30/30 ×4, clean&press 20kg, épaule OK…',
        value: noteVal});
      ta.oninput=(e)=>{ try{ const lg=getLog(); lg[noteKey]=e.target.value; saveLog(lg); }catch(_){} };
      noteWrap.appendChild(ta);
      card.appendChild(noteWrap);
      el.appendChild(card);
      el.appendChild($('div',{class:'card',style:{fontSize:'11.5px',color:'#94a3b8'}}, session.objectif||''));

      let done=false; try{ done = moteurIsSessionDoneToday(session.id); }catch(_){}
      el.appendChild($('div',{class:'card',style:{cursor:'pointer',background:done?'#0d2b1f':undefined,borderColor:done?'#10b981':undefined},
        onclick:()=>{ try{ moteurToggleSessionDoneToday(session.id); }catch(_){ render(); } }},
        $('div',{class:'check-item',style:{cursor:'pointer'}},
          $('div',{class:'check-box'+(done?' done':'')}, done?'✓':''),
          $('div',{style:{fontWeight:700,fontSize:'13px'}},'Séance effectuée aujourd\'hui'))));
    } catch(err){
      el.appendChild($('div',{class:'card',style:{fontSize:'12px',color:'#f5a623'}},
        'WC : choix de modalité indisponible — '+(err&&err.message?err.message:'erreur')));
    }
    return;
  }

  // ── Module Z2 configurable : modalité → durée → format (→ bras si swing) ──────────────
  if(session.id === 'z2' || session.id === 'z2_long'){
    try {
      const K = 'z2cfg_' + session.id;
      let cfg;
      try { cfg = Object.assign({modalite:'velo',duree:20,fractionne:'continu',bras:2}, load(K)||{}); }
      catch(_) { cfg = {modalite:'velo',duree:20,fractionne:'continu',bras:2}; }
      const setCfg = (patch)=>{ Object.assign(cfg, patch); try{ save(K, cfg); }catch(_){} render(); };
      const chip = (label, on, onclick, dim)=> $('button', {
        style:{padding:'7px 11px',borderRadius:'7px',fontSize:'12px',cursor:'pointer',margin:'0',
          border:'1px solid '+(on?'#8b5cf6':'#334155'), background:on?'#8b5cf6':'#0d1525',
          color:on?'#ffffff':(dim?'#475569':'#cbd5e1'), fontWeight:on?'700':'500'},
        onclick:onclick }, label);
      const rowStyle = {display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'8px'};

      const card = $('div',{class:'card'});
      card.appendChild($('div',{class:'card-title'},'⚙️ Configurer la Z2'));

      card.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8',marginBottom:'4px'}},'Modalité'));
      const rM = $('div',{style:rowStyle});
      [['velo','🚴 Vélo',
            ['S8','S8 tirage de pneu (corde)','12-15 min de tirage CONTINU à la corde. ✅ SEULE MODALITÉ SEUIL VALIDÉE PAR LA MESURE (08/08 : franchit SV1, max 158 = 86% FCmax, montait encore à l\'arrêt). Engage une grande masse musculaire en continu → le cardio devient limitant, PAS le grip. Zéro impact. Si le pneu est lourd : allonger la corde et tirer plus lentement mais SANS PAUSE (la continuité prime sur la charge).']],['course','🏃 Course'],['corde','🪢 Corde'],['swing','🔔 Swing']]
        .forEach(o => rM.appendChild(chip(o[1], cfg.modalite===o[0], ()=>setCfg({modalite:o[0]}))));
      card.appendChild(rM);

      card.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8',marginBottom:'4px'}},'Durée (min)'));
      const rD = $('div',{style:rowStyle});
      // v4.14 (chantier v6-3, demande de J du 04/09) — PLUS DE CHOIX DE DURÉE. La liste précédente sautait
      // de 30 à 45 (Z2 courte) sans rien entre les deux, alors que le programme documente une plage
      // continue « 30-45 min » ; côté Z2 longue, la progression du programme est 45→60→75→90 par paliers
      // de 15 — on garde ce pas et on ajoute une option en dessous (30, jour réduit) et deux au-dessus
      // (105, 120, pour les fenêtres où une Z2 longue plus longue a du sens). ⚠ Base de départ : à ajuster
      // avec J si la granularité ne correspond pas à l'usage réel.
      (session.id==='z2_long'?[30,45,60,75,90,105,120]:[15,20,25,30,35,40,45,50,60])
        .forEach(d => rD.appendChild(chip(String(d), cfg.duree===d, ()=>setCfg({duree:d}))));
      card.appendChild(rD);

      card.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8',marginBottom:'4px'}},'Format'));
      const rF = $('div',{style:rowStyle});
      [['continu','Continu'],['30/30','30/30'],['40/20','40/20'],['4_1','4 marche/1 course'],['3_2','3 marche/2 course']]
        .forEach(o => {
          const courseOnly = (o[0]==='4_1'||o[0]==='3_2');
          rF.appendChild(chip(o[1], cfg.fractionne===o[0], ()=>setCfg({fractionne:o[0]}), courseOnly && cfg.modalite!=='course'));
        });
      card.appendChild(rF);

      if(cfg.modalite==='swing'){
        card.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8',marginBottom:'4px'}},'Bras'));
        const rB = $('div',{style:rowStyle});
        [[2,'2 bras'],[1,'1 bras alterné']].forEach(o => rB.appendChild(chip(o[1], cfg.bras===o[0], ()=>setCfg({bras:o[0]}))));
        card.appendChild(rB);
        if(cfg.bras===1) card.appendChild($('div',{style:{fontSize:'10px',color:'#f5a623',marginBottom:'4px'}},
          '⚠️ 1 bras : épaule G — 16 kg max, arrêt au moindre signal (pendant ou 48 h), état d\'épaule noté après.'));
      }

      const modLbl = {velo:'Vélo',course:'Course',corde:'Corde',swing:'Swing '+(cfg.bras===1?'1 bras':'2 bras')}[cfg.modalite]||cfg.modalite;
      const fracLbl = {continu:'continu','30/30':'30/30','40/20':'40/20','4_1':'4 marche/1 course','3_2':'3 marche/2 course'}[cfg.fractionne]||cfg.fractionne;
      card.appendChild($('div',{style:{marginTop:'6px',padding:'8px',background:'#0d2b1f',borderRadius:'7px',fontSize:'12px',color:'#6ee7b7',fontWeight:'600'}},
        '▶ '+modLbl+' · '+cfg.duree+' min · '+fracLbl+' — zone 130-150 bpm'));
      el.appendChild(card);

      el.appendChild($('div',{class:'card',style:{fontSize:'11.5px',color:'#94a3b8'}},
        session.objectif || 'Zone 2 — base aérobie, 130-150 bpm. Progression par la durée.'));

      let done=false; try{ done = moteurIsSessionDoneToday(session.id); }catch(_){}
      el.appendChild($('div',{class:'card',style:{cursor:'pointer',background:done?'#0d2b1f':undefined,borderColor:done?'#10b981':undefined},
        onclick:()=>{ try{ moteurToggleSessionDoneToday(session.id); }catch(_){ render(); } }},
        $('div',{class:'check-item',style:{cursor:'pointer'}},
          $('div',{class:'check-box'+(done?' done':'')}, done?'✓':''),
          $('div',{style:{fontWeight:700,fontSize:'13px'}},'Séance effectuée aujourd\'hui'))));
    } catch(err){
      el.appendChild($('div',{class:'card',style:{fontSize:'12px',color:'#f5a623'}},
        'Z2 : base aérobie, zone 130-150 bpm. (Module de configuration indisponible — '+ (err && err.message ? err.message : 'erreur') +')'));
    }
    return;
  }

  const res = moteurResolveSession(session);

  // Bandeau séance compressée — même détection que Guyane (sommeil/HRV/douleur), même présentation.
  try {
    const flags = computeFlags();
    const compFlag = flags.find(f=>f.compressed);
    if(compFlag){
      const guyaneKey = M_GUYANE_SESSION_KEY[session.id];
      const compData = COMPRESSED_MOTEUR[session.id] || (guyaneKey ? COMPRESSED_SESSIONS[guyaneKey] : null);
      const compRegle = COMPRESSED_REGLE[session.id] || null;
      const banner = $('div',{class:'card',style:{borderColor:'#e67e22',background:'#2a1f14'}});
      banner.appendChild($('div',{class:'card-title',style:{color:'#e67e22'}},'🗜️ '+compFlag.metric));
      banner.appendChild($('div',{style:{fontSize:'12px',color:'#c9a06a',marginBottom:'8px'}},
        compRegle || 'Signaux de récupération basse. Version allégée du jour — on coupe du VOLUME, on garde l\'INTENSITÉ :'));
      if(compData){
        const ul=$('div',{style:{fontSize:'13px',lineHeight:'1.7'}});
        compData.forEach(x=>ul.appendChild($('div',{},'• '+x)));
        banner.appendChild(ul);
      } else {
        banner.appendChild($('div',{style:{fontSize:'12px',color:'#8a94a6'}},'Réduis le VOLUME de ~40 % (moins de séries, accessoires coupés) et garde les patterns principaux. ⚠ NE PAS baisser l\'intensité du top set : c\'est le volume qui coûte de la récupération, l\'intensité qui tient les adaptations (programme §2 · manuel ch. 11).'));
      }
      banner.appendChild($('div',{style:{fontSize:'11px',color:'#8a94a6',marginTop:'8px',fontStyle:'italic'}},
        compRegle
          ? 'Faire au rabais coûterait plus que ça ne rapporte. Décider franchement, puis passer à autre chose.'
          : 'Ne saute pas la séance — allège-la. Le mouvement aide la récupération.'));
      el.appendChild(banner);
    }
  } catch(e){}

  // Priming minimaliste — même présentation qu'avant (une ligne compacte), pas de carte complète.
  const primingList = moteurFindGuyanePriming(session);
  // ── Encadré PRIMING : mobilité, activation et primers, construits depuis les créneaux du
  // moteur (source de vérité) et non plus depuis la seule liste Guyane — qui omettait les CARs
  // hors bloc 1, d'où leur disparition de l'écran. Ces éléments préparent, ils ne se loguent pas :
  // les garder hors des cartes d'exercice laisse la place au travail réel.
  const MINIMAL_ROLES = new Set(['cars_echauffement','mobilite_thoracique','activation_epaule',
    'priming_iso_militaire','primer_alactique','activation_fessier','activation_petersen','echauffement_general',
    'priming_jjb_sol','cars_echauffement_hanche']);
  const primingCard = $('div',{class:'card',style:{paddingTop:'9px',paddingBottom:'9px'}});
  primingCard.appendChild($('div',{style:{color:'#f5a623',fontWeight:700,fontSize:'10px',
    textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'6px'}},'⚡ Priming — ne pas fatiguer'));
  let primingCount = 0;
  res.results.forEach(r=>{
    if(!MINIMAL_ROLES.has(r.slot.role) || !r.exId) return;
    const pex = M_EX_BY_ID[r.exId];
    const row = $('div',{style:{display:'flex',gap:'6px',alignItems:'baseline',padding:'3px 0'}});
    row.appendChild($('span',{style:{fontSize:'11.5px',color:'#e2e8f0',fontWeight:'600'}}, pex.name));
    if(r.slot.format_fixe) row.appendChild($('span',{style:{fontSize:'10.5px',color:'#94a3b8',flex:'1'}}, r.slot.format_fixe));
    if(!r.slot.obligatoire) row.appendChild($('span',{style:{fontSize:'9px',color:'#475569'}},'optionnel'));
    const pn = (r.slot.note||'') + (r.slot.note && pex.notes ? ' — ' : '') + (pex.notes||'');
    if(pn.trim()) row.appendChild($('button',{class:'info-btn',onclick:(e)=>{ e.stopPropagation(); showTooltip(e, pn); }},'?'));
    primingCard.appendChild(row); primingCount++;
  });
  // Éléments hérités de la structure Guyane non couverts par un créneau du moteur
  (primingList||[]).forEach(p=>{
    const plain = String(p).replace(/[⚡·]/g,'').toLowerCase();
    if(/\bcars?\b|hip car|thoracique|iso militaire|alactique|rotation ext|clamshell|petersen/.test(plain)) return; // déjà couverts par les créneaux du moteur
    primingCard.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8',padding:'3px 0'}}, p));
    primingCount++;
  });
  if(primingCount) el.appendChild(primingCard);

  res.results.forEach(r=>{
    const slot = r.slot;
    if(MINIMAL_ROLES.has(slot.role)) return; // couvert par la ligne de priming ci-dessus
    if(!r.exId){
      // CHANTIER 68/71 (audit v4) — une absence PRÉVUE (absence_acceptable) s'affiche en gris, « absent,
      // motivé » : ce n'est pas une panne, contrairement à un vrai blocage (rouge, « indisponible »).
      const assumee = !!slot.absence_acceptable || !!r.parContre;
      el.appendChild($('div',{class:'card',style:{borderColor: assumee?'#334155':'#e63946'}},
        $('div',{style:{fontSize:'10px',textTransform:'uppercase',color:'#475569',letterSpacing:'.4px',marginBottom:'4px'}}, M_ROLE_LABEL[slot.role] || slot.role.replace(/_/g,' ')),
        $('div',{style:{fontSize:'13px',fontWeight:600,color: assumee?'#94a3b8':'#ff8087'}},
          (r.parContre?'○ Absent (restriction) — ':assumee?'○ Absent (assumé) — ':'⚠ Indisponible — ')+(r.blockedReason||''))
      ));
      return;
    }
    const ex = M_EX_BY_ID[r.exId];
    const proto = moteurProtocolFor(ex);
    const guyaneRef = moteurFindGuyaneRef(ex.id);
    const exKey = moteurExKey(ex.id) + (session && session.id ? '@'+session.id : '');
    const exLog = getLog()[exKey] || {sets:{}};
    // CHANTIER 49 (31/08) — PRIORITÉ INVERSÉE. La note héritée des fiches du SPLIT (plan abandonné le
    // 08/08) primait sur la note du catalogue : pour 30 exercices, la note maintenue était invisible et
    // c'est la vieille qui s'affichait — dont « Test officiel S9 · Objectif : 80 kg × 3 » sur le bench,
    // cible de juillet périmée depuis le 3RM à 91 kg du 08/08. Le catalogue est désormais la source ;
    // l'héritage ne sert plus que de filet quand le catalogue n'a rien, et il est alors ÉTIQUETÉ.
    const baseNote = ex.notes || ex.note || '';
    const legacyNote = (!baseNote && guyaneRef && guyaneRef.note)
      ? '↩ FICHE HÉRITÉE DU SPLIT (plan abandonné le 08/08) — repère technique conservé faute de note au '
        + 'catalogue. Ce n\'est pas une prescription courante : le créneau ci-dessus fait foi.\n' + guyaneRef.note
      : '';
    // La note de créneau passe dans l'infobulle "?" (comme les autres exercices) au lieu d'occuper
    // un pavé sous le titre : l'écran reste lisible, l'information reste accessible.
    const tooltipNote = [slot.note, baseNote, legacyNote].filter(Boolean).join('\n\n');

    const card = $('div',{class:'ex-card'});
    const hdr = $('div',{class:'ex-header'});
    hdr.appendChild($('span',{class:'ex-num'},'●'));
    hdr.appendChild($('span',{class:'ex-name'}, ex.name));
    // Sélecteur de variante hinge (DL conventionnel / trap bar / RDL) sur les créneaux hinge :
    // permet de choisir librement le mouvement pendant la phase d'apprentissage du deadlift.
    for(const gk in SWAP_GROUPS){
      const grp = SWAP_GROUPS[gk];
      if(!grp.roles.has(slot.role)) continue;
      const _equip = moteurEquipment();
      const choices = grp.choices.filter(c => {
        const ex = M_EX_BY_ID[c[0]];
        if(!ex) return false;
        // masquer une option si son matériel requis n'est pas disponible
        const req = ex.equipment_required || [];
        return req.every(r => _equip.includes(r));
      });
      if(choices.length < 2) continue;
      const swapKey = gk+'_swap@'+(session&&session.id?session.id:'')+'@'+slot.role;
      const sel = $('select',{class:'input-mod',style:{fontSize:'10px',padding:'2px 4px',marginLeft:'6px'},
        onchange:(e)=>{ const l=getLog(); l._swaps=l._swaps||{}; l._swaps[swapKey]=e.target.value; saveLog(l); render(); }
      });
      choices.forEach(c=>{
        const opt=$('option',{value:c[0]}, c[1]);
        if(c[0]===ex.id) opt.selected=true;
        sel.appendChild(opt);
      });
      hdr.appendChild(sel);
    }
    if(r.substituted) hdr.appendChild($('span',{class:'tag tag-purple',style:{fontSize:'9px'}},
      r.viaContraindication?'substitué · contre-indication':(r.viaPattern?'même pattern':'substitué')));
    if(tooltipNote) hdr.appendChild($('button',{class:'info-btn',onclick:(e)=>{ e.stopPropagation(); showTooltip(e, tooltipNote); }},'?'));
    card.appendChild(hdr);
    card.appendChild($('div',{style:{fontSize:'9.5px',textTransform:'uppercase',color:'#475569',letterSpacing:'.4px',marginTop:'-4px',marginBottom:'6px'}},
      (M_ROLE_LABEL[slot.role] || slot.role.replace(/_/g,' '))+(slot.obligatoire?'':' (optionnel)')));
    if(r.substituted && r.from) card.appendChild($('div',{style:{fontSize:'10.5px',color:'#64748b',marginBottom:'4px'}},'Remplace : '+(M_EX_BY_ID_NAME[r.from]||r.from)));
    if(slot.role==='agt_puissance') card.appendChild($('div',{style:{fontSize:'10.5px',color:'#f5a623',fontWeight:'700',marginBottom:'4px'}},'⇄ Alterne avec le slam/swing — 1 semaine sur 2'));


    // Grid infos (format / repos / tempo / RPE cible) — priorité: protocole de cycle > format standard Guyane
    // format_fixe / rpe_fixe : verrou au niveau du slot — prime sur tout protocole de cycle
    // (ex. le RDL volume de Bas 2 reste 3-4×6 même en focus Force, le top set vit en Bas 1).
    // CHANTIER 49 (31/08) — SOURCE UNIQUE. Le repli « fiches du split » est SUPPRIMÉ de ces trois champs :
    // la valeur y était attachée à l'EXERCICE et non au CRÉNEAU, si bien qu'un mouvement ayant changé de
    // rôle traînait le repos de son ancien créneau — Zercher (volume de Bas 2 → TOP SET de FB1) affichait
    // 2 min, RDL (volume → HINGE LOURD de FB2) 2-3 min : les deux séries les plus lourdes de la semaine
    // étaient sous-récupérées à l'écran. Les 75 valeurs concernées ont été portées dans les créneaux
    // (templates v1.3), corrigées là où elles contredisaient le programme.
    let format = slot.format_fixe ? slot.format_fixe : (proto ? proto.format : moteurDefaultFormat(ex));
    const rpeCible = slot.rpe_fixe ? slot.rpe_fixe : (proto ? proto.rpe : (moteurDefaultRpe(ex) || null));

    // v4.14 (chantier v6-2, demande de J du 04/09) — SÉLECTEUR SEUIL : modalité (vélo/course) + semaine
    // de progression S1-S8, au lieu d'une seule note statique « Progression S1→S8 » à interpréter soi-même.
    // ⚠ Rappel du 04/09 (Programme v4_82) : ces valeurs cadrent la STRUCTURE (durées, répétitions), jamais
    // l'allure — piloter au ressenti/respiration, jamais viser un chiffre de vitesse fixe.
    let seuilSelectorBox = null;
    if(slot.role === 'seuil_bloc'){
      format = 'S'+MS.seuilSemaine+' · '+(MS.seuilModalite==='course'?'course':'vélo')+' · '+moteurSeuilFormatLabel(MS.seuilModalite, MS.seuilSemaine);
      seuilSelectorBox = $('div',{style:{display:'flex',gap:'6px',flexWrap:'wrap',margin:'2px 0 8px'}});
      const modSel = $('select',{class:'input-mod',style:{fontSize:'10.5px',padding:'3px 6px'},
        onchange:(e)=>{ MS.seuilModalite=e.target.value; saveMoteurState(); }});
      [['velo','Vélo'],['course','Course']].forEach(([v,lbl])=>{
        const o=$('option',{value:v},lbl); if(MS.seuilModalite===v) o.setAttribute('selected','selected'); modSel.appendChild(o);
      });
      const semSel = $('select',{class:'input-mod',style:{fontSize:'10.5px',padding:'3px 6px'},
        onchange:(e)=>{ MS.seuilSemaine=Number(e.target.value); saveMoteurState(); }});
      for(let s=1;s<=8;s++){
        const o=$('option',{value:String(s)},'S'+s); if(MS.seuilSemaine===s) o.setAttribute('selected','selected'); semSel.appendChild(o);
      }
      seuilSelectorBox.appendChild(modSel);
      seuilSelectorBox.appendChild(semSel);
      if(MS.seuilModalite==='course') seuilSelectorBox.appendChild($('div',
        {style:{fontSize:'9.5px',color:'#f5a623',flexBasis:'100%',marginTop:'2px'}},
        '⚠ Durées de référence, pas une vitesse à tenir — respiration en juge de paix (v4_82, leçon du 04/09).'));
    }

    const tempoSource = (slot.note||'') + ' ' + (baseNote||'') + ' ' + (format||'');
    const tempoMatch = tempoSource.match(/[Tt]empo\s+([0-9X]-[0-9X]-[0-9X]-[0-9X])/);
    if(seuilSelectorBox) card.appendChild(seuilSelectorBox);
    const grid = $('div',{class:'ex-grid'});
    grid.appendChild($('div',{class:'ex-cell'},
      $('div',{class:'ex-cell-lbl'},'Format'),
      $('div',{class:'ex-cell-val purple'}, format || '—')
    ));
    const NO_REPOS_CATEGORIES = new Set(['cars_mobilite','respiration','test']);
    // Le repos défini sur le CRÉNEAU prime sur l'ancienne référence héritée : sinon le bench de
    // Haut 3 (volume) héritait des 5 min du bench lourd de Haut 2.
    const reposSrc = slot.repos ? slot.repos : null;
    const rTimers = reposSrc ? parseReposAll(reposSrc) : [{sec:120,lbl:'2 min'}];
    if(!NO_REPOS_CATEGORIES.has(ex.category)){
      const reposCell = $('div',{class:'ex-cell'});
      reposCell.appendChild($('div',{class:'ex-cell-lbl'},'Repos'));
      if(rTimers.length){
        const btnWrap = $('div',{class:'timer-btns'});
        rTimers.forEach(t=>btnWrap.appendChild($('button',{class:'timer-btn',onclick:(e)=>{ e.stopPropagation(); startTimer(t.sec, ex.name); }},'⏱ '+t.lbl)));
        reposCell.appendChild(btnWrap);
      } else {
        reposCell.appendChild($('div',{class:'ex-cell-val red'}, reposSrc || '2 min'));
      }
      grid.appendChild(reposCell);
    }
    if(tempoMatch) grid.appendChild($('div',{class:'ex-cell'},
      $('div',{class:'ex-cell-lbl'},'Tempo'),
      $('div',{class:'ex-cell-val teal'}, tempoMatch[1])
    ));
    if(rpeCible) grid.appendChild($('div',{class:'ex-cell'},
      $('div',{class:'ex-cell-lbl'},'RPE cible'),
      $('div',{class:'ex-cell-val gold'}, rpeCible)
    ));
    card.appendChild(grid);
    // CHANTIER 54 (31/08) — format_fixe prime sur le protocole de cycle (c'est voulu : le créneau décide
    // du format). Effet de bord : en semaine de DÉLOAD, le protocole renvoyait « volume −50 % » et il
    // était écrasé par le format du créneau — la carte affichait donc le volume plein d'une semaine
    // normale, alors que le bandeau de séance annonçait un déload. Le déload est le 09-15/09 : on ne peut
    // pas laisser la couche qui pilote la séance réelle contredire la vague. La règle est donc AJOUTÉE
    // sous la grille au lieu de disparaître.
    if(proto && proto.phase === 'deload'){
      card.appendChild($('div',{style:{fontSize:'10.5px',color:'#7dd3fc',fontWeight:'700',margin:'4px 0 2px'}},
        M_FORCE_TOPSET.has(ex.id)
          ? "🌙 DÉLOAD — top set MAINTENU à son RPE, aucun back-off : c'est le volume qui part, pas l'intensité."
          : '🌙 DÉLOAD — séries de travail ÷2, charge et technique INCHANGÉES. Sautent en premier : WC glyco, BFR, volume accessoire.'));
    }

    // ── Rampe d'approche calculée (top set à la barre uniquement) ──
    if(ex.progression_type === 'barre' && M_FORCE_TOPSET.has(ex.id) && /top set/i.test(format||'') && !/jamais|pas de|sans/i.test(format||'')){
      const cible = (exLog.charge != null ? exLog.charge : moteurGetCharge(ex.id));
      const rampe = moteurRampeTopSet(cible);
      if(rampe){
        const box = $('div',{style:{background:'#0d1525',borderRadius:'7px',padding:'8px',marginBottom:'8px'}});
        box.appendChild($('div',{style:{fontSize:'10px',color:'#64748b',marginBottom:'6px'}},
          'Montée en charge — approches non fatigantes (ne pas chercher la fatigue avant le top set) :'));
        const line = $('div',{style:{display:'flex',flexWrap:'wrap',gap:'5px'}});
        rampe.forEach(s=>{
          line.appendChild($('div',{style:{padding:'4px 7px',borderRadius:'5px',fontSize:'10.5px',
            background: s.top ? '#8b5cf6' : '#1e293b', color: s.top ? '#fff' : '#cbd5e1',
            fontWeight: s.top ? '700' : '500'}},
            s.kg + ' ' + s.reps));
        });
        box.appendChild(line);
        box.appendChild($('div',{style:{fontSize:'9.5px',color:'#475569',marginTop:'5px'}},
          'Top set ×3 @RIR 1 = triple lourd du jour, PAS un 3RM (le vrai 3RM est réservé aux jours de test). Repos 2-3 min avant le top set.'));
        card.appendChild(box);
      }
    }

    if(ex.progression_type !== 'aucun'){
      // Repère "dernière fois" si l'exercice n'a pas été refait depuis un moment
      const pastLog = moteurLastPastLog(ex.id);
      if(pastLog && !exLog.charge){
        const daysAgo = moteurDaysAgo(pastLog.date);
        const [y,mo,da] = pastLog.date.split('-');
        card.appendChild($('div',{style:{fontSize:'10.5px',color:'#f5a623',marginBottom:'6px'}},
          '📌 Dernière fois : '+pastLog.entry.charge+' '+moteurGetChargeUnit(ex.id)+
          (pastLog.entry.rpe?' · RPE '+pastLog.entry.rpe:'')+' — le '+da+'/'+mo+'/'+y+' (il y a '+daysAgo+' j)'));
      }

      // Charge + RPE réel (mêmes champs que le reste de l'app — pas de doublon RIR)
      const unit = moteurGetChargeUnit(ex.id);
      const seedOrLast = moteurGetCharge(ex.id);
      const chargeRow = $('div',{style:{display:'flex',alignItems:'center',gap:'5px',marginBottom:'8px',background:'#0d1525',borderRadius:'7px',padding:'6px 7px',flexWrap:'nowrap'}});
      if(ex.progression_type !== 'isometrie'){
        chargeRow.appendChild($('span',{style:{fontSize:'10px',color:'#475569'}}, unit));
        chargeRow.appendChild($('input',{class:'input-mod',type:'number',step:'0.5',style:{width:'56px'},
          value: exLog.charge!=null?exLog.charge:'', placeholder: seedOrLast!=null?String(seedOrLast):'—',
          oninput:(e)=>{ moteurSetTodayField(ex.id,'charge', e.target.value===''?null:Number(e.target.value), session&&session.id); moteurSetTodayField(ex.id,'fmt', format||'', session&&session.id); },
          onchange:(e)=>{ moteurSetTodayField(ex.id,'charge', e.target.value===''?null:Number(e.target.value), session&&session.id); moteurSetTodayField(ex.id,'fmt', format||'', session&&session.id); render(); }
        }));
      }
      // Champ Reps éditable — utile pour les mouvements en apprentissage (DL, front squat) où
      // le nombre de reps par série varie volontairement pendant l'acquisition technique.
      chargeRow.appendChild($('span',{style:{fontSize:'10px',color:'#475569'}},'reps'));
      chargeRow.appendChild($('input',{class:'input-mod',type:'number',min:'1',max:'30',step:'1',
        value: exLog.reps!=null?exLog.reps:'', placeholder:'—', style:{width:'52px'},
        oninput:(e)=>{ moteurSetTodayField(ex.id,'reps', e.target.value===''?null:Number(e.target.value), session&&session.id); },
        onchange:(e)=>{ moteurSetTodayField(ex.id,'reps', e.target.value===''?null:Number(e.target.value), session&&session.id); render(); }
      }));
      chargeRow.appendChild($('span',{style:{fontSize:'10px',color:'#475569'}},'RPE'));
      chargeRow.appendChild($('input',{class:'input-mod',type:'number',min:'1',max:'10',style:{width:'46px'},
        value: exLog.rpe||'', placeholder:'—',
        oninput:(e)=>{ moteurSetTodayField(ex.id,'rpe', e.target.value, session&&session.id); moteurSetTodayField(ex.id,'fmt', format||'', session&&session.id); },
        onchange:(e)=>{ moteurSetTodayField(ex.id,'rpe', e.target.value, session&&session.id); moteurSetTodayField(ex.id,'fmt', format||'', session&&session.id); render(); }
      }));
      card.appendChild(chargeRow);

      const sugg = moteurProgressionSuggestion(ex.id);
      if(sugg){
        const suggRow = $('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'8px',flexWrap:'wrap'}},
          $('span',{style:{fontSize:'10.5px',color:'#3b82f6'}},'→ '+sugg.text)
        );
        if(ex.progression_type === 'barre'){
          suggRow.appendChild($('button',{class:'btn btn-ghost btn-sm',style:{fontSize:'9.5px',padding:'3px 8px'},
            onclick:()=>moteurApplyProgression(ex.id, session&&session.id)},'Appliquer'));
        }
        card.appendChild(suggRow);
      }
    }

    // Sets à cocher
    card.appendChild($('div',{style:{fontSize:'10px',color:'#475569',marginBottom:'5px',fontWeight:'600',textTransform:'uppercase',letterSpacing:'.4px'}},'Séries effectuées:'));
    const setsRow = $('div',{class:'sets-row'});
    const extraSets = (exLog.sets_extra || 0);
    const maxSets = Math.max(2, Math.min(9, moteurNbSeries(format) + extraSets));
    for(let s=1; s<=maxSets; s++){
      const isDone = exLog.sets && exLog.sets[s];
      setsRow.appendChild($('div',{
        class:'set-chip'+(isDone?' done':''),
        onclick:()=>{
          const l = getLog(); const e2 = l[exKey] || {sets:{}};
          e2.sets = e2.sets || {};
          const wasDone = e2.sets[s];
          e2.sets[s] = !wasDone;
          l[exKey] = e2; saveLog(l); render();
          if(!wasDone && rTimers.length>0){
            setTimeout(()=>startTimer(rTimers[0].sec, ex.name), 500);
          }
        }
      }, isDone?'✓':' ', 'Set '+s));
    }
    setsRow.appendChild($('div',{class:'set-chip',style:{opacity:'0.55',fontWeight:'700'},
      onclick:()=>{ const l=getLog(); const e2=l[exKey]||{sets:{}};
        e2.sets_extra=(e2.sets_extra||0)+1; l[exKey]=e2; saveLog(l); render(); }
    },'+','Série'));
    if(extraSets > 0){
      setsRow.appendChild($('div',{class:'set-chip',style:{opacity:'0.4'},
        onclick:()=>{ const l=getLog(); const e2=l[exKey]||{sets:{}};
          e2.sets_extra=Math.max(0,(e2.sets_extra||0)-1);
          if(e2.sets) delete e2.sets[maxSets];
          l[exKey]=e2; saveLog(l); render(); }
      },'\u2212','Série'));
    }
    card.appendChild(setsRow);

    // Notes perso
    const notesEl = $('textarea',{class:'textarea-field',rows:'2',placeholder:'Notes perso (optionnel)…',style:{fontSize:'11px'}});
    notesEl.value = exLog.notes||'';
    notesEl.oninput = (e)=>moteurSetTodayField(ex.id,'notes', e.target.value, session&&session.id);
    card.appendChild(notesEl);

    el.appendChild(card);
  });

  const isDoneToday = moteurIsSessionDoneToday(session.id);
  el.appendChild($('div',{class:'card',style:{cursor:'pointer',background: isDoneToday?'#0d2b1f':undefined,borderColor: isDoneToday?'#10b981':undefined},
    onclick:()=>moteurToggleSessionDoneToday(session.id)
  },
    $('div',{class:'check-item',style:{cursor:'pointer'}},
      $('div',{class:'check-box'+(isDoneToday?' done':'')}, isDoneToday?'✓':''),
      $('div',{style:{fontWeight:700,fontSize:'13px'}},'Séance effectuée aujourd\'hui')
    )
  ));
}

// ── ONGLET 3 — GTG ───────────────────────────────────────────────────────

// v4.22 (07/09) — refonte allégée sur demande de J : plus de carte de règles en tête, plus de
// bouton « ? » (tooltip jugé peu utile ici), plus de note rapide par exo. Chaque exercice se
// réduit à nom + une valeur cible compacte + 4 chips « Set N » (même motif que Sport), pour
// prendre moins de place et ressembler aux autres onglets de Routine.
function renderGTG(){
  const log = getLog();
  const gtgLog = log.gtg || {};
  const el = $('div',{});

  GTG_EXERCICES.forEach(ex=>{
    const exLog = gtgLog[ex.id] || {passages:[]};
    const card = $('div',{class:'card'});

    // Valeur cible compacte : les reps sans le "1×" + la charge, seulement si charge réelle
    // (on masque "BW"/"BW passif" — le poids du corps n'apporte rien à afficher ici).
    const repsCourt = (ex.reps||'').replace(/^1×/,'').trim();
    const chargeReelle = ex.charge && ex.charge!=='—' && !/^BW/i.test(ex.charge);
    const target = repsCourt + (chargeReelle ? ' · '+ex.charge : '');

    card.appendChild($('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}},
      $('span',{style:{fontSize:'18px'}},ex.icon),
      $('div',{style:{flex:1,minWidth:'0'}},
        $('div',{style:{fontWeight:'700',fontSize:'13px',color:'var(--text)'}},ex.name),
        $('div',{style:{fontSize:'11px',color:'#64748b'}},target),
      ),
      $('button',{class:'info-btn',onclick:(e)=>{ e.stopPropagation(); showTooltip(e,ex.note); }},'?')
    ));

    const passRow = $('div',{class:'sets-row'});
    for(let p=1;p<=4;p++){
      const done = exLog.passages.includes(p);
      const chip = $('div',{
        class:'set-chip'+(done?' done':''),
        onclick:()=>{
          const l=getLog(); const g=l.gtg||{};
          const el_=(g[ex.id]||{passages:[]});
          const idx=el_.passages.indexOf(p);
          if(idx>-1) el_.passages.splice(idx,1); else el_.passages.push(p);
          g[ex.id]=el_; l.gtg=g; saveLog(l); render();
        }
      }, done?'✓':' ', 'Set '+p);
      passRow.appendChild(chip);
    }
    card.appendChild(passRow);

    el.appendChild(card);
  });

  return el;
}

// ── ONGLET TIR (v4.20, chantier « Ops », 05/09) ─────────────────────────────
// Premier passage de transcription du programme SP2022 Phases 2 & 3. Structure et navigation
// complètes ; le suivi fin (carnets détaillés, saisie des groupements) reste à affiner avec J.
function renderTir(){
  const log = getLog();
  const el = $('div',{});
  el.appendChild($('div',{class:'section-hdr'},'🔫 Tir — SP2022'));

  const sem = TIR_DATA.semaines.find(s=>s.id===MS.tirSemaine) || TIR_DATA.semaines[0];

  // Sélecteur de semaine S5-S12
  const selRow = $('div',{style:{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'10px'}});
  TIR_DATA.semaines.forEach(s=>{
    selRow.appendChild($('button',{
      style:{padding:'6px 10px',borderRadius:'7px',fontSize:'11px',fontWeight:'700',cursor:'pointer',
        border:'1px solid '+(s.id===MS.tirSemaine?'#f5a623':'#334155'),
        background:s.id===MS.tirSemaine?'#2a2214':'#111d2e',
        color:s.id===MS.tirSemaine?'#f5a623':'#94a3b8'},
      onclick:()=>{ MS.tirSemaine=s.id; saveMoteurState(); }
    }, 'S'+s.id));
  });
  el.appendChild(selRow);

  const phaseTag = $('div',{style:{marginBottom:'8px'}},
    $('span',{class:'tag',style:{background:sem.phase===2?'#3b82f622':'#8b5cf622',color:sem.phase===2?'#3b82f6':'#8b5cf6'}},'Phase '+sem.phase));
  el.appendChild(phaseTag);

  const headCard = $('div',{class:'card'});
  headCard.appendChild($('div',{style:{fontSize:'16px',fontWeight:'800'}}, 'S'+sem.id+' — '+sem.titre));
  headCard.appendChild($('div',{style:{fontSize:'11.5px',color:'#64748b',marginTop:'4px',fontStyle:'italic'}}, sem.lede));
  el.appendChild(headCard);

  const blockCard = (titre, icon, items, sub) => {
    const card = $('div',{class:'card'});
    card.appendChild($('div',{class:'card-title'}, icon+' '+titre+(sub&&sub.duree?' — '+sub.duree+' min':'')));
    const ul = $('div',{});
    (sub?sub.items:items).forEach(it=>ul.appendChild($('div',{style:{fontSize:'12px',color:'#cbd5e1',padding:'3px 0',display:'flex',gap:'6px'}},
      $('span',{style:{color:'#f5a623',flexShrink:'0'}},'·'), $('span',{},it))));
    return card;
  };

  el.appendChild($('div',{class:'card-title',style:{marginTop:'4px'}},'🏠 DOMICILE — laser, 20 min/jour'));
  sem.domicile.forEach(b=>el.appendChild(blockCard(b.titre,'▸',null,b)));

  el.appendChild($('div',{class:'card-title',style:{marginTop:'4px'}},'🎯 CLUB — 25 m réel, 50 cps/séance'));
  sem.club.forEach(b=>el.appendChild(blockCard(b.titre,'▸',null,b)));

  const focusCard = $('div',{class:'card',style:{background:'#1a1408',borderColor:'#f5a62333'}});
  focusCard.appendChild($('div',{style:{fontSize:'11px',fontWeight:'700',color:'#f5a623',marginBottom:'4px'}},'FOCUS'));
  focusCard.appendChild($('div',{style:{fontSize:'12.5px',color:'#e0e1dd',marginBottom:'6px'}}, sem.focus));
  focusCard.appendChild($('div',{style:{fontSize:'11px',color:'#64748b'}},'Mesure : '+sem.mesure));
  el.appendChild(focusCard);

  if(TIR_DATA.conformites_binaires && sem.phase===3){
    const cb = $('div',{class:'card',style:{background:'#3f1d1d',borderColor:'#7f1d1d'}});
    cb.appendChild($('div',{style:{fontSize:'10px',fontWeight:'800',color:'#fca5a5',marginBottom:'4px'}},'⚠ CONFORMITÉS BINAIRES — priment sur tout chrono'));
    TIR_DATA.conformites_binaires.forEach(c=>cb.appendChild($('div',{style:{fontSize:'10.5px',color:'#fecaca',padding:'2px 0'}},'· '+c)));
    el.appendChild(cb);
  }

  // Fait aujourd'hui + note
  const tirLog = log.tir || {};
  el.appendChild($('div',{class:'card',style:{cursor:'pointer',background:tirLog.done?'#0d2b1f':undefined,borderColor:tirLog.done?'#10b981':undefined},
    onclick:()=>{ const l=getLog(); const t=l.tir||{}; t.done=!t.done; l.tir=t; saveLog(l); render(); }},
    $('div',{class:'check-item',style:{cursor:'pointer'}},
      $('div',{class:'check-box'+(tirLog.done?' done':'')}, tirLog.done?'✓':''),
      $('div',{style:{fontWeight:700,fontSize:'13px'}},'Séance tir effectuée aujourd\'hui'))));
  const tirNote = $('input',{class:'input-field',type:'text',placeholder:'Note rapide (groupe mesuré, temps, ressenti…)',
    style:{marginTop:'8px',fontSize:'12px',padding:'7px 10px'}, value:tirLog.note||'',
    oninput:(e)=>{ const l=getLog(); const t=l.tir||{}; t.note=e.target.value; l.tir=t; saveLog(l); }});
  el.appendChild(tirNote);

  el.appendChild($('div',{style:{fontSize:'10px',color:'#475569',marginTop:'10px',fontStyle:'italic'}},
    TIR_DATA.meta.perimetre));

  return el;
}

// ── ONGLET STG — SAUVETAGE TACTIQUE (v4.20, chantier « Ops », 05/09) ────────
function renderStg(){
  const log = getLog();
  const el = $('div',{});
  el.appendChild($('div',{class:'section-hdr'},'🚑 STG — Sauvetage Tactique'));

  // Quotidien (5 min)
  const qCard = $('div',{class:'card'});
  qCard.appendChild($('div',{class:'card-title'},'⏱ QUOTIDIEN — 5 min'));
  STG_DATA.cycle.quotidien.items.forEach(it=>qCard.appendChild($('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'12px',padding:'3px 0'}},
    $('span',{style:{color:'#cbd5e1'}}, it.exercice), $('span',{style:{color:'#f5a623',fontWeight:'700'}}, it.standard))));
  const qDone = (log.stg_quotidien===true);
  qCard.appendChild($('div',{style:{marginTop:'8px',cursor:'pointer',display:'flex',alignItems:'center',gap:'8px'},
    onclick:()=>{ const l=getLog(); l.stg_quotidien=!l.stg_quotidien; saveLog(l); render(); }},
    $('div',{class:'check-box'+(qDone?' done':'')}, qDone?'✓':''),
    $('div',{style:{fontSize:'12px',fontWeight:'700'}},'Fait aujourd\'hui')));

function renderCalendrierMensuel(){
  const el = $('div',{});
  el.appendChild($('div',{class:'card-title'},'📅 CALENDRIER'));
    // Mois affiché (S.calMonth = offset depuis le mois courant, 0 = courant)
    const calOffset = S.calMonth || 0;
    const now = new Date();
    const viewDate = new Date(now.getFullYear(), now.getMonth()+calOffset, 1);
    const yr = viewDate.getFullYear(); const mo = viewDate.getMonth();
    const moNames = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
    // Couleurs par séance. v4.24 (11/09, demande J) : recolorées par famille — vert pour les Z2,
    // rouge pour VO2max/VMA, orange pour le Seuil, bleu pour les Portages, gris pour les FB.
    // 'Haut 1/2/3', 'Bas 1/2' et 'Z2 Swings' sont l'ancien split abandonné le 30/08 — encore
    // nécessaires pour colorer correctement les vieux jours du journal qui les portent, mais
    // retirés de la LÉGENDE ci-dessous (LEGENDE_EXCLUE) pour ne plus l'alourdir sans utilité.
    const seanceColors = {'Haut 1':'#1E3A5F','Bas 1':'#06b6d4','AGT':'#10b981','Haut 2':'#7C3AED','Bas 2':'#e63946','Z2 Swings':'#3b82f6','Haut 3':'#a78bfa',
      'Seuil':'#f97316','VO2max':'#ef4444','VMA':'#dc2626','Work capacity':'#8b5cf6',
      'Z2':'#22c55e','Z2 long':'#16a34a','Portage 1':'#3b82f6','Portage 2':'#2563eb','FB1':'#64748b','FB2':'#475569'};
    const LEGENDE_EXCLUE = ['Haut 1','Haut 2','Haut 3','Bas 1','Bas 2','Z2 Swings'];
    // Abréviations des badges — réutilisées à l'identique pour les puces de la légende, afin
    // qu'elles restent forcément synchronisées avec ce qui s'affiche réellement sur les jours.
    const abbr={'H1':'H1','B1':'B1','AGT':'AGT','H2':'H2','B2':'B2','FB1':'FB1','FB2':'FB2','Z2 Swings':'Z2','H3':'H3',
      'Seuil':'Seuil','VO2max':'VO2','VMA':'VMA','WC glyco':'WCg','WC seuil':'WCs','T1/T2':'T1','Z2':'Z2','Z2 long':'Z2L',
      'Portage 1':'Port.1','Portage 2':'Port.2'};
    // Construire map date -> séances faites (via clés ex_ pour Guyane, log.moteur_sessions pour le Moteur)
    const dayMap = {};
    Object.keys(localStorage).filter(k=>k.startsWith('log:')).forEach(k=>{
      const ds = k.slice(4);
      try {
        const entry = JSON.parse(localStorage.getItem(k));
        const sess = new Set();
        Object.keys(entry).forEach(ek=>{
          if(ek.startsWith('ex_') && !ek.startsWith('ex_moteur_') && entry[ek] && (entry[ek].charge||entry[ek].rpe||entry[ek].notes)){
            const nm = ek.slice(3).replace(/_b\d+_\d+.*$/,'');
            if(seanceColors[nm]) sess.add(nm);
          }
        });
        (entry.moteur_sessions||[]).forEach(sid=>{
          const st = MTPL.session_types.find(s=>s.id===sid);
          if(st) sess.add(st.nom);
        });
        // routine faite ?
        const hasRoutine = entry.routine && entry.routine.length>0;
        // v4.22 (07/09) — le calendrier doit aussi signaler Tir et STG (demande J), avec un
        // pictogramme distinct des séances Sport plutôt que mélangés aux mêmes badges couleur.
        const hasTir = !!(entry.tir && entry.tir.done);
        const hasStg = !!(entry.stg_quotidien || entry.stg_post_seance);
        if(sess.size>0 || hasRoutine || hasTir || hasStg || (entry.soir&&entry.soir.seance)) dayMap[ds] = {sess:[...sess], routine:hasRoutine, tir:hasTir, stg:hasStg, entry};
      } catch(e){}
    });
    // En-tête navigation mois
    const navRow = $('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'12px'}});
    navRow.appendChild($('button',{class:'btn btn-ghost btn-sm',onclick:()=>{ S.calMonth=(S.calMonth||0)-1; render(); }},'‹'));
    navRow.appendChild($('div',{style:{fontWeight:'700',fontSize:'15px'}},moNames[mo]+' '+yr));
    navRow.appendChild($('button',{class:'btn btn-ghost btn-sm',onclick:()=>{ S.calMonth=(S.calMonth||0)+1; render(); }},'›'));
    el.appendChild(navRow);
    // Grille calendrier
    const grid = $('div',{style:{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:'3px',width:'100%',boxSizing:'border-box'}});
    ['L','M','M','J','V','S','D'].forEach(d=>grid.appendChild($('div',{style:{textAlign:'center',fontSize:'10px',color:'#64748b',fontWeight:'600',padding:'2px 0'}},d)));
    // Premier jour (lundi=0)
    let firstDay = new Date(yr,mo,1).getDay(); firstDay = firstDay===0?6:firstDay-1;
    const daysInMonth = new Date(yr,mo+1,0).getDate();
    for(let i=0;i<firstDay;i++) grid.appendChild($('div',{}));
    const todayS = (new Date()).toISOString().slice(0,10);
    for(let d=1;d<=daysInMonth;d++){
      const ds = yr+'-'+String(mo+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
      const dayData = dayMap[ds];
      const isToday = ds===todayS;
      const cell = $('div',{style:{aspectRatio:'1',border:isToday?'2px solid #f5a623':'1px solid #1e2d42',borderRadius:'6px',padding:'2px',display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'flex-start',cursor:dayData?'pointer':'default',boxSizing:'border-box',minWidth:'0',overflow:'hidden'}});
      cell.appendChild($('div',{style:{fontSize:'10px',color:dayData?'#e0e1dd':'#475569',fontWeight:isToday?'700':'400'}},String(d)));
      if(dayData){
        const labels=$('div',{style:{display:'flex',flexDirection:'column',gap:'1px',width:'100%',marginTop:'1px',alignItems:'stretch'}});
        dayData.sess.forEach(s=>labels.appendChild($('div',{style:{fontSize:'8px',fontWeight:'700',color:'#fff',background:seanceColors[s]||'#64748b',borderRadius:'3px',padding:'1px 2px',textAlign:'center',lineHeight:'1.2',overflow:'hidden',whiteSpace:'nowrap'}},abbr[s]||s)));
        if(dayData.routine && dayData.sess.length===0 && !dayData.tir && !dayData.stg) labels.appendChild($('div',{style:{fontSize:'8px',color:'#94a3b8',textAlign:'center'}},'routine'));
        cell.appendChild(labels);
        // Tir 🔫 / STG 🚑 : pictogrammes distincts des séances Sport (v4.22)
        if(dayData.tir || dayData.stg){
          const iconsRow = $('div',{style:{display:'flex',gap:'2px',justifyContent:'center',marginTop:'1px'}});
          if(dayData.tir) iconsRow.appendChild($('span',{style:{fontSize:'9px',lineHeight:'1'}},'🔫'));
          if(dayData.stg) iconsRow.appendChild($('span',{style:{fontSize:'9px',lineHeight:'1'}},'🚑'));
          cell.appendChild(iconsRow);
        }
        cell.onclick=()=>{ S.tab='bilan'; S.bilanSub='journal'; S.journalDetail=ds; S.journalDetailData=dayData.entry; render(); };
      }
      grid.appendChild(cell);
    }
    el.appendChild(grid);
    // Légende — exclut l'ancien split (Haut/Bas/Z2 Swings, demande J du 11/09), garde tout le
    // reste. Réutilise `abbr` (défini plus haut, identique à celui des badges des jours).
    const leg=$('div',{style:{marginTop:'14px',display:'flex',flexWrap:'wrap',gap:'8px'}});
    Object.entries(seanceColors).filter(([nm])=>!LEGENDE_EXCLUE.includes(nm)).forEach(([nm,col])=>{
      leg.appendChild($('div',{style:{display:'flex',alignItems:'center',gap:'4px',fontSize:'11px',color:'#94a3b8'}},
        $('div',{style:{fontSize:'8px',fontWeight:'700',color:'#fff',background:col,borderRadius:'3px',padding:'1px 4px'}},abbr[nm]||nm), nm));
    });
    leg.appendChild($('div',{style:{display:'flex',alignItems:'center',gap:'4px',fontSize:'11px',color:'#94a3b8'}},
      $('span',{style:{fontSize:'10px'}},'🔫'), 'Tir'));
    leg.appendChild($('div',{style:{display:'flex',alignItems:'center',gap:'4px',fontSize:'11px',color:'#94a3b8'}},
      $('span',{style:{fontSize:'10px'}},'🚑'), 'STG'));
    el.appendChild($('div',{style:{fontSize:'11px',color:'#64748b',fontWeight:'600',marginTop:'10px',marginBottom:'4px'}},'Légende'));
    el.appendChild(leg);
    el.appendChild($('div',{style:{fontSize:'11px',color:'#475569',marginTop:'10px',fontStyle:'italic'}},'Touche un jour avec séance pour voir le détail. Cadre orange = aujourd\'hui.'));
    return el;
}

          saveMoteurState();
        }},(active?'✓ ':'')+e.label));
      });

    }
    // v4.3 — début de fenêtre éditable : c'est lui qui positionne toute la vague 3+1 (donc le

function exportCSV(){
  const keys=Object.keys(localStorage).filter(k=>k.startsWith('log:')).sort();
  if(!keys.length){alert('Aucun log à exporter.');return;}
  const H=['Date','Énergie','Motivation','Douleur','HRV','BOLT','Sommeil_h','Qualité_sommeil','Séance','RPE','Humeur','Notes_matin','Ressenti','Positif','À_améliorer'];
  const esc=v=>('"'+(v||'').toString().replace(/"/g,'""')+'"');
  const rows=[H.map(esc).join(',')];
  keys.forEach(k=>{
    try{
      const d=JSON.parse(localStorage.getItem(k));
      const m=d.matin||{};const s=d.soir||{};
      rows.push([k.slice(4),m.energie,m.motivation,m.douleur,m.hrv,m.bolt,m.sleep_hours,m.sleep_quality,
        s.seance,s.rpe,s.mood,m.notes,d.journal_ressenti,d.journal_positif,d.journal_ameliorer].map(esc).join(','));
    }catch(e){}
  });
  const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='training-history-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}


function exportJSON(){
  const keys=Object.keys(localStorage).filter(k=>k.startsWith('log:')).sort();

  const data={exportDate:new Date().toISOString(),programStart:localStorage.getItem('programStart')||null,totalJours:keys.length,logs:{}};
  keys.forEach(k=>{try{data.logs[k.slice(4)]=JSON.parse(localStorage.getItem(k));}catch(e){}});

}

function importHistory(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        const logs=data.logs||data;
        const allDates=Object.keys(logs).filter(d=>d.match(/^\d{4}-\d{2}-\d{2}$/));
        const dateRange=allDates.length?allDates.sort()[0]+' au '+allDates.sort().slice(-1)[0]:'aucune';
        let n=0, merged=0;
        Object.entries(logs).forEach(([date,entry])=>{
          if(!date.match(/^\d{4}-\d{2}-\d{2}$/)) return; // skip non-date keys
          const existKey='log:'+date;
          const existing=localStorage.getItem(existKey);
          if(!existing){
            localStorage.setItem(existKey,JSON.stringify(entry)); n++;
          } else {
            // Fusion : compléter les champs manquants sans écraser ceux déjà remplis
            try{
              const cur=JSON.parse(existing);
              let changed=false;
              Object.entries(entry).forEach(([k,v])=>{
                if(cur[k]===undefined || cur[k]===null || cur[k]==='' || (typeof cur[k]==='object' && Object.keys(cur[k]||{}).length===0)){
                  cur[k]=v; changed=true;
                }
              });
              if(changed){ localStorage.setItem(existKey,JSON.stringify(cur)); merged++; }
            }catch(e){ localStorage.setItem(existKey,JSON.stringify(entry)); n++; }
          }
        });
        // Importer aussi les autres clés (baselines, ts, etc.) si présentes hors 'logs'
        if(data.logs){
          Object.entries(data).forEach(([k,v])=>{
            if(k==='logs'||k==='exportDate'||k==='programStart'||k==='totalJours') return;
            if(typeof v==='string' && !localStorage.getItem(k)){ localStorage.setItem(k,v); }
          });
        }
        alert('Fichier lu : '+allDates.length+' dates ('+dateRange+').\n\nRésultat : '+n+' nouvelle(s) + '+merged+' complétée(s).\n\nSi 0+0 : ces dates existent déjà identiques dans cette app.');
        render();
      }catch(ex){alert('Fichier invalide.');}
    };
    reader.readAsText(file);
  };
  input.click();
}


// ── ONGLET MOTEUR — mode maison/déplacement, matériel, durée, séances ──────
// Qualités jugées prioritaires selon le focus/cycle actif — sert à mettre en valeur les séances
// pertinentes (ex. ni VMA, ni VO2max, ni work capacity ne sont mis en avant en focus Force max).
function moteurRelevantQualities(){
  const info = moteurCycleInfo();
  if(!info) return null;
  if(info.type === 'force') return ['force_max'];
  if(info.type === 'puissance') return ['alactique','repetition_puissance'];
  if(info.type === 'prep_tests' || info.type === 'semaine_tests') return ['force_max'];
  return null;
}
function moteurSessionRelevant(session){
  const q = moteurRelevantQualities();
  if(!q) return false;
  return (session.qualites_prioritaires||[]).some(x=>q.includes(x));
}
