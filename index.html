      '🟢  Faisable telle quelle\n'+
      '🟠  Faisable avec substitutions (matériel manquant ou contre-indication active)\n'+
      '🔴  Mouvement principal indisponible, ou séance verrouillée derrière un bloc qualité\n\n'+
      'MISE EN FORME\n'+
      'Encadré doré  —  prioritaire selon le focus actuel\n'+
      'Titre barré  —  déjà réalisée cette semaine\n'+
      'Titre grisé  —  non ouvrable\n\n'+
      'À SAVOIR\n'+
      'Le priming (échauffement, mobilité, activation, primers) ne bloque jamais une séance : '+
      's\'il manque un élastique ou une corde, la séance reste faisable.'); }
  },'?'));
  el.appendChild(selectorCard);

  renderSessionCards(el, current);
  return el;
}

// Construit les cartes d'exercice de la séance sélectionnée, directement dans `el` (pas de page séparée).
function renderSessionCards(el, session){

  el.appendChild($('div',{class:'section-hdr'},'🏋️ '+session.nom));

  // ── Module WC : sélecteur de modalité (banque G1-G5 glyco / S1-S5 seuil) ───────────────
  if(session.id === 'wc_glyco' || session.id === 'wc_seuil'){
    try {
      const BANQUE = {
        wc_glyco: {
          titre:'Modalité glycolytique (banque G)',
          items:[
            ['G1','G1 sandbag','to-shoulder 40/40 ×4 + sled push A/R 40/40 ×4 + bear-hug carry 40/40 ×3'],
            ['G2','G2 barre/DB','thrusters 40/40 ×4 + row explosif 40/40 ×4 + push press 40/40 ×4'],
            ['G3','G3 KB/haut','swing lourd 30/30 ×4 + clean&press alterné 30/30 ×4 + snatch léger 30/30 ×4'],
            ['G4','G4 complexe KB','6 swings + 4 cleans + 2 press sans poser, 40s, D puis G ×5-6'],
            ['G5','G5 pneu/corde','pneu flip 30/60 ×5-6 + battle ropes 30/30 ×4 + frappe pneu masse (poignet G)'],
            ['G6','G6 conditioning','rounds 3min/1min combat : swings rapides 30/30 + shadow/sprawl + KB clean D + tronc au sol (⚠ IT band : pas de sprint/saut/pivot)'],
            ['G7','G7 complexe barre','12 soulevés + 9 cleans + 6 push press enchaînés (⚠ DL maîtrisé requis ; épaule/poignet G OK — sinon écarter)']
          ]
        },
        wc_seuil: {
          titre:'Modalité seuil (banque S)',
          items:[
            ['S1','S1 sled continu','push/drag continu 15-20 min A/R — idéal IT band, zéro impact'],
            ['S2','S2 portage+mannequin','circuit 15 min : sandbag carry 40m + traînage mannequin + farmer carry'],
            ['S3','S3 circuit KB','boucle 15-20 min : 10 swings → 5 goblet → 10 swings → 5 push press'],
            ['S4','S4 EMOM long','18-20 min : 10 swings + 5 pull-ups/TRX row / minute, reste en récup'],
            ['S5','S5 escaliers/gilet','15-20 min allure seuil sous gilet — ⚠ recoupe T1, ne pas doubler la semaine'],
            ['S6','S6 squat thrust (burpee allégé)','30s effort / 30s récup × 12-15 min. Burpee SANS pompe NI saut (down-up, recul de jambes) = zéro impact genou, poignet/épaule G ménagés. Rythme CONTRÔLÉ et régulier = seuil (153-166) ; si trop fort → bascule en glyco. Monte vraiment la FC (grande masse, pas de limite grip).'],
            ['S7','S7 portage/tenue (ex-carry+swing)','4 tours 90/90/90 carry 16/16 + swing — ⚠ N\'ATTEINT PAS le seuil (limité par le grip/avant-bras, FC reste sous SV1). WC de TENUE DE CHARGE/portage, pas seuil cardio. Zéro impact.']
          ]
        }
      };
      const conf = BANQUE[session.id];
      const K = 'wcmod_'+session.id;
      let choix; try{ choix = load(K) || conf.items[0][0]; }catch(_){ choix = conf.items[0][0]; }
      const setChoix=(v)=>{ try{ save(K,v); }catch(_){} render(); };
      const card=$('div',{class:'card'});
      card.appendChild($('div',{class:'card-title'},'⚙️ '+conf.titre));
      const row=$('div',{style:{display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'8px'}});
      conf.items.forEach(it=>{
        const on = (choix===it[0]);
        row.appendChild($('button',{
          style:{padding:'7px 11px',borderRadius:'7px',fontSize:'12px',cursor:'pointer',
            border:'1px solid '+(on?'#8b5cf6':'#334155'),background:on?'#8b5cf6':'#0d1525',
            color:on?'#fff':'#cbd5e1',fontWeight:on?'700':'500'},
          onclick:()=>setChoix(it[0])}, it[1]));
      });
      card.appendChild(row);
      const sel = conf.items.find(it=>it[0]===choix) || conf.items[0];
      card.appendChild($('div',{style:{marginTop:'2px',padding:'8px',background:'#0d2b1f',borderRadius:'7px',fontSize:'12px',color:'#6ee7b7',fontWeight:'600'}},
        '▶ '+sel[1]+' : '+sel[2]));
      // Encadré note éditable du jour (modif de format, charges, ressenti). Persistant par jour + séance.
      const noteKey = 'wcnote_'+session.id;
      let noteVal=''; try{ const lg=getLog(); noteVal=(lg[noteKey]!=null?lg[noteKey]:''); }catch(_){}
      const noteWrap=$('div',{style:{marginTop:'8px'}});
      noteWrap.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8',marginBottom:'4px'}},'📝 Détails du jour (charges, modif de format, ressenti)'));
      const ta=$('textarea',{class:'textarea-field',rows:'3',placeholder:'ex : G3 — swing 28kg 30/30 ×4, clean&press 20kg, épaule OK…',
        value: noteVal});
      ta.oninput=(e)=>{ try{ const lg=getLog(); lg[noteKey]=e.target.value; saveLog(lg); }catch(_){} };
      noteWrap.appendChild(ta);
      card.appendChild(noteWrap);
      el.appendChild(card);
      el.appendChild($('div',{class:'card',style:{fontSize:'11.5px',color:'#94a3b8'}}, session.objectif||''));

      let done=false; try{ done = moteurIsSessionDoneToday(session.id); }catch(_){}
      el.appendChild($('div',{class:'card',style:{cursor:'pointer',background:done?'#0d2b1f':undefined,borderColor:done?'#10b981':undefined},
        onclick:()=>{ try{ moteurToggleSessionDoneToday(session.id); }catch(_){ render(); } }},
        $('div',{class:'check-item',style:{cursor:'pointer'}},
          $('div',{class:'check-box'+(done?' done':'')}, done?'✓':''),
          $('div',{style:{fontWeight:700,fontSize:'13px'}},'Séance effectuée aujourd\'hui'))));
    } catch(err){
      el.appendChild($('div',{class:'card',style:{fontSize:'12px',color:'#f5a623'}},
        'WC : choix de modalité indisponible — '+(err&&err.message?err.message:'erreur')));
    }
    return;
  }

  // ── Module Z2 configurable : modalité → durée → format (→ bras si swing) ──────────────
  if(session.id === 'z2' || session.id === 'z2_long'){
    try {
      const K = 'z2cfg_' + session.id;
      let cfg;
      try { cfg = Object.assign({modalite:'velo',duree:20,fractionne:'continu',bras:2}, load(K)||{}); }
      catch(_) { cfg = {modalite:'velo',duree:20,fractionne:'continu',bras:2}; }
      const setCfg = (patch)=>{ Object.assign(cfg, patch); try{ save(K, cfg); }catch(_){} render(); };
      const chip = (label, on, onclick, dim)=> $('button', {
        style:{padding:'7px 11px',borderRadius:'7px',fontSize:'12px',cursor:'pointer',margin:'0',
          border:'1px solid '+(on?'#8b5cf6':'#334155'), background:on?'#8b5cf6':'#0d1525',
          color:on?'#ffffff':(dim?'#475569':'#cbd5e1'), fontWeight:on?'700':'500'},
        onclick:onclick }, label);
      const rowStyle = {display:'flex',flexWrap:'wrap',gap:'6px',marginBottom:'8px'};

      const card = $('div',{class:'card'});
      card.appendChild($('div',{class:'card-title'},'⚙️ Configurer la Z2'));

      card.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8',marginBottom:'4px'}},'Modalité'));
      const rM = $('div',{style:rowStyle});
      [['velo','🚴 Vélo',
            ['S8','S8 tirage de pneu (corde)','12-15 min de tirage CONTINU à la corde. ✅ SEULE MODALITÉ SEUIL VALIDÉE PAR LA MESURE (08/08 : franchit SV1, max 158 = 86% FCmax, montait encore à l\'arrêt). Engage une grande masse musculaire en continu → le cardio devient limitant, PAS le grip. Zéro impact. Si le pneu est lourd : allonger la corde et tirer plus lentement mais SANS PAUSE (la continuité prime sur la charge).']],['course','🏃 Course'],['corde','🪢 Corde'],['swing','🔔 Swing']]
        .forEach(o => rM.appendChild(chip(o[1], cfg.modalite===o[0], ()=>setCfg({modalite:o[0]}))));
      card.appendChild(rM);

      card.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8',marginBottom:'4px'}},'Durée (min)'));
      const rD = $('div',{style:rowStyle});
      (session.id==='z2_long'?[45,60,75,90]:[15,20,25,30,45])
        .forEach(d => rD.appendChild(chip(String(d), cfg.duree===d, ()=>setCfg({duree:d}))));
      card.appendChild(rD);

      card.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8',marginBottom:'4px'}},'Format'));
      const rF = $('div',{style:rowStyle});
      [['continu','Continu'],['30/30','30/30'],['40/20','40/20'],['4_1','4 marche/1 course'],['3_2','3 marche/2 course']]
        .forEach(o => {
          const courseOnly = (o[0]==='4_1'||o[0]==='3_2');
          rF.appendChild(chip(o[1], cfg.fractionne===o[0], ()=>setCfg({fractionne:o[0]}), courseOnly && cfg.modalite!=='course'));
        });
      card.appendChild(rF);

      if(cfg.modalite==='swing'){
        card.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8',marginBottom:'4px'}},'Bras'));
        const rB = $('div',{style:rowStyle});
        [[2,'2 bras'],[1,'1 bras alterné']].forEach(o => rB.appendChild(chip(o[1], cfg.bras===o[0], ()=>setCfg({bras:o[0]}))));
        card.appendChild(rB);
        if(cfg.bras===1) card.appendChild($('div',{style:{fontSize:'10px',color:'#f5a623',marginBottom:'4px'}},
          '⚠️ 1 bras : épaule G — 16 kg max, arrêt au moindre signal (pendant ou 48 h), état d\'épaule noté après.'));
      }

      const modLbl = {velo:'Vélo',course:'Course',corde:'Corde',swing:'Swing '+(cfg.bras===1?'1 bras':'2 bras')}[cfg.modalite]||cfg.modalite;
      const fracLbl = {continu:'continu','30/30':'30/30','40/20':'40/20','4_1':'4 marche/1 course','3_2':'3 marche/2 course'}[cfg.fractionne]||cfg.fractionne;
      card.appendChild($('div',{style:{marginTop:'6px',padding:'8px',background:'#0d2b1f',borderRadius:'7px',fontSize:'12px',color:'#6ee7b7',fontWeight:'600'}},
        '▶ '+modLbl+' · '+cfg.duree+' min · '+fracLbl+' — zone 130-150 bpm'));
      el.appendChild(card);

      el.appendChild($('div',{class:'card',style:{fontSize:'11.5px',color:'#94a3b8'}},
        session.objectif || 'Zone 2 — base aérobie, 130-150 bpm. Progression par la durée.'));

      let done=false; try{ done = moteurIsSessionDoneToday(session.id); }catch(_){}
      el.appendChild($('div',{class:'card',style:{cursor:'pointer',background:done?'#0d2b1f':undefined,borderColor:done?'#10b981':undefined},
        onclick:()=>{ try{ moteurToggleSessionDoneToday(session.id); }catch(_){ render(); } }},
        $('div',{class:'check-item',style:{cursor:'pointer'}},
          $('div',{class:'check-box'+(done?' done':'')}, done?'✓':''),
          $('div',{style:{fontWeight:700,fontSize:'13px'}},'Séance effectuée aujourd\'hui'))));
    } catch(err){
      el.appendChild($('div',{class:'card',style:{fontSize:'12px',color:'#f5a623'}},
        'Z2 : base aérobie, zone 130-150 bpm. (Module de configuration indisponible — '+ (err && err.message ? err.message : 'erreur') +')'));
    }
    return;
  }

  const res = moteurResolveSession(session);

  // Bandeau séance compressée — même détection que Guyane (sommeil/HRV/douleur), même présentation.
  try {
    const flags = computeFlags();
    const compFlag = flags.find(f=>f.compressed);
    if(compFlag){
      const guyaneKey = M_GUYANE_SESSION_KEY[session.id];
      const compData = COMPRESSED_MOTEUR[session.id] || (guyaneKey ? COMPRESSED_SESSIONS[guyaneKey] : null);
      const compRegle = COMPRESSED_REGLE[session.id] || null;
      const banner = $('div',{class:'card',style:{borderColor:'#e67e22',background:'#2a1f14'}});
      banner.appendChild($('div',{class:'card-title',style:{color:'#e67e22'}},'🗜️ '+compFlag.metric));
      banner.appendChild($('div',{style:{fontSize:'12px',color:'#c9a06a',marginBottom:'8px'}},
        compRegle || 'Signaux de récupération basse. Version allégée du jour — on coupe du VOLUME, on garde l\'INTENSITÉ :'));
      if(compData){
        const ul=$('div',{style:{fontSize:'13px',lineHeight:'1.7'}});
        compData.forEach(x=>ul.appendChild($('div',{},'• '+x)));
        banner.appendChild(ul);
      } else {
        banner.appendChild($('div',{style:{fontSize:'12px',color:'#8a94a6'}},'Réduis le VOLUME de ~40 % (moins de séries, accessoires coupés) et garde les patterns principaux. ⚠ NE PAS baisser l\'intensité du top set : c\'est le volume qui coûte de la récupération, l\'intensité qui tient les adaptations (programme §2 · manuel ch. 11).'));
      }
      banner.appendChild($('div',{style:{fontSize:'11px',color:'#8a94a6',marginTop:'8px',fontStyle:'italic'}},
        compRegle
          ? 'Faire au rabais coûterait plus que ça ne rapporte. Décider franchement, puis passer à autre chose.'
          : 'Ne saute pas la séance — allège-la. Le mouvement aide la récupération.'));
      el.appendChild(banner);
    }
  } catch(e){}

  // Priming minimaliste — même présentation qu'avant (une ligne compacte), pas de carte complète.
  const primingList = moteurFindGuyanePriming(session);
  // ── Encadré PRIMING : mobilité, activation et primers, construits depuis les créneaux du
  // moteur (source de vérité) et non plus depuis la seule liste Guyane — qui omettait les CARs
  // hors bloc 1, d'où leur disparition de l'écran. Ces éléments préparent, ils ne se loguent pas :
  // les garder hors des cartes d'exercice laisse la place au travail réel.
  const MINIMAL_ROLES = new Set(['cars_echauffement','mobilite_thoracique','activation_epaule',
    'priming_iso_militaire','primer_alactique','activation_fessier','activation_petersen','echauffement_general',
    'priming_jjb_sol','cars_echauffement_hanche']);
  const primingCard = $('div',{class:'card',style:{paddingTop:'9px',paddingBottom:'9px'}});
  primingCard.appendChild($('div',{style:{color:'#f5a623',fontWeight:700,fontSize:'10px',
    textTransform:'uppercase',letterSpacing:'.5px',marginBottom:'6px'}},'⚡ Priming — ne pas fatiguer'));
  let primingCount = 0;
  res.results.forEach(r=>{
    if(!MINIMAL_ROLES.has(r.slot.role) || !r.exId) return;
    const pex = M_EX_BY_ID[r.exId];
    const row = $('div',{style:{display:'flex',gap:'6px',alignItems:'baseline',padding:'3px 0'}});
    row.appendChild($('span',{style:{fontSize:'11.5px',color:'#e2e8f0',fontWeight:'600'}}, pex.name));
    if(r.slot.format_fixe) row.appendChild($('span',{style:{fontSize:'10.5px',color:'#94a3b8',flex:'1'}}, r.slot.format_fixe));
    if(!r.slot.obligatoire) row.appendChild($('span',{style:{fontSize:'9px',color:'#475569'}},'optionnel'));
    const pn = (r.slot.note||'') + (r.slot.note && pex.notes ? ' — ' : '') + (pex.notes||'');
    if(pn.trim()) row.appendChild($('button',{class:'info-btn',onclick:(e)=>{ e.stopPropagation(); showTooltip(e, pn); }},'?'));
    primingCard.appendChild(row); primingCount++;
  });
  // Éléments hérités de la structure Guyane non couverts par un créneau du moteur
  (primingList||[]).forEach(p=>{
    const plain = String(p).replace(/[⚡·]/g,'').toLowerCase();
    if(/\bcars?\b|hip car|thoracique|iso militaire|alactique|rotation ext|clamshell|petersen/.test(plain)) return; // déjà couverts par les créneaux du moteur
    primingCard.appendChild($('div',{style:{fontSize:'11px',color:'#94a3b8',padding:'3px 0'}}, p));
    primingCount++;
  });
  if(primingCount) el.appendChild(primingCard);

  res.results.forEach(r=>{
    const slot = r.slot;
    if(MINIMAL_ROLES.has(slot.role)) return; // couvert par la ligne de priming ci-dessus
    if(!r.exId){
      el.appendChild($('div',{class:'card',style:{borderColor:'#e63946'}},
        $('div',{style:{fontSize:'10px',textTransform:'uppercase',color:'#475569',letterSpacing:'.4px',marginBottom:'4px'}}, M_ROLE_LABEL[slot.role] || slot.role.replace(/_/g,' ')),
        $('div',{style:{fontSize:'13px',fontWeight:600,color:'#ff8087'}},'⚠ Indisponible — '+(r.blockedReason||''))
      ));
      return;
    }
    const ex = M_EX_BY_ID[r.exId];
    const proto = moteurProtocolFor(ex);
    const guyaneRef = moteurFindGuyaneRef(ex.id);
    const exKey = moteurExKey(ex.id) + (session && session.id ? '@'+session.id : '');
    const exLog = getLog()[exKey] || {sets:{}};
    // CHANTIER 49 (31/08) — PRIORITÉ INVERSÉE. La note héritée des fiches du SPLIT (plan abandonné le
    // 08/08) primait sur la note du catalogue : pour 30 exercices, la note maintenue était invisible et
    // c'est la vieille qui s'affichait — dont « Test officiel S9 · Objectif : 80 kg × 3 » sur le bench,
    // cible de juillet périmée depuis le 3RM à 91 kg du 08/08. Le catalogue est désormais la source ;
    // l'héritage ne sert plus que de filet quand le catalogue n'a rien, et il est alors ÉTIQUETÉ.
    const baseNote = ex.notes || ex.note || '';
    const legacyNote = (!baseNote && guyaneRef && guyaneRef.note)
      ? '↩ FICHE HÉRITÉE DU SPLIT (plan abandonné le 08/08) — repère technique conservé faute de note au '
        + 'catalogue. Ce n\'est pas une prescription courante : le créneau ci-dessus fait foi.\n' + guyaneRef.note
      : '';
    // La note de créneau passe dans l'infobulle "?" (comme les autres exercices) au lieu d'occuper
    // un pavé sous le titre : l'écran reste lisible, l'information reste accessible.
    const tooltipNote = [slot.note, baseNote, legacyNote].filter(Boolean).join('\n\n');

    const card = $('div',{class:'ex-card'});
    const hdr = $('div',{class:'ex-header'});
    hdr.appendChild($('span',{class:'ex-num'},'●'));
    hdr.appendChild($('span',{class:'ex-name'}, ex.name));
    // Sélecteur de variante hinge (DL conventionnel / trap bar / RDL) sur les créneaux hinge :
    // permet de choisir librement le mouvement pendant la phase d'apprentissage du deadlift.
    const SWAP_GROUPS = {
      hinge: { roles:new Set(['hinge_principal','test_hinge_dl','hinge_volume','hinge_lourd']),
               choices:[['rdl','RDL'],['trap_bar_deadlift','DL trap bar']] },
      // Zercher ET Front squat sont légitimes : Zercher pour le gainage antérieur, les longs tibias
      // (1m84) et le transfert MMA/terrain ; Front squat pour le standard RSA officiel. Choix libre.
      squat: { roles:new Set(['squat_bilateral','test_rsa_front_squat']),
               choices:[['zercher_squat','Zercher'],['front_squat','Front squat'],['presse_jambes_2j','Presse à jambes (2j)']] },
      // Gainage anti-extension : hardstyle plank (iso, plafonne) ↔ dragon flag (dynamique, plus dur —
      // ⚠ tension coude G : à réserver aux jours coude silencieux).
      gainage_ae: { roles:new Set(['gainage_finisher','anti_extension_finisher']),
               choices:[['hardstyle_plank','Hardstyle plank'],['dragon_flag','Dragon flag'],['hollow_hold','Hollow hold']] },
      // Anti-rotation (résister à la rotation — Pallof). NE PAS y mettre de twist : le twist est de la
      // rotation, qualité INVERSE. Créneau obligatoire, on garde l'anti-rotation.
      // Anti-rotation pur (Pallof). Pas d'autre vraie anti-rotation au catalogue → un seul choix, donc
      // pas de sélecteur affiché (le sélecteur n'apparaît qu'à partir de 2 options). Le créneau reste Pallof.
      anti_rotation: { roles:new Set(['anti_rotation']),
               choices:[['pallof_press','Pallof press'],['pallof_half_kneeling','Pallof half-kneeling'],['pallof_appui_decale','Pallof appui décalé']] },
      // Rotation (produire de la rotation, contrôlé). Défaut russian (sans matériel).
      rotation: { roles:new Set(['rotation_puissance']),
               choices:[['bridge_rotation','Bridge rotation'],['ghd_rotation','Rotation GHD'],['rotation_fente_elastique','Rotation fente bulgare'],['russian_twist','Russian twist'],['landmine_twist','Landmine twist'],['chop_lift_elastique','Chop/lift contrôlé']] },
      // Squat unilatéral genou-dominant : bulgarian (défaut) ou presse une jambe.
      unilat: { roles:new Set(['unilateral_genou']),
               choices:[['bulgarian_split_squat','Bulgarian'],['presse_une_jambe','Presse une jambe'],['presse_jambes_1j','Presse à jambes (1j, guidée)'],['split_squat_surelev','Split squat surélevé']] },
      // Rappel puissance (priming FB) : lancer/swing explosif au choix.
      rappel_puiss: { roles:new Set(['rappel_puissance']),
               choices:[['med_ball_horizontal','Lancer horizontal'],['med_ball_rotationnel','Lancer rotationnel'],['pseudo_lancer_rot_elastique','Pseudo lancer élastique'],['kb_swing_alactique_28','KB swing explosif'],['pompe_explosive','Pompe explosive']] },
      // Volume quadriceps BFR : air squat (défaut, global) ou leg extension (isolé).
      quad_bfr: { roles:new Set(['volume_quadriceps']),
               choices:[['air_squat_bfr','Air squat BFR'],['leg_extension_machine','Leg extension BFR']] },
      // Ischios / chaîne post. : TRX leg curl BFR (défaut), leg curl machine BFR, ou RDL 1 jambe (anti-asymétrie).
      ischios: { roles:new Set(['ischio_jambiers','finisher_bfr_jambes']),
               choices:[['trx_leg_curl','TRX leg curl BFR'],['leg_curl_machine','Leg curl machine BFR'],['nordic_curl','Nordic curl']] },
      // AGT rotation : versions explosives seulement (créneau alactique, frais).
      agt_rot: { roles:new Set(['agt_rotation']),
               choices:[['chop_lift_elastique','Chop/lift explosif'],['med_ball_rotationnel','Med ball rotationnel']] },
      // AGT vecteur vertical/horizontal : ALTERNER swing (hanche) et slam (tronc) — visible directement, pas caché en note.
      agt_vecteur: { roles:new Set(['agt_puissance']),
               choices:[['kb_swing_alactique_28','KB swing — 1 sem/2'],['med_ball_slam','Slam — 1 sem/2']] }
    };
    for(const gk in SWAP_GROUPS){
      const grp = SWAP_GROUPS[gk];
      if(!grp.roles.has(slot.role)) continue;
      const _equip = moteurEquipment();
      const choices = grp.choices.filter(c => {
        const ex = M_EX_BY_ID[c[0]];
        if(!ex) return false;
        // masquer une option si son matériel requis n'est pas disponible
        const req = ex.equipment_required || [];
        return req.every(r => _equip.includes(r));
      });
      if(choices.length < 2) continue;
      const swapKey = gk+'_swap@'+(session&&session.id?session.id:'')+'@'+slot.role;
      const sel = $('select',{class:'input-mod',style:{fontSize:'10px',padding:'2px 4px',marginLeft:'6px'},
        onchange:(e)=>{ const l=getLog(); l._swaps=l._swaps||{}; l._swaps[swapKey]=e.target.value; saveLog(l); render(); }
      });
      choices.forEach(c=>{
        const opt=$('option',{value:c[0]}, c[1]);
        if(c[0]===ex.id) opt.selected=true;
        sel.appendChild(opt);
      });
      hdr.appendChild(sel);
    }
    if(r.substituted) hdr.appendChild($('span',{class:'tag tag-purple',style:{fontSize:'9px'}},
      r.viaContraindication?'substitué · contre-indication':(r.viaPattern?'même pattern':'substitué')));
    if(tooltipNote) hdr.appendChild($('button',{class:'info-btn',onclick:(e)=>{ e.stopPropagation(); showTooltip(e, tooltipNote); }},'?'));
    card.appendChild(hdr);
    card.appendChild($('div',{style:{fontSize:'9.5px',textTransform:'uppercase',color:'#475569',letterSpacing:'.4px',marginTop:'-4px',marginBottom:'6px'}},
      (M_ROLE_LABEL[slot.role] || slot.role.replace(/_/g,' '))+(slot.obligatoire?'':' (optionnel)')));
    if(r.substituted && r.from) card.appendChild($('div',{style:{fontSize:'10.5px',color:'#64748b',marginBottom:'4px'}},'Remplace : '+(M_EX_BY_ID_NAME[r.from]||r.from)));
    if(slot.role==='agt_puissance') card.appendChild($('div',{style:{fontSize:'10.5px',color:'#f5a623',fontWeight:'700',marginBottom:'4px'}},'⇄ Alterne avec le slam/swing — 1 semaine sur 2'));


    // Grid infos (format / repos / tempo / RPE cible) — priorité: protocole de cycle > format standard Guyane
    // format_fixe / rpe_fixe : verrou au niveau du slot — prime sur tout protocole de cycle
    // (ex. le RDL volume de Bas 2 reste 3-4×6 même en focus Force, le top set vit en Bas 1).
    // CHANTIER 49 (31/08) — SOURCE UNIQUE. Le repli « fiches du split » est SUPPRIMÉ de ces trois champs :
    // la valeur y était attachée à l'EXERCICE et non au CRÉNEAU, si bien qu'un mouvement ayant changé de
    // rôle traînait le repos de son ancien créneau — Zercher (volume de Bas 2 → TOP SET de FB1) affichait
    // 2 min, RDL (volume → HINGE LOURD de FB2) 2-3 min : les deux séries les plus lourdes de la semaine
    // étaient sous-récupérées à l'écran. Les 75 valeurs concernées ont été portées dans les créneaux
    // (templates v1.3), corrigées là où elles contredisaient le programme.
    const format = slot.format_fixe ? slot.format_fixe : (proto ? proto.format : moteurDefaultFormat(ex));
    const rpeCible = slot.rpe_fixe ? slot.rpe_fixe : (proto ? proto.rpe : (moteurDefaultRpe(ex) || null));
    const tempoSource = (slot.note||'') + ' ' + (baseNote||'') + ' ' + (format||'');
    const tempoMatch = tempoSource.match(/[Tt]empo\s+([0-9X]-[0-9X]-[0-9X]-[0-9X])/);
    const grid = $('div',{class:'ex-grid'});
    grid.appendChild($('div',{class:'ex-cell'},
      $('div',{class:'ex-cell-lbl'},'Format'),
      $('div',{class:'ex-cell-val purple'}, format || '—')
    ));
    const NO_REPOS_CATEGORIES = new Set(['cars_mobilite','respiration','test']);
    // Le repos défini sur le CRÉNEAU prime sur l'ancienne référence héritée : sinon le bench de
    // Haut 3 (volume) héritait des 5 min du bench lourd de Haut 2.
    const reposSrc = slot.repos ? slot.repos : null;
    const rTimers = reposSrc ? parseReposAll(reposSrc) : [{sec:120,lbl:'2 min'}];
    if(!NO_REPOS_CATEGORIES.has(ex.category)){
      const reposCell = $('div',{class:'ex-cell'});
      reposCell.appendChild($('div',{class:'ex-cell-lbl'},'Repos'));
      if(rTimers.length){
        const btnWrap = $('div',{class:'timer-btns'});
        rTimers.forEach(t=>btnWrap.appendChild($('button',{class:'timer-btn',onclick:(e)=>{ e.stopPropagation(); startTimer(t.sec, ex.name); }},'⏱ '+t.lbl)));
        reposCell.appendChild(btnWrap);
      } else {
        reposCell.appendChild($('div',{class:'ex-cell-val red'}, reposSrc || '2 min'));
      }
      grid.appendChild(reposCell);
    }
    if(tempoMatch) grid.appendChild($('div',{class:'ex-cell'},
      $('div',{class:'ex-cell-lbl'},'Tempo'),
      $('div',{class:'ex-cell-val teal'}, tempoMatch[1])
    ));
    if(rpeCible) grid.appendChild($('div',{class:'ex-cell'},
      $('div',{class:'ex-cell-lbl'},'RPE cible'),
      $('div',{class:'ex-cell-val gold'}, rpeCible)
    ));
    card.appendChild(grid);
    // CHANTIER 54 (31/08) — format_fixe prime sur le protocole de cycle (c'est voulu : le créneau décide
    // du format). Effet de bord : en semaine de DÉLOAD, le protocole renvoyait « volume −50 % » et il
    // était écrasé par le format du créneau — la carte affichait donc le volume plein d'une semaine
    // normale, alors que le bandeau de séance annonçait un déload. Le déload est le 09-15/09 : on ne peut
    // pas laisser la couche qui pilote la séance réelle contredire la vague. La règle est donc AJOUTÉE
    // sous la grille au lieu de disparaître.
    if(proto && proto.phase === 'deload'){
      card.appendChild($('div',{style:{fontSize:'10.5px',color:'#7dd3fc',fontWeight:'700',margin:'4px 0 2px'}},
        M_FORCE_TOPSET.has(ex.id)
          ? "🌙 DÉLOAD — top set MAINTENU à son RPE, aucun back-off : c'est le volume qui part, pas l'intensité."
          : '🌙 DÉLOAD — séries de travail ÷2, charge et technique INCHANGÉES. Sautent en premier : WC glyco, BFR, volume accessoire.'));
    }

    // ── Rampe d'approche calculée (top set à la barre uniquement) ──
    if(ex.progression_type === 'barre' && M_FORCE_TOPSET.has(ex.id) && /top set/i.test(format||'') && !/jamais|pas de|sans/i.test(format||'')){
      const cible = (exLog.charge != null ? exLog.charge : moteurGetCharge(ex.id));
      const rampe = moteurRampeTopSet(cible);
      if(rampe){
        const box = $('div',{style:{background:'#0d1525',borderRadius:'7px',padding:'8px',marginBottom:'8px'}});
        box.appendChild($('div',{style:{fontSize:'10px',color:'#64748b',marginBottom:'6px'}},
          'Montée en charge — approches non fatigantes (ne pas chercher la fatigue avant le top set) :'));
        const line = $('div',{style:{display:'flex',flexWrap:'wrap',gap:'5px'}});
        rampe.forEach(s=>{
          line.appendChild($('div',{style:{padding:'4px 7px',borderRadius:'5px',fontSize:'10.5px',
            background: s.top ? '#8b5cf6' : '#1e293b', color: s.top ? '#fff' : '#cbd5e1',
            fontWeight: s.top ? '700' : '500'}},
            s.kg + ' ' + s.reps));
        });
        box.appendChild(line);
        box.appendChild($('div',{style:{fontSize:'9.5px',color:'#475569',marginTop:'5px'}},
          'Top set ×3 @RIR 1 = triple lourd du jour, PAS un 3RM (le vrai 3RM est réservé aux jours de test). Repos 2-3 min avant le top set.'));
        card.appendChild(box);
      }
    }

    if(ex.progression_type !== 'aucun'){
      // Repère "dernière fois" si l'exercice n'a pas été refait depuis un moment
      const pastLog = moteurLastPastLog(ex.id);
      if(pastLog && !exLog.charge){
        const daysAgo = moteurDaysAgo(pastLog.date);
        const [y,mo,da] = pastLog.date.split('-');
        card.appendChild($('div',{style:{fontSize:'10.5px',color:'#f5a623',marginBottom:'6px'}},
          '📌 Dernière fois : '+pastLog.entry.charge+' '+moteurGetChargeUnit(ex.id)+
          (pastLog.entry.rpe?' · RPE '+pastLog.entry.rpe:'')+' — le '+da+'/'+mo+'/'+y+' (il y a '+daysAgo+' j)'));
      }

      // Charge + RPE réel (mêmes champs que le reste de l'app — pas de doublon RIR)
      const unit = moteurGetChargeUnit(ex.id);
      const seedOrLast = moteurGetCharge(ex.id);
      const chargeRow = $('div',{style:{display:'flex',alignItems:'center',gap:'5px',marginBottom:'8px',background:'#0d1525',borderRadius:'7px',padding:'6px 7px',flexWrap:'nowrap'}});
      if(ex.progression_type !== 'isometrie'){
        chargeRow.appendChild($('span',{style:{fontSize:'10px',color:'#475569'}}, unit));
        chargeRow.appendChild($('input',{class:'input-mod',type:'number',step:'0.5',style:{width:'56px'},
          value: exLog.charge!=null?exLog.charge:'', placeholder: seedOrLast!=null?String(seedOrLast):'—',
          oninput:(e)=>{ moteurSetTodayField(ex.id,'charge', e.target.value===''?null:Number(e.target.value), session&&session.id); moteurSetTodayField(ex.id,'fmt', format||'', session&&session.id); },
          onchange:(e)=>{ moteurSetTodayField(ex.id,'charge', e.target.value===''?null:Number(e.target.value), session&&session.id); moteurSetTodayField(ex.id,'fmt', format||'', session&&session.id); render(); }
        }));
      }
      // Champ Reps éditable — utile pour les mouvements en apprentissage (DL, front squat) où
      // le nombre de reps par série varie volontairement pendant l'acquisition technique.
      chargeRow.appendChild($('span',{style:{fontSize:'10px',color:'#475569'}},'reps'));
      chargeRow.appendChild($('input',{class:'input-mod',type:'number',min:'1',max:'30',step:'1',
        value: exLog.reps!=null?exLog.reps:'', placeholder:'—', style:{width:'52px'},
        oninput:(e)=>{ moteurSetTodayField(ex.id,'reps', e.target.value===''?null:Number(e.target.value), session&&session.id); },
        onchange:(e)=>{ moteurSetTodayField(ex.id,'reps', e.target.value===''?null:Number(e.target.value), session&&session.id); render(); }
      }));
      chargeRow.appendChild($('span',{style:{fontSize:'10px',color:'#475569'}},'RPE'));
      chargeRow.appendChild($('input',{class:'input-mod',type:'number',min:'1',max:'10',style:{width:'46px'},
        value: exLog.rpe||'', placeholder:'—',
        oninput:(e)=>{ moteurSetTodayField(ex.id,'rpe', e.target.value, session&&session.id); moteurSetTodayField(ex.id,'fmt', format||'', session&&session.id); },
        onchange:(e)=>{ moteurSetTodayField(ex.id,'rpe', e.target.value, session&&session.id); moteurSetTodayField(ex.id,'fmt', format||'', session&&session.id); render(); }
      }));
      card.appendChild(chargeRow);

      const sugg = moteurProgressionSuggestion(ex.id);
      if(sugg){
        const suggRow = $('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'8px',flexWrap:'wrap'}},
          $('span',{style:{fontSize:'10.5px',color:'#3b82f6'}},'→ '+sugg.text)
        );
        if(ex.progression_type === 'barre'){
          suggRow.appendChild($('button',{class:'btn btn-ghost btn-sm',style:{fontSize:'9.5px',padding:'3px 8px'},
            onclick:()=>moteurApplyProgression(ex.id, session&&session.id)},'Appliquer'));
        }
        card.appendChild(suggRow);
      }
    }

    // Sets à cocher
    card.appendChild($('div',{style:{fontSize:'10px',color:'#475569',marginBottom:'5px',fontWeight:'600',textTransform:'uppercase',letterSpacing:'.4px'}},'Séries effectuées:'));
    const setsRow = $('div',{class:'sets-row'});
    const extraSets = (exLog.sets_extra || 0);
    const maxSets = Math.max(2, Math.min(9, moteurNbSeries(format) + extraSets));
    for(let s=1; s<=maxSets; s++){
      const isDone = exLog.sets && exLog.sets[s];
      setsRow.appendChild($('div',{
        class:'set-chip'+(isDone?' done':''),
        onclick:()=>{
          const l = getLog(); const e2 = l[exKey] || {sets:{}};
          e2.sets = e2.sets || {};
          const wasDone = e2.sets[s];
          e2.sets[s] = !wasDone;
          l[exKey] = e2; saveLog(l); render();
          if(!wasDone && rTimers.length>0){
            setTimeout(()=>startTimer(rTimers[0].sec, ex.name), 500);
          }
        }
      }, isDone?'✓':' ', 'Set '+s));
    }
    setsRow.appendChild($('div',{class:'set-chip',style:{opacity:'0.55',fontWeight:'700'},
      onclick:()=>{ const l=getLog(); const e2=l[exKey]||{sets:{}};
        e2.sets_extra=(e2.sets_extra||0)+1; l[exKey]=e2; saveLog(l); render(); }
    },'+','Série'));
    if(extraSets > 0){
      setsRow.appendChild($('div',{class:'set-chip',style:{opacity:'0.4'},
        onclick:()=>{ const l=getLog(); const e2=l[exKey]||{sets:{}};
          e2.sets_extra=Math.max(0,(e2.sets_extra||0)-1);
          if(e2.sets) delete e2.sets[maxSets];
          l[exKey]=e2; saveLog(l); render(); }
      },'\u2212','Série'));
    }
    card.appendChild(setsRow);

    // Notes perso
    const notesEl = $('textarea',{class:'textarea-field',rows:'2',placeholder:'Notes perso (optionnel)…',style:{fontSize:'11px'}});
    notesEl.value = exLog.notes||'';
    notesEl.oninput = (e)=>moteurSetTodayField(ex.id,'notes', e.target.value, session&&session.id);
    card.appendChild(notesEl);

    el.appendChild(card);
  });

  const isDoneToday = moteurIsSessionDoneToday(session.id);
  el.appendChild($('div',{class:'card',style:{cursor:'pointer',background: isDoneToday?'#0d2b1f':undefined,borderColor: isDoneToday?'#10b981':undefined},
    onclick:()=>moteurToggleSessionDoneToday(session.id)
  },
    $('div',{class:'check-item',style:{cursor:'pointer'}},
      $('div',{class:'check-box'+(isDoneToday?' done':'')}, isDoneToday?'✓':''),
      $('div',{style:{fontWeight:700,fontSize:'13px'}},'Séance effectuée aujourd\'hui')
    )
  ));
}

      $('button',{style:{background:'none',border:'none',color:'#64748b',fontSize:'20px',cursor:'pointer',padding:'0 2px',lineHeight:'1'},
        onclick:()=>{if(S.week>1){S.week--;S.bloc=getBlocId(S.week);render();}}
      },'‹'),

      $('button',{style:{background:'none',border:'none',color:'#64748b',fontSize:'20px',cursor:'pointer',padding:'0 2px',lineHeight:'1'},
        onclick:()=>{if(S.week<9){S.week++;S.bloc=getBlocId(S.week);render();}}
      },'›'),
      $('button',{style:{background:'none',border:'1px solid #1e2d42',color:'#3b82f6',fontSize:'10px',cursor:'pointer',padding:'2px 6px',borderRadius:'6px',marginLeft:'2px'},
        onclick:()=>{const d=Math.floor((today-new Date('2026-06-09'))/(7*24*3600*1000));S.week=Math.max(1,Math.min(9,d+1));S.bloc=getBlocId(S.week);render();}
      },'\u21a9')

        ));
      }
    }
    grid.appendChild($('div',{class:'ex-cell'},
      $('div',{class:'ex-cell-lbl'},'RPE exercice'),
      $('div',{class:'ex-cell-val gold'},ex.rpe),
    ));
    if(ex.dl&&ex.dl!=='—'&&ex.dl!=='-')

        $('div',{class:'ex-cell-val grey',style:{color:'#475569'}},ex.dl),
      ));
    card.appendChild(grid);

    // Semaines progression
    const semRow = $('div',{class:'ex-semaines'});
    [{lbl:semLabels[0],val:ex.s1},{lbl:semLabels[1],val:ex.s2},{lbl:semLabels[2],val:ex.s3},{lbl:semLabels[3],val:ex.dl}].filter(s=>s.val&&s.val!=='—'&&s.val!=='-').forEach((s,si)=>{
      const isActive = (si+1)===semInBloc;
      const semEl = $('div',{class:'ex-sem'+(isActive?' active':'')},
        $('div',{class:'ex-sem-lbl'},s.lbl),
        $('div',{class:'ex-sem-val',style:{color:isActive?'#3b82f6':'#94a3b8'}},s.val||'—'),
      );
      semRow.appendChild(semEl);
    });
    card.appendChild(semRow);

    // Charge modifiable
    const chargeRow = $('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px',background:'#0d1525',borderRadius:'7px',padding:'7px 8px'}});
    chargeRow.appendChild($('span',{style:{fontSize:'11px',color:'#475569'}},'Top set (kg):'));
    const chargeInput = $('input',{
      class:'input-mod',type:'text',
      placeholder: [ex.s1,ex.s2,ex.s3][Math.min(semInBloc-1,2)]||'—',
      value: exLog.charge||'',
      oninput:(e)=>{ exLog.charge=e.target.value; exLog.fmt=ex.fmt||''; log[exKey]=exLog; saveLog(log); }
    });
    chargeRow.appendChild(chargeInput);
    chargeRow.appendChild($('span',{style:{fontSize:'10px',color:'#475569'}},'RPE'));
    const rpeInput = $('input',{
      class:'input-mod',type:'number',min:'1',max:'10',
      placeholder:'—',
      value: exLog.rpe||'',
      oninput:(e)=>{ exLog.rpe=e.target.value; exLog.fmt=ex.fmt||''; log[exKey]=exLog; saveLog(log); }
    });
    chargeRow.appendChild(rpeInput);
    card.appendChild(chargeRow);

    // Sets à cocher
    card.appendChild($('div',{style:{fontSize:'10px',color:'#475569',marginBottom:'5px',fontWeight:'600',textTransform:'uppercase',letterSpacing:'.4px'}},'Séries effectuées:'));
    const setsRow = $('div',{class:'sets-row'});
    const maxSets = Math.max(2, Math.min(10, setsCount));
    for(let s=1; s<=maxSets; s++){
      const isDone = exLog.sets[s];
      const chip = $('div',{
        class:'set-chip'+(isDone?' done':''),
        onclick:()=>{
          const wasDone=exLog.sets[s];
          exLog.sets[s]=!exLog.sets[s];
          log[exKey]=exLog; saveLog(log);
          render(); // Update chip visually first
          if(!wasDone&&rTimers.length>0){
            const doneN=Object.values(exLog.sets).filter(Boolean).length;
            const timerCtxObj={name:cleanExName,fmt:ex.fmt,charge:weekVal&&weekVal!=='—'?weekVal:null,setNum:doneN,totalSets:setsCount,tempo:tempoMatchEx?tempoMatchEx[1]:null};
            setTimeout(()=>startTimer(rTimers[0].sec,timerCtxObj), 500);
          }
        }
      }, isDone?'✓':' ', `Set ${s}`);
      setsRow.appendChild(chip);
    }
    card.appendChild(setsRow);

    // Notes perso
    const notesEl = $('textarea',{
      class:'textarea-field',rows:'2',
      placeholder:'Notes perso (optionnel)…',
      style:{fontSize:'11px'},
    });
    notesEl.value = exLog.notes||'';
    notesEl.oninput = (e)=>{ exLog.notes=e.target.value; log[exKey]=exLog; saveLog(log); };
    card.appendChild(notesEl);

    el.appendChild(card);
  });

  // Récup respiratoire post-effort — conditioning only
  if(S.seanceKey==='Conditioning'){
  const recupCard = $('div',{class:'card'},
    $('div',{class:'card-title',style:{color:'#06b6d4'}},'🌬️ Récupération Respiratoire Post-Effort'),
    $('div',{style:{fontSize:'12px',color:'#64748b',lineHeight:'1.6'}},
      '1. Expire lente 6s bouche ouverte (vider CO₂)\n'+
      '2. 4-7-8 × 3: inhale nasal 4s → hold 7s → exhale bouche 8s\n'+
      '3. Sigh physiologique × 2: double inhale nasal court+long → exhale complète\n'+
      '4. Chrono: noter temps jusqu\'à FC <130 bpm'

        value:(log.recupTime||''),
        oninput:(e)=>{ updateLog('recupTime',e.target.value); }
      })
    )

  el.appendChild(recupCard);
  } // end conditioning only

  return el;
}

function renderGTG(){
  const log = getLog();
  const gtgLog = log.gtg || {};
  const el = $('div',{});
  
  el.appendChild($('div',{class:'section-hdr'},'🔁 GTG — Grease The Groove'));
  el.appendChild($('div',{class:'card',style:{background:'#0d1a0d',borderColor:'#10b98133'}},
    $('div',{style:{fontSize:'12px',color:'#10b981',lineHeight:'1.5'}},
      '★ Jamais à l\'échec · Jamais fatigué · 50-80% du max · 3-4× par jour\n'+
      'Espacer les passages de 30min minimum · GTG quotidien = ↑↑ progression'
    )
  ));

  GTG_EXERCICES.forEach(ex=>{
    const exLog = gtgLog[ex.id] || {passages:[]};
    const card = $('div',{class:'card'});

    card.appendChild($('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'8px'}},
      $('span',{style:{fontSize:'20px'}},ex.icon),
      $('div',{style:{flex:1}},
        $('div',{style:{fontWeight:'700',fontSize:'13px',color:'var(--text)'}},ex.name),
        $('div',{style:{fontSize:'11px',color:'#64748b'}},ex.reps+' · '+ex.charge+' · RPE '+ex.rpe+' · '+ex.freq),
      ),
      $('button',{class:'info-btn',onclick:(e)=>showTooltip(e,ex.note)},'?')
    ));

    // Passages de la journée
    card.appendChild($('div',{style:{fontSize:'10px',color:'#475569',fontWeight:'600',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:'6px'}},'Passages aujourd\'hui:'));
    const passRow = $('div',{class:'sets-row'});
    for(let p=1;p<=4;p++){
      const done = exLog.passages.includes(p);
      const chip = $('div',{
        class:'set-chip'+(done?' done':''),
        onclick:()=>{
          const l=getLog(); const g=l.gtg||{};
          const el_=(g[ex.id]||{passages:[]});
          const idx=el_.passages.indexOf(p);
          if(idx>-1) el_.passages.splice(idx,1); else el_.passages.push(p);
          g[ex.id]=el_; l.gtg=g; saveLog(l); render();
        }
      }, done?'✓':'○', ` ${p}e passage`);
      passRow.appendChild(chip);
    }
    card.appendChild(passRow);

    // Note rapide
    const noteInput = $('input',{
      class:'input-field',type:'text',
      placeholder:'Note rapide…',
      style:{marginTop:'8px',fontSize:'12px',padding:'7px 10px'},
      value:exLog.note||'',
      oninput:(e)=>{
        const l=getLog(); const g=l.gtg||{};
        const ex_=(g[ex.id]||{passages:[]});
        ex_.note=e.target.value; g[ex.id]=ex_; l.gtg=g; saveLog(l);
      }
    });
    card.appendChild(noteInput);

    el.appendChild(card);
  });

  return el;
}

    const delestSel = $('select',{class:'input-field',onchange:(e)=>{ MS.delestageEpauleTier=Number(e.target.value); saveMoteurState(); }});

        const gc=$('div',{class:'card'}); gc.appendChild($('div',{style:{fontWeight:'700',marginBottom:'6px'}},'🔁 GTG du jour'));
        let any=false;
        Object.keys(entry.gtg).forEach(gid=>{
          const p=entry.gtg[gid]; const nb=(p&&p.passages)?p.passages.length:0;
          if(nb>0){ any=true; gc.appendChild($('div',{style:{display:'flex',justifyContent:'space-between',fontSize:'12px',padding:'2px 0'}},$('span',{style:{color:'#64748b'}},gtgNames[gid]||gid),$('span',{style:{fontWeight:'600'}},nb+' passage'+(nb>1?'s':'')))); }
        });
        if(any) el.appendChild(gc);
      }
      // Routine / Renfo / Mobilité / Respiration faits ce jour-là
      if(entry.routine && entry.routine.length){
        const rc=$('div',{class:'card'}); rc.appendChild($('div',{style:{fontWeight:'700',marginBottom:'6px'}},'🧘 Routine du jour'));
        // Grouper par catégorie via ROUTINE_MATIN
        const byCat={};
        entry.routine.forEach(rid=>{
          const item=ROUTINE_MATIN.find(x=>x.id===rid);
          if(item){ const cat=item.cat.indexOf('CARs')>=0?'Mobilité (CARs)':item.cat.indexOf('Respir')>=0?'Respiration':item.cat.indexOf('Renfo')>=0?'Renfo':item.cat.indexOf('Unipodal')>=0?'Équilibre':item.cat; (byCat[cat]=byCat[cat]||[]).push(item.name); }
        });
        Object.keys(byCat).forEach(cat=>{
          rc.appendChild($('div',{style:{fontSize:'11px',color:'#06b6d4',fontWeight:'600',marginTop:'4px'}},cat));
          rc.appendChild($('div',{style:{fontSize:'12px',color:'#94a3b8',marginLeft:'6px',lineHeight:'1.4'}},byCat[cat].join(' · ')));
        });
        el.appendChild(rc);
      }
      return el;
    }
    const log2=getLog();
    
    el.appendChild($('div',{class:'card'},
      $('div',{class:'card-title'},'💭 Ressenti général'),
      $('textarea',{class:'textarea-field',rows:'3',style:{width:'100%',boxSizing:'border-box'},placeholder:'Comment je me suis senti aujourd\'hui…',
        value:log2.journal_ressenti||'',
        oninput:(e)=>{ log2.journal_ressenti=e.target.value; saveLog(log2); }
      })
    ));
    el.appendChild($('div',{class:'card'},
      $('div',{class:'card-title'},'✅ Ce qui a bien marché'),
      $('textarea',{class:'textarea-field',rows:'2',style:{width:'100%',boxSizing:'border-box'},placeholder:'Points positifs, PR, sensations…',
        value:log2.journal_positif||'',
        oninput:(e)=>{ log2.journal_positif=e.target.value; saveLog(log2); }
      })
    ));
    el.appendChild($('div',{class:'card'},
      $('div',{class:'card-title'},'🔧 À améliorer'),
      $('textarea',{class:'textarea-field',rows:'2',style:{width:'100%',boxSizing:'border-box'},placeholder:'Technique, récup, nutrition, sommeil…',
        value:log2.journal_ameliorer||'',
        oninput:(e)=>{ log2.journal_ameliorer=e.target.value; saveLog(log2); }
      })
    ));
    // (Historique compact retiré — le Calendrier remplit déjà ce rôle. Le détail d'une journée
    // reste accessible en cliquant une case du Calendrier, qui pose le même état ci-dessus.)
  }
    // ── État hors ligne + Sync (en bas du journal) ──
    // ── Diagnostic hors ligne (SW + cache) ──
    const diagCard = $('div',{class:'card',style:{background:'#0d1b2a'}});
    diagCard.appendChild($('div',{style:{fontWeight:'700',marginBottom:'6px',color:'#fff'}},'📡 État hors ligne'));
    const diagBody = $('div',{style:{fontSize:'12px',color:'#e0e1dd',lineHeight:'1.6'}},'Appuie sur Vérifier…');
    diagCard.appendChild(diagBody);
    diagCard.appendChild($('button',{class:'btn-back',style:{marginTop:'8px',background:'#3a86ff'},
      onclick:async()=>{
        let lines=[];
        lines.push('Service Worker : '+(window.__swStatus||'?'));
        if('serviceWorker' in navigator){
          const reg=await navigator.serviceWorker.getRegistration();
          lines.push('Enregistrement : '+(reg?'oui':'NON'));
          lines.push('Contrôle la page : '+(navigator.serviceWorker.controller?'oui ✓':'NON ✗'));
        } else { lines.push('serviceWorker non supporté par ce navigateur'); }
        if('caches' in window){
          try{
            const keys=await caches.keys();
            lines.push('Caches : '+(keys.join(', ')||'aucun'));
            if(keys.length){
              const cache=await caches.open(keys[0]);
              const reqs=await cache.keys();
              lines.push('Fichiers en cache : '+reqs.length);
              lines.push(reqs.map(r=>r.url.split('/').pop()||'/').join(', '));
            }
          }catch(e){ lines.push('Erreur cache : '+e.message); }
        } else { lines.push('caches API non supportée'); }
        diagBody.innerHTML = lines.map(l=>'• '+l).join('<br>');
      }
    },'Vérifier l\'état hors ligne'));
    el.appendChild(diagCard);

    // ── Sync Firebase (déplacé depuis GTG) ──
    // Firebase sync status
    const fbOk=!!(db&&_uid);
    const fbBg=fbOk?'#E1F5EE':'#FEF3C7'; const fbCol=fbOk?'#085041':'#92400E';
    const fbCard=$('div',{style:{background:fbBg,borderRadius:'8px',padding:'10px 12px',marginBottom:'10px'}});
    fbCard.appendChild($('div',{style:{fontWeight:'600',fontSize:'12px',color:fbCol,marginBottom:'4px'}},
      fbOk?'✓ Firebase connecté — données synchronisées':'⚠ Firebase hors ligne — données locales'));
    // Sync ID display + copy button
    const uidRow=$('div',{style:{display:'flex',gap:'6px',alignItems:'center',marginBottom:'6px'}});
    const uidInput=$('input',{type:'text',value:_uid||'',readOnly:true,
      style:{flex:'1',fontSize:'9px',padding:'4px 6px',borderRadius:'5px',border:'1px solid #cbd5e1',background:'white',color:'#334155',fontFamily:'monospace'}});
    const copyBtn=$('button',{style:{padding:'4px 8px',borderRadius:'5px',background:'#1D9E75',color:'white',fontSize:'10px',border:'none',cursor:'pointer',whiteSpace:'nowrap'},
      onclick:()=>{ navigator.clipboard.writeText(_uid||'').then(()=>{ copyBtn.textContent='✓ Copié'; setTimeout(()=>{ copyBtn.textContent='Copier'; },1500); }); }
    },'Copier');
    uidRow.appendChild(uidInput); uidRow.appendChild(copyBtn);
    fbCard.appendChild(uidRow);
    // Paste ID from other device
    const pasteRow=$('div',{style:{display:'flex',gap:'6px',alignItems:'center'}});
    const pasteInput=$('input',{type:'text',placeholder:'Coller l\'ID de l\'autre appareil…',
      style:{flex:'1',fontSize:'9px',padding:'4px 6px',borderRadius:'5px',border:'1px solid #cbd5e1',background:'white',color:'#334155',fontFamily:'monospace'}});
    const applyBtn=$('button',{style:{padding:'4px 8px',borderRadius:'5px',background:'#3B82F6',color:'white',fontSize:'10px',border:'none',cursor:'pointer',whiteSpace:'nowrap'},
      onclick:()=>{
        const v=pasteInput.value.trim();
        if(v.length>4){ localStorage.setItem('be_ready_uid',v); _uid=v; applyBtn.textContent='✓ OK'; setTimeout(()=>location.reload(),800); }
      }
    },'Appliquer');
    pasteRow.appendChild(pasteInput); pasteRow.appendChild(applyBtn);
    fbCard.appendChild(pasteRow);
    el.appendChild(fbCard);


  return el;
}

// ── ONGLET 5 — JOURNAL ───────────────────────────────────────────────────


function exportCSV(){
  const keys=Object.keys(localStorage).filter(k=>k.startsWith('log:')).sort();
  if(!keys.length){alert('Aucun log à exporter.');return;}
  const H=['Date','Énergie','Motivation','Douleur','HRV','BOLT','Sommeil_h','Qualité_sommeil','Séance','RPE','Humeur','Notes_matin','Ressenti','Positif','À_améliorer'];
  const esc=v=>('"'+(v||'').toString().replace(/"/g,'""')+'"');
  const rows=[H.map(esc).join(',')];
  keys.forEach(k=>{
    try{
      const d=JSON.parse(localStorage.getItem(k));
      const m=d.matin||{};const s=d.soir||{};
      rows.push([k.slice(4),m.energie,m.motivation,m.douleur,m.hrv,m.bolt,m.sleep_hours,m.sleep_quality,
        s.seance,s.rpe,s.mood,m.notes,d.journal_ressenti,d.journal_positif,d.journal_ameliorer].map(esc).join(','));
    }catch(e){}
  });
  const blob=new Blob(['\uFEFF'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='training-history-'+new Date().toISOString().slice(0,10)+'.csv';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}


function exportJSON(){
  const keys=Object.keys(localStorage).filter(k=>k.startsWith('log:')).sort();
  if(!keys.length){alert('Aucun log.');return;}
  const data={exportDate:new Date().toISOString(),programStart:localStorage.getItem('programStart')||null,totalJours:keys.length,logs:{}};
  keys.forEach(k=>{try{data.logs[k.slice(4)]=JSON.parse(localStorage.getItem(k));}catch(e){}});
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download='training-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function importHistory(){
  const input=document.createElement('input');
  input.type='file';input.accept='.json';
  input.onchange=e=>{
    const file=e.target.files[0];if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const data=JSON.parse(ev.target.result);
        const logs=data.logs||data;
        const allDates=Object.keys(logs).filter(d=>d.match(/^\d{4}-\d{2}-\d{2}$/));
        const dateRange=allDates.length?allDates.sort()[0]+' au '+allDates.sort().slice(-1)[0]:'aucune';
        let n=0, merged=0;
        Object.entries(logs).forEach(([date,entry])=>{
          if(!date.match(/^\d{4}-\d{2}-\d{2}$/)) return; // skip non-date keys
          const existKey='log:'+date;
          const existing=localStorage.getItem(existKey);
          if(!existing){
            localStorage.setItem(existKey,JSON.stringify(entry)); n++;
          } else {
            // Fusion : compléter les champs manquants sans écraser ceux déjà remplis
            try{
              const cur=JSON.parse(existing);
              let changed=false;
              Object.entries(entry).forEach(([k,v])=>{
                if(cur[k]===undefined || cur[k]===null || cur[k]==='' || (typeof cur[k]==='object' && Object.keys(cur[k]||{}).length===0)){
                  cur[k]=v; changed=true;
                }
              });
              if(changed){ localStorage.setItem(existKey,JSON.stringify(cur)); merged++; }
            }catch(e){ localStorage.setItem(existKey,JSON.stringify(entry)); n++; }
          }
        });
        // Importer aussi les autres clés (baselines, ts, etc.) si présentes hors 'logs'
        if(data.logs){
          Object.entries(data).forEach(([k,v])=>{
            if(k==='logs'||k==='exportDate'||k==='programStart'||k==='totalJours') return;
            if(typeof v==='string' && !localStorage.getItem(k)){ localStorage.setItem(k,v); }
          });
        }
        alert('Fichier lu : '+allDates.length+' dates ('+dateRange+').\n\nRésultat : '+n+' nouvelle(s) + '+merged+' complétée(s).\n\nSi 0+0 : ces dates existent déjà identiques dans cette app.');
        render();
      }catch(ex){alert('Fichier invalide.');}
    };
    reader.readAsText(file);
  };
  input.click();
}


// ── ONGLET MOTEUR — mode maison/déplacement, matériel, durée, séances ──────
// Qualités jugées prioritaires selon le focus/cycle actif — sert à mettre en valeur les séances
// pertinentes (ex. ni VMA, ni VO2max, ni work capacity ne sont mis en avant en focus Force max).
function moteurRelevantQualities(){
  const info = moteurCycleInfo();
  if(!info) return null;
  if(info.type === 'force') return ['force_max'];
  if(info.type === 'puissance') return ['alactique','repetition_puissance'];
  if(info.type === 'prep_tests' || info.type === 'semaine_tests') return ['force_max'];
  return null;
}
function moteurSessionRelevant(session){
  const q = moteurRelevantQualities();
  if(!q) return false;
  return (session.qualites_prioritaires||[]).some(x=>q.includes(x));
}
