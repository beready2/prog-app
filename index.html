  <style>
    *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{
      --bg:#0a0f1a;--bg2:#0e1520;--bg3:#111d2e;--bg4:#1a2640;--card:#0d1525;
      --acc:#e63946;--acc2:#ff4d5a;--gold:#f5a623;--teal:#06b6d4;
      --green:#10b981;--purple:#8b5cf6;--blue:#3b82f6;--orange:#f97316;
      --text:#f0f4f8;--text2:#94a3b8;--text3:#475569;
      --border:#1e2d42;--border2:#243347;
      --font-d:'Bebas Neue',cursive;--font-b:'DM Sans',sans-serif;
      --safe-top:env(safe-area-inset-top);--safe-bottom:env(safe-area-inset-bottom);
    }
    html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font-b);overflow:hidden}
    #root{height:100%;display:flex;flex-direction:column}
    ::-webkit-scrollbar{display:none}
    input,textarea,select{font-family:var(--font-b)}
  .btn-back{background:#1b263b;color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer}

.card{overflow-wrap:break-word;word-break:break-word}
input,select,textarea{box-sizing:border-box}

/* Largeur uniforme bilans : forcer tous les onglets à pleine largeur */
.scroll > div { width:100% !important; box-sizing:border-box; }
.scroll .card { width:100% !important; box-sizing:border-box; }
.scroll .section-hdr { width:100%; box-sizing:border-box; }

/* Anti-débordement page Routine */
.scroll{overflow-x:hidden!important}
.section-hdr{max-width:100%;box-sizing:border-box;overflow-wrap:break-word}
.cat-badge{flex-shrink:0;max-width:130px;overflow:hidden;text-overflow:ellipsis}
.tag{flex-shrink:0;white-space:normal}
</style>

    "description": "Socle commun lu par le manuel (PDF, évergreen) et par le moteur de séance de l'app (choix live selon matériel/fenêtre/bilan). Aucune charge ici — seulement tags qualité, matériel, côté, contre-indication, substituts par fenêtre. v1.1 ajoute pattern de mouvement, progression_type, severity_overrides. v1.2 ajoute protocole_cycle_eligible: seuls militaire_barre et bench_plat_barre utilisaient la methode Top Set conjugate/Cluster dans Guyane -- les autres exercices gardent un format standard (pas de top set/cluster pour Bulgarian, RDL, Zercher, etc., coherent avec le risque genou/poignet). v1.3 ajoute les machines maison (presse a cuisse, leg extension/curl, poulies haute/basse, butterfly) et des substituts lies aux contre-indications (pas seulement au materiel manquant) : ex. genou_G_itband -> presse_cuisse, poignet_G -> poulie. v1.4 ajoute Front Squat (test RSA officiel MTI, prise croisee), Push Press et Squat Clean (standards MTI documentes, priorite future une fois epaule/poignet stabilises). v1.5 (31/08/2026, chantier 46) aligne le catalogue sur les decisions de J du 30/08, restees jusqu'ici dans le programme et le manuel seulement : (a) le RDL hanches hautes barre du sol devient explicitement le MOUVEMENT DE REFERENCE du hinge (test ET travail, creneau lourd ET creneau volume) ; (b) le souleve de terre conventionnel cesse d'etre le substitut par defaut de la trap bar et sa fiche porte son statut reel de dernier recours hors score ; (c) PRISE NUE par defaut partout (chin-ups, pull-ups, KB RDL) - la sangle redevient un delestage ponctuel, et elle disparait du NOM de l'exercice KB RDL ; (d) les notes qui decrivaient les creneaux par nom de seance du split abandonne (Haut 1, Haut 3, Bas 2) sont reformulees par PATTERN. v1.6 (31/08/2026, chantier 49) — TRANSFERT DES FICHES TECHNIQUES HÉRITÉES DU SPLIT. Jusqu'ici, pour 30 exercices, la note affichée sur la carte de séance ne venait PAS de ce catalogue mais des fiches du split abandonne le 08/08 (moteurFindGuyaneRef), qui primaient sur le champ notes[]. Consequence : la note maintenue etait masquee, et le bench affichait encore « Test officiel S9 - Objectif : 80 kg x 3 » (cible de juillet, perimee depuis le 3RM a 91 kg du 08/08). Les reperes techniques utiles sont desormais DANS ce catalogue, reformules par pattern et non par nom de seance ; les valeurs datees sont corrigees ou marquees perimees. Le catalogue redevient la source unique de la note d'exercice. v1.7 (31/08/2026, chantier 55) — (a) row_bucheron reclasse en haut_force (il etait le seul tirage horizontal classe en isolation/volume) et dote d'une chaine de substituts ; (b) med_ball_slam : la contre-indication epaule_g_extreme etait une cle morte, jamais lue par le moteur — reclassee epaule_G etage 1 ; (c) pseudo_lancer_rot_elastique : pattern 'rotation' orphelin -> 'rotation_anti_rotation', sinon le repli par pattern ne pouvait jamais le trouver ; (d) cle de substitut 'poignet_g' (minuscule) renommee : elle ne correspondait a aucune contre-indication. ⚠ CHAMP windows_ok : il est DEPRECIE. Le moteur ne le lit nulle part — le seul filtre reel est le materiel (equipment_required) croise avec le materiel coche, plus les contre-indications du jour. 97 entrees portent encore le tag 'paris', fenetre abandonnee depuis le 30/08 (Lyon confirme a la place). Conserve pour trace, ne doit plus servir a decider quoi que ce soit. v1.8 (31/08/2026, chantier 57) — VOCABULAIRE DE QUALITES REMIS D'EQUERRE. 23 fiches portaient des tags qui n'existent dans AUCUNE taxonomie (puissance, gainage, stabilite, force, rotation, unilateral, excentrique...) : elles etaient donc invisibles a toute requete par qualite — y compris au repli du moteur et au radar. Trois fiches n'avaient meme AUCUN tag, dont row_bucheron, le seul tirage horizontal de la semaine. Tout est normalise sur les 19 qualites declarees ; les mots qui designent une METHODE et non une qualite (excentrique, isometrique, explosivite, puissance_verticale, motricite, prophylaxie_genou) sont deplaces dans un champ 'methodes' — rien n'est perdu. pompes_poignees repasse en progression 'reps' (ce n'est pas un mouvement charge). ⚠ LIMITE CONNUE : la taxonomie n'a pas de 'rotation controlee' ; les rotations non balistiques (russian twist, bridge/GHD rotation) sont provisoirement rangees sous puissance_rotation — approximation assumee, chantier 65. v1.9 (31/08/2026, chantiers 60 et 64) — le pattern fourre-tout 'rotation_anti_rotation' (15 fiches) est ECLATE en anti_extension / anti_rotation / rotation_produite : le moteur substitue « meme pattern » EN PREMIER, une planche pouvait donc remplacer un lancer rotationnel, deux qualites que le code lui-meme qualifie d'INVERSES. hip_thrust porte enfin son statut reel (retire du travail de jambes courant). v2.0 (01/09/2026) — DECISIONS DE J : (a) FUSION des deux fiches doublons 'Planche laterale' et 'Side plank' en une seule (side_plank), avec G_first et le standard du ch. 12 ; (b) la POMPE CLAQUEE est documentee comme progression de la pompe explosive et substitut d'ENTRAINEMENT du lancer horizontal sans med ball — avec deux reserves ecrites : reception en extension de poignet (poignet G) et absence de bareme, donc jamais substitut de TEST. v2.1 (02/09/2026) — J confirme que le KB swing ne gene PAS l'epaule G, meme a un bras a 16 kg en alternance. (a) L'etiquette 'epaule_G' est retiree des TROIS fiches de swing : elle ne declenchait rien (aucun etage de delestage), elle affichait donc une protection inexistante. (b) Consequence bien plus importante que le tag : le SWING 1 BRAS ALTERNE 40/20 est reautorise, et c'est le SEUL format documente qui atteigne la Z2 (144 bpm mesures, contre 115 pour le 2 bras en 30/30). Il redevient l'outil Z2 des fenetres sans velo ni tapis — dont les deux fenetres de decembre (valise + KB). v2.2 (03/09/2026, chantier 65) — DEUX QUALITES AJOUTEES A LA TAXONOMIE (17 -> 19 -> 21 qualites), fermant la limite connue ecrite en v1.8. (a) 'rotation_controlee' : russian_twist, bridge_rotation, ghd_rotation portaient 'puissance_rotation' alors que leurs propres notes disent le contraire mot pour mot ('Contrôlé, jamais en balistique', 'Rotation en position NEUTRE', 'STOP dès que l'alignement se dégrade') — un tag qui contredit sa propre fiche fausse le compteur d'axe : l'axe teste 'Rotation' (lancer_rot, un lancer EXPLOSIF en metres) aurait ete crédité par des exercices lents et controles. Verifie sans consequence sur le compteur hebdomadaire : le créneau AGT (med_ball_rotationnel / chop_lift_elastique, explosifs, presents chaque semaine) reste le vecteur reel de l'axe 'Rotation' ; le créneau FB2 'rotation_puissance' (russian_twist par defaut) n'en a jamais ete le vecteur effectif une fois le tag corrige, ce qui est la lecture honnete de ce que fait ce mouvement. Un 4e cas non cite par l'audit v3 mais de meme nature, trouve en verifiant chaque fiche 'rotation_produite' plutot que de faire confiance a la liste : rotation_fente_elastique ('tempo LENT, pas explosif en appui instable' dans sa propre note) — corrige a l'identique. (b) 'sante_articulaire' : les 8 fiches recensees par l'audit v3 comme 'invisibles a tout comptage' (face_pull, rotation_ext_epaule, renfo_poignet_g, leg_extension_machine — les 4 fiches 'prophylaxie_*' — et elevations_laterales, curl_biceps_bfr, extension_triceps_bfr, butterfly — 4 accessoires haut_iso_volume choisis nommement pour epargner une articulation sensible, chacun le dit dans sa propre note : 'sans charge articulaire', 'sans stress articulaire epaule G', 'Surveiller l'epaule G'). Aucune des deux qualites n'alimente un axe du radar (T_AXE_VECTEURS inchange) : ni la rotation controlee ni la sante articulaire ne sont testees par une epreuve du ch. 12 aujourd'hui — c'est un constat, pas une omission a corriger dans ce chantier. Ce que a change : ces 12 fiches sont desormais rattachees a une qualite REELLE plutot qu'a aucune ou a la mauvaise, donc visibles a tout filtre ou audit futur par qualite. v2.2 (suite, chantier 73, audit v4 recupere) — cle de materiel morte : presse_jambes_2j et presse_jambes_1j exigeaient 'presse_jambes', absent de toute fenetre ; la taxonomie declare 'presse_cuisse' (la presse existe a la maison). Corrige -> 'presse_cuisse' : les deux fiches redeviennent atteignables la ou l'appareil existe reellement. v2.3 (08/11/2026, app v4.25) : poignet_G étendu à 43 fiches. Deux seuils : 1 = douleur légère ou restriction modérée → suspension, appuis au sol, frappe, tirages lourds coupés (fiches historiques) ; 2 = douleur forte ou restriction stricte (PRP) → toute préhension ou poussée chargée coupée (39 fiches ajoutées en severity_overrides 2 : bench, rows, carries, swings, KB, landmine, poulies…). front_squat, push_press, pompe_explosive et t2_enchaine passent au seuil 1.",

async function syncFromFirebase(){
  if(!db||!_uid||!_fbCollection||!_fbGetDocs) return;
  try{
    const snap=await _fbGetDocs(_fbCollection(db,'users',_uid,'data'));
    snap.forEach(d=>{
      const remote=d.data();
      const localVal=localStorage.getItem(d.id);
      // Restore if missing locally, OR if remote has a newer timestamp
      if(localVal===null){
        localStorage.setItem(d.id, remote.value);
      } else if(remote.ts && remote.localTs && remote.ts > (Number(localStorage.getItem('_ts:'+d.id))||0)){
        localStorage.setItem(d.id, remote.value);
      }
    });
  }catch(e){console.warn('sync error',e);}
}

// Vélo : S1 (2×) 4-12-4 · S2 (2×) 4-8-12 · S3 (3×) 4-12-4 · S4 (3×) 4-8-12 · S5 (4×) 4-12-4 · S6 (4×) 4-8-12
// · S7 (5×) 4-12-4 · S8 (5×) 4-8-12. Course : mêmes durées ÷2 (4-12-4 → 2-6-2 · 4-8-12 → 2-4-6).
const M_SEUIL_PROGRESSION = {
  1:{seq:'4-12-4',repeats:2}, 2:{seq:'4-8-12',repeats:2},
  3:{seq:'4-12-4',repeats:3}, 4:{seq:'4-8-12',repeats:3},

};

function moteurSeuilFormatLabel(modalite, semaine){
  const p = M_SEUIL_PROGRESSION[semaine] || M_SEUIL_PROGRESSION[1];

  return '('+p.repeats+'×) '+seq+' min';
}

// Séances Moteur faites, stockées DANS le log du jour (log.moteur_sessions = [sessionId,...]) —
// une seule source de vérité, cohérente avec tout le reste (export/import, calendrier).
function moteurWeekDates(){
  const dow = today.getDay() || 7; // 1=lundi..7=dimanche
  const monday = new Date(today); monday.setDate(today.getDate()-(dow-1));
  const dates=[];
  for(let i=0;i<7;i++){
    const d=new Date(monday); d.setDate(monday.getDate()+i);
    dates.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
  }
  return dates;
}
function moteurToggleSessionDoneToday(sessionId){
  const log = getLog();
  const arr = log.moteur_sessions || [];
  const idx = arr.indexOf(sessionId);
  const wasDone = idx>=0;
  if(wasDone) arr.splice(idx,1); else arr.push(sessionId);
  log.moteur_sessions = arr;
  saveLog(log);
  // v4.24 — en cochant une séance comme faite, on avance le pointeur de « séance courante »
  // vers la suivante plutôt que de le laisser bloqué sur une séance déjà terminée. On ne
  // recule jamais en décochant (ambigu, et rarement l'intention).
  if(!wasDone) moteurAdvanceCurrentSession(sessionId);
  render();
}
// v4.24 (11/09) — avance le pointeur de séance courante (S.moteurSessionId / MS.currentSessionId)
// après qu'une séance a été cochée « faite ». Pas de logique de jour de semaine ici : les données
// réelles de J montrent que le même jour calendaire (deux jeudis, ex. 03/09 et 10/09) peut porter
// des séances différentes (Z2 longue puis FB1) selon son astreinte — verrouiller sur un jour de la
// semaine aurait juste remplacé un mauvais repère par un autre. On avance dans L'ORDRE du gabarit
// (MTPL.session_types), en préférant une séance pas encore faite cette semaine, sinon la prochaine
// séance ouvrable tout court — un repère pour « la suite probable », jamais un verrou : le
// sélecteur de l'onglet Sport reste toujours modifiable à la main.
function moteurAdvanceCurrentSession(justCompletedId){
  if((MS.currentSessionId||S.moteurSessionId) !== justCompletedId) return;
  const list = MTPL.session_types;
  const idx = list.findIndex(s=>s.id===justCompletedId);
  if(idx<0) return;
  const eligible = s => !moteurSessionLockedByPhase(s) && moteurResolveSession(s).status!=='blocked';
  const setCurrent = s=>{ S.moteurSessionId = s.id; MS.currentSessionId = s.id; save('moteur_state', MS); };
  for(let i=1;i<=list.length;i++){
    const s = list[(idx+i) % list.length];
    if(!eligible(s)) continue;
    const target = moteurMissionTarget(s.frequence_cible);
    const done = moteurSessionDoneCountThisWeek(s.id);
    if(target ? done<target : done===0){ setCurrent(s); return; }
  }
  for(let i=1;i<=list.length;i++){
    const s = list[(idx+i) % list.length];
    if(eligible(s)){ setCurrent(s); return; }
  }
}
function moteurIsSessionDoneToday(sessionId){
  return (getLog().moteur_sessions||[]).includes(sessionId);

function moteurSessionDoneCountThisWeek(sessionId){
  return moteurWeekDates().filter(ds=>{
    const l = ds===todayStr ? getLog() : (load('log:'+ds)||{});
    return (l.moteur_sessions||[]).includes(sessionId);
  }).length;
}
function moteurMissionTarget(freqText){
  const m = /(\d+)\s*x/i.exec(freqText||'');
  return m ? Number(m[1]) : null;
}

  const always = ['poids_du_corps', 'aucun'];
  const base = MS.mode === 'maison' ? M_MAISON_EQUIPMENT : MS.equipDeplacement;
  return Array.from(new Set([...base, ...always]));
}

// ── Rampe d'approche du top set : séries montantes calculées en kg réels ──────────────────
// Approches NON fatigantes (reps basses, RIR élevé) : elles préparent le top set, elles ne
// le préparent pas au prix de la fraîcheur. Arrondi au palier de 2,5 kg (disques).
function moteurRampeTopSet(target){
  if(!(target > 0)) return null;
  const r = v => Math.round(v/2.5)*2.5;
  const BAR = 20;
  const steps = [{lbl:'Barre à vide', kg:BAR, reps:'×5'}];
  [[0.50,'×3'],[0.70,'×3'],[0.85,'×2']].forEach(([pct,reps])=>{
    const kg = r(target*pct);
    if(kg > BAR && kg < target) steps.push({lbl:Math.round(pct*100)+' %', kg, reps});
  });
  steps.push({lbl:'TOP SET', kg:r(target), reps:'×3', top:true});
  steps.push({lbl:'Back-off ×2', kg:r(target*0.90), reps:'×5'});
  return steps;
}
// ── Nombre de séries à cocher, déduit du format ──────────────────────────────────────────
// parseInt('3-4×8') renvoyait 3 : une fourchette affichait toujours sa borne BASSE.
// Ici on prend la borne HAUTE (c'est le plafond prévu ; cocher moins reste possible).
// Cas top set : top set + back-off = séries de travail (les approches ne se cochent pas).
function moteurNbSeries(format){
  if(!format) return 3;
  if(/top set/i.test(format)){
    const bo = format.match(/back-?off\s*(\d+)\s*[-\u2013]?\s*(\d+)?\s*[\u00D7x]/i);
    return 1 + (bo ? Number(bo[2] || bo[1]) : 2);
  }
  const m = format.match(/(\d+)\s*[-\u2013]\s*(\d+)\s*[\u00D7x]/);
  if(m) return Number(m[2]);
  const s = format.match(/(\d+)\s*[\u00D7x]/);
  if(s) return Number(s[1]);
  const n = parseInt(format);
  return isFinite(n) && n > 0 ? n : 3;
}

  }
  if(MS.focusManuel === 'prep_tests'){
    return M_TEST_FORMAT[ex.id] ? {nom:'Préparation test', format:'Paliers progressifs vers sous-max, vitesse gardée', rpe:'7-8', phase:'focus_manuel', volume_pct:info.volume_pct} : null;
  }
  // Déload — VOLUME −50 %, INTENSITÉ MAINTENUE (programme §2 · manuel ch. 11, v4.34).
  // v4.1 : l'ancienne version renvoyait '3×3 déload' @RPE 4-5, c.-à-d. une baisse d'intensité sur une
  // semaine entière. C'est le volume qui coûte de la récupération ; l'intensité tient les adaptations
  // neuromusculaires. On garde donc le top set à son RPE et on supprime tout le volume autour.
  if(info.phase === 'deload'){
    const dlType = info.type === 'puissance' ? 'puissance' : 'force';
    const dlMethod = dlType === 'force'
      ? (M_FORCE_TOPSET.has(ex.id) ? 'top_set' : null)
      : (M_PUISSANCE_METHOD[ex.id] || null);
    if(dlMethod === 'top_set'){
      return {nom:'Déload', format:'Top set ×3 @RIR 1-2 — AUCUN back-off (volume −50 %, intensité maintenue)',
              rpe:'8', phase:'deload', volume_pct:50};
    }
    if(dlMethod){
      const mfd = M_METHOD_FORMATS[dlMethod];
      return {nom:'Déload', format:mfd.modere+' — séries divisées par deux, vitesse et charge inchangées',
              rpe:mfd.rpe.modere, phase:'deload', volume_pct:50};
    }
    return {nom:'Déload', format:'Volume −50 % (séries de travail divisées par deux) — charge et technique inchangées',
            rpe:'inchangé', phase:'deload', volume_pct:50};
  }
  const cycleType = info.type;
  let method = null;
  if(cycleType === 'force') method = M_FORCE_TOPSET.has(ex.id) ? 'top_set' : null;
  else if(cycleType === 'puissance') method = M_PUISSANCE_METHOD[ex.id] || null;
  if(!method) return null;
  const mf = M_METHOD_FORMATS[method];
  const phaseKey = ['leger','modere','pic'].includes(info.phase) ? info.phase : 'modere';
  return {nom:mf.nom, format:mf[phaseKey], rpe:mf.rpe[phaseKey], phase:info.phase, volume_pct:info.volume_pct};
}
// Format standard par défaut quand aucun protocole de cycle ne s'applique (fidèle aux prescriptions
// réelles de Guyane pour les mouvements secondaires/accessoires, pas de top-set partout).
function moteurDefaultFormat(ex){
  if(ex.progression_type === 'aucun') return null;
  if(ex.pattern === 'carry') return '3×30-40m';
  if(ex.category === 'bas_force') return ex.side_rule === 'G_first' ? '3-4×8/côté' : '3-4×6-8';
  if(ex.category === 'haut_force') return '3-4×6-8';
  if(ex.category === 'gainage') return '3×10-20s';
  if(['prophylaxie_epaule','prophylaxie_genou_pied','prophylaxie_poignet'].includes(ex.category)) return '2-3×10-15';
  if(ex.category === 'haut_iso_volume') return '3×10-15';
  if(ex.category === 'alactique_finisher') return '3-4×8s récup complète';
  return '3×8-10';
}
function moteurDefaultRpe(ex){
  if(['bas_force','haut_force'].includes(ex.category)) return '6-7';
  return null;
}

// ⚠ CHANTIER 49 (31/08) : ce mécanisme ne pilote PLUS rien de ce qui s'affiche pendant la séance.
// Il alimentait auparavant format / RPE / repos / note des cartes d'exercice ; ces valeurs sont
// désormais portées par les créneaux (templates v1.3) et par le catalogue (v1.6). Il ne reste ici que
// (a) le filet de note technique — affiché ÉTIQUETÉ « hérité » quand le catalogue n'a rien —, et
// (b) la relecture de l'historique des logs du split (moteurLastExerciseLog). Rien n'est supprimé :
// les fiches de séance du split restent consultables, le split reste un outil de spécialisation.
const M_GUYANE_KEYWORDS = {
  militaire_barre:['militaire'], pendlay_row:['pendlay'], db_bench_incline:['db bench','bench inclin'],
  chin_ups:['chin-up'], face_pull:['face pull'], rotation_ext_epaule:['rotation ext'],
  nuque_iso_elastique:['nuque iso'], hardstyle_plank:['hardstyle plank'], hollow_hold:['hollow hold'],
  bench_plat_barre:['bench plat'], db_press_vertical:['db press vertical'], gorilla_row:['gorilla row'],
  bulgarian_split_squat:['bulgarian'], rdl:['romanian dl','rdl'], copenhagen_adductor:['copenhagen'],
  pallof_press:['pallof'], side_plank:['planche latérale','planche laterale'],
  dragon_flag:['dragon flag'], farmer_carry:['farmer carry'], zercher_squat:['zercher'],

  curl_biceps_bfr:['curl biceps'], extension_triceps_bfr:['extension triceps'], row_bucheron:['row bûcheron','row bucheron']

function moteurFindGuyaneRef(exId){
  const kws = M_GUYANE_KEYWORDS[exId];
  if(!kws) return null;
  for(const seanceKey of Object.keys(SEANCES)){
    const seance = SEANCES[seanceKey];
    for(const blocNum of [2,3,1,4]){
      const bloc = seance.blocs[blocNum];
      if(!bloc || !bloc.exercices) continue;
      for(const ex of bloc.exercices){
        const nameLower = (ex.name||'').toLowerCase();
        // Ignorer les lignes combinées ("Face Pull + Rotation ext") — elles mélangent le format
        // de deux exercices en un seul champ ambigu. On préfère une ligne à un seul exercice.
        if(nameLower.includes(' + ')) continue;
        if(kws.some(k=>nameLower.includes(k))) return {repos: ex.repos, note: ex.note, rpe: ex.rpe, fmt: ex.fmt};
      }
    }
  }
  return null;
}
// Priming réel de Guyane (bloc 2), affiché en une ligne compacte au-dessus des cartes d'exercice —
// remplace les slots CARs/primer par leur présentation minimaliste d'origine.
const M_GUYANE_SESSION_KEY = {haut_1:'Haut 1', haut_2:'Haut 2', bas_1:'Bas 1', bas_2:'Bas 2', agt:'AGT'};
function moteurFindGuyanePriming(session){
  const seanceKey = M_GUYANE_SESSION_KEY[session.id];
  if(!seanceKey || !SEANCES[seanceKey]) return null;
  const bloc = SEANCES[seanceKey].blocs[2] || SEANCES[seanceKey].blocs[1];
  return (bloc && bloc.priming) ? bloc.priming : null;
}

function moteurExKey(exId){ return 'ex_moteur_'+exId; }
// Cherche le log le plus récent (aujourd'hui compris) où cet exercice a été renseigné.
function moteurLastExerciseLog(exId){
  const key = moteurExKey(exId);
  const todayEntry = getLog()[key];
  if(todayEntry) return {date: todayStr, entry: todayEntry};
  const dayKeys = Object.keys(localStorage).filter(k=>k.startsWith('log:')).sort().reverse();
  const kws = M_GUYANE_KEYWORDS[exId];
  for(const dk of dayKeys){
    let l; try{ l = JSON.parse(localStorage.getItem(dk)); }catch(e){ continue; }
    if(!l) continue;
    if(l[key]) return {date: dk.slice(4), entry: l[key]};
    // Repli : historique Guyane (ex_<seance>_b<bloc>_<idx>) pour le même mouvement.
    if(kws){
      for(const k2 of Object.keys(l)){
        const m = k2.match(/^ex_(.+)_b(\d)_(\d+)(?:_\w+)?$/);
        if(!m) continue;
        const seance = SEANCES[m[1]];
        const bloc = seance && seance.blocs && seance.blocs[Number(m[2])];
        const ex = bloc && bloc.exercices && bloc.exercices[Number(m[3])];
        if(!ex) continue;
        const nameLower = (ex.name||'').toLowerCase();
        if(kws.some(kw=>nameLower.includes(kw)) && l[k2] && (l[k2].charge!=null && l[k2].charge!=='')){
          return {date: dk.slice(4), entry: l[k2]};
        }
      }
    }
  }
  return null;
}
function moteurGetChargeUnit(exId){ return M_CHARGE_SEED[exId] ? M_CHARGE_SEED[exId].unit : 'kg'; }
function moteurGetCharge(exId){
  const last = moteurLastExerciseLog(exId);
  if(last && last.entry.charge != null && last.entry.charge !== '' &&
     (last.date === todayStr || moteurDaysAgo(last.date) <= 10)) return last.entry.charge;
  if(M_CHARGE_SEED[exId]) return M_CHARGE_SEED[exId].load;
  return null;
}
// Dernière fois que cet exercice a été fait AVANT aujourd'hui (pour afficher "ancien poids/reps, fait le ...")
function moteurLastPastLog(exId){
  const key = moteurExKey(exId);
  const dayKeys = Object.keys(localStorage).filter(k=>k.startsWith('log:') && k.slice(4)!==todayStr).sort().reverse();
  for(const dk of dayKeys){
    let l; try{ l = JSON.parse(localStorage.getItem(dk)); }catch(e){ continue; }
    if(l && l[key] && (l[key].charge != null && l[key].charge !== '')) return {date: dk.slice(4), entry: l[key]};
  }
  return null;
}
function moteurDaysAgo(dateStr){ return Math.floor((today - new Date(dateStr)) / 86400000); }
function moteurSetTodayField(exId, field, val, sessionId){
  const log = getLog();
  const key = moteurExKey(exId) + (sessionId ? '@'+sessionId : '');
  const entry = log[key] || {sets:{}};
  entry[field] = val;
  log[key] = entry;
  saveLog(log);
  // Pas de render() ici : un rebuild complet du DOM à chaque frappe fait perdre le focus du champ.
}
// RPE réel (1-10, déjà le standard de l'app) -> RIR approximatif pour la règle de progression du manuel.
function moteurRpeToApproxRIR(rpe){
  const r = Number(rpe);
  if(!r) return null;
  return Math.max(0, Math.min(4, 10 - r));
}
function moteurProgressionSuggestion(exId){
  const ex = M_EX_BY_ID[exId];
  const last = moteurLastExerciseLog(exId);
  if(!ex || !last || last.entry.rpe == null || last.entry.rpe === '') return null;
  // Une donnée trop ancienne ne sert pas à valider un poids aujourd'hui — seulement informatif
  // au-delà de 10 jours (le corps a pu changer, mieux vaut resaisir un RPE frais avant de suggérer).
  if(last.date !== todayStr && moteurDaysAgo(last.date) > 10) return null;
  const rir = moteurRpeToApproxRIR(last.entry.rpe);
  if(rir == null) return null;
  if(ex.progression_type === 'barre'){
    const step = ex.category === 'bas_force' ? 3 : 1.5;
    if(rir >= 3) return {action:'augmenter', text:'+'+step+' kg conseillé (RPE '+last.entry.rpe+' → marge élevée)'};
    if(rir === 2) return {action:'maintenir_ou_leger', text:'Maintenir ou +'+(step/2)+' kg'};
    if(rir === 1) return {action:'maintenir', text:'Conserver la charge (proche du max)'};
    return {action:'reduire', text:'Réduire légèrement ou répéter la séance (RPE '+last.entry.rpe+')'};
  }
  if(ex.progression_type === 'halteres_kb'){
    if(rir >= 3) return {action:'augmenter', text:'Palier disponible le plus proche (ou changement de KB)'};
    if(rir === 2) return {action:'maintenir_ou_leger', text:'Maintenir, palier suivant si séance très propre'};
    if(rir === 1) return {action:'maintenir', text:'Conserver la charge/le KB actuel'};
    return {action:'reduire', text:'Revenir au palier/KB précédent'};
  }
  if(ex.progression_type === 'isometrie'){
    if(rir >= 3) return {action:'augmenter', text:'+2-5s de tenue'};
    return {action:'maintenir', text:'Maintenir la durée'};
  }
  return null;
}
function moteurApplyProgression(exId, sessionId){
  const ex = M_EX_BY_ID[exId];
  const sugg = moteurProgressionSuggestion(exId);
  if(!sugg || ex.progression_type !== 'barre') return;
  const cur = Number(moteurGetCharge(exId)) || 0;
  const step = ex.category === 'bas_force' ? 3 : 1.5;
  let next = cur;
  if(sugg.action === 'augmenter') next = cur + step;
  else if(sugg.action === 'maintenir_ou_leger') next = cur + step/2;
  else if(sugg.action === 'reduire') next = Math.max(0, cur - step/2);
  moteurSetTodayField(exId, 'charge', Math.round(next*2)/2, sessionId);
  render();
}

// ── Sévérité des contre-indications : dérivée du Bilan du jour (source unique) ──
const M_PAIN_SEVERITY = {aucune:0, 'légère':1, forte:2};
function moteurSeverityFromBilan(){
  const m = (getLog().matin) || {};
  return {
    genou_G_itband: M_PAIN_SEVERITY[m.douleur_genou] || 0,
    poignet_G: M_PAIN_SEVERITY[m.douleur_poignet] || 0,
    coude_G_epicondyle: M_PAIN_SEVERITY[m.douleur_coude] || 0,
    cervicales: M_PAIN_SEVERITY[m.douleur_cervicales] || 0,
    epaule_G_pain: M_PAIN_SEVERITY[m.douleur_epaule] || 0
  };
}
function moteurRestrictionsActives(dateStr){
  dateStr = dateStr || todayStr;
  return (MS.restrictions||[]).filter(r => r && r.contra && (!r.du || r.du<=dateStr) && (!r.au || r.au>=dateStr));
}
function moteurRestrictionNiveau(contra, exId){
  return moteurRestrictionsActives().filter(r=>r.contra===contra && !(exId && Array.isArray(r.exceptions) && r.exceptions.includes(exId)))
    .reduce((mx,r)=>Math.max(mx, Number(r.niveau)||0), 0);
}
// Sévérité effective = max(douleur du jour, restriction active).
function moteurSeverityEffective(){
  const sev = moteurSeverityFromBilan();
  ['genou_G_itband','poignet_G','coude_G_epicondyle','cervicales'].forEach(k=>{
    sev[k] = Math.max(sev[k]||0, moteurRestrictionNiveau(k));
  });
  return sev;
}
function moteurEpauleTierEffectif(){
  const n = moteurRestrictionNiveau('epaule_G');
  return Math.max(MS.delestageEpauleTier||0, n>=2 ? 3 : (n>=1 ? 1 : 0));
}
// Suggestion auto de l'étage de délestage épaule à partir de la douleur déclarée dans le Bilan,
// une seule fois par jour (l'utilisateur garde la main pour l'ajuster ensuite).
function moteurMaybeAutoSuggestDelestage(){
  if(MS.delestageAutoDate === todayStr) return;
  const sev = moteurSeverityFromBilan().epaule_G_pain;
  MS.delestageEpauleTier = sev>=2 ? 3 : (sev>=1 ? 1 : 0);
  MS.delestageAutoDate = todayStr;
  save('moteur_state', MS);
}

function moteurExerciseStatus(exId){
  const ex = M_EX_BY_ID[exId];
  if(!ex) return {ok:false, reason:'Exercice introuvable'};
  const avail = moteurEquipment();
  const missing = ex.equipment_required.filter(r => !avail.includes(r));
  if(missing.length) return {ok:false, reason:'Matériel manquant : ' + missing.map(m=>M_EQUIP_LABEL[m]||m).join(', ')};
  const sev = moteurSeverityEffective();
  const tierEp = moteurEpauleTierEffectif();
  for(const c of (ex.contraindications||[])){
    if(c === 'epaule_G'){
      if(ex.delestage_tier != null && ex.delestage_tier <= tierEp){
        return {ok:false, contra:c, reason:'Délestage épaule G actif (étage ' + ex.delestage_tier + ' coupé)'};
      }
    } else {
      const threshold = (ex.severity_overrides && ex.severity_overrides[c] != null) ? ex.severity_overrides[c] : 1;
      const rnEx = moteurRestrictionNiveau(c, ex.id);
      const sevEx = Math.max(moteurSeverityFromBilan()[c]||0, rnEx);
      if(sevEx >= threshold){
        const parRestriction = rnEx >= threshold;
        return {ok:false, contra:c, parRestriction,
          reason:(parRestriction ? 'Restriction médicale active : ' : 'Contre-indication active (' + (sevEx>=2?'forte':'légère') + ') : ') + (M_CONTRA_LABEL[c]||c).split(' (')[0]};
      }
    }
  }
  return {ok:true, reason:null};
}

// Résolution d'un slot : préférence déclarée -> substituts déclarés -> repli par PATTERN
// (même mouvement fonctionnel) -> repli par simple catégorie/qualité en dernier recours.
function moteurResolveSlot(slot, usedIds){
  const pref = slot.exercice_pref;
  const prefEx = pref ? M_EX_BY_ID[pref] : null;
  const wantedQualities = slot.qualities || (prefEx ? prefEx.qualities : []) || [];
  const wantedPattern = prefEx ? prefEx.pattern : null;

  function tryFind(predicateExtra){
    return MCAT.exercises.find(e => !usedIds.has(e.id) && predicateExtra(e) && moteurExerciseStatus(e.id).ok);
  }
  function fallback(excludeId){
    if(wantedPattern && wantedPattern !== 'none'){
      const byPattern = tryFind(e => e.id !== excludeId && e.pattern === wantedPattern);
      if(byPattern) return {ex: byPattern, viaPattern:true};
    }
    const byCategory = tryFind(e => e.id !== excludeId && e.category === slot.category &&
      (!wantedQualities.length || wantedQualities.some(q => e.qualities.includes(q))));
    if(byCategory) return {ex: byCategory, viaPattern:false};
    return null;
  }

  if(pref){
    const st = moteurExerciseStatus(pref);
    if(st.ok && !usedIds.has(pref)) return {exId: pref, substituted:false};
    // CHANTIER 68/71 (audit v4) — substituts déclarés au niveau du CRÉNEAU, servis AVANT ceux de la
    // fiche. Le créneau connaît le rôle et l'intensité (quel créneau a le plus besoin de la ressource
    // rare, ex. le TRX row) ; la fiche ne connaît que le mouvement, et sert la ressource au premier
    // créneau qui la demande dans l'ordre du template — un pur effet d'ordre de saisie (cas réel : le
    // tirage vertical de FB1 consommait le TRX row avant que le tirage horizontal, seul contrepoids
    // chargé de la semaine, ne soit servi).
    if(slot.substituts && slot.substituts.length){
      for(const subId of slot.substituts){
        const subSt = moteurExerciseStatus(subId);
        if(subSt.ok && !usedIds.has(subId)) return {exId: subId, substituted:true, from: pref, blockedReason: st.reason, viaSlotSubstitut:true};
      }
    }
    if(prefEx && prefEx.substitutes){
      // Priorité : le substitut déclaré EXACTEMENT pour la contre-indication qui bloque cet exercice
      // (ex. genou_G_itband -> presse_cuisse) — plus pertinent qu'un substitut générique par matériel.
      const sev = moteurSeverityEffective();
      const activeContra = (prefEx.contraindications||[]).find(c=>{
        if(c==='epaule_G') return prefEx.delestage_tier!=null && prefEx.delestage_tier<=moteurEpauleTierEffectif();
        const threshold = (prefEx.severity_overrides && prefEx.severity_overrides[c]!=null) ? prefEx.severity_overrides[c] : 1;
        return Math.max(moteurSeverityFromBilan()[c]||0, moteurRestrictionNiveau(c, prefEx.id)) >= threshold;
      });
      if(activeContra && prefEx.substitutes[activeContra]){
        const subId = prefEx.substitutes[activeContra];
        const subSt = moteurExerciseStatus(subId);
        if(subSt.ok && !usedIds.has(subId)) return {exId: subId, substituted:true, from: pref, blockedReason: st.reason, viaContraindication:true};
      }
      for(const subId of Object.values(prefEx.substitutes)){
        const subSt = moteurExerciseStatus(subId);
        if(subSt.ok && !usedIds.has(subId)) return {exId: subId, substituted:true, from: pref, blockedReason: st.reason};
      }
    }
    // Repli générique (pattern/catégorie) réservé aux slots OBLIGATOIRES : la séance doit avoir
    // son mouvement. Un slot optionnel indisponible est sauté — jamais remplacé par l'exercice
    // principal d'une autre séance (sinon Bas 2 se transforme en Bas 1 bis : RDL/Bulgarian dupliqués).

const M_PRIMING_ROLES = new Set(['echauffement_general','cars_echauffement','mobilite_thoracique',

function moteurResolveSession(session){
  const usedIds = new Set();
  const results = [];
  // Table unique role → groupe de swap (doit rester alignée avec SWAP_GROUPS de l'UI).
  const M_SWAP_ROLE_GROUP = {
    hinge_principal:'hinge', test_hinge_dl:'hinge', hinge_volume:'hinge', hinge_lourd:'hinge',
    squat_bilateral:'squat', test_rsa_front_squat:'squat',
    gainage_finisher:'gainage_ae', anti_extension_finisher:'gainage_ae',
    anti_rotation:'anti_rotation', rotation_puissance:'rotation',
    unilateral_genou:'unilat',
    volume_quadriceps:'quad_bfr', rappel_puissance:'rappel_puiss',
    ischio_jambiers:'ischios', finisher_bfr_jambes:'ischios',
    agt_rotation:'agt_rot', agt_puissance:'agt_vecteur'
  };
  session.slots.forEach(slot=>{
    // Swap manuel : si l'utilisateur a choisi une variante pour ce créneau, on l'honore.
    let effSlot = slot;
    const grp = M_SWAP_ROLE_GROUP[slot.role];
    if(grp){
      const l = getLog(); const swaps = l._swaps || {};
      const swapKey = grp+'_swap@'+(session&&session.id?session.id:'')+'@'+slot.role;
      const chosen = swaps[swapKey];
      if(chosen && M_EX_BY_ID[chosen]) effSlot = Object.assign({}, slot, {exercice_pref: chosen});
    }
    const r = Object.assign({slot: effSlot}, moteurResolveSlot(effSlot, usedIds));
    // Le priming ne « consomme » pas son exercice : la rotation externe sert en activation ET en
    // prophylaxie, les CARs peuvent revenir, etc. Seuls les créneaux de travail réservent leur exercice.
    if(r.exId && !M_PRIMING_ROLES.has(slot.role)) usedIds.add(r.exId);
    results.push(r);
  });
  // Le priming (échauffement, mobilité, activation, primers) prépare la séance : son indisponibilité
  // ne doit JAMAIS la rendre impossible — sinon un élastique manquant bloque un militaire lourd.
  // CHANTIER 68/71 (audit v4) — un créneau obligatoire déclaré 'absence_acceptable' (le programme dit
  // lui-même que rien ne le remplace dans ce contexte, ex. aucun tirage vertical sans barre de traction)
  // s'affiche absent, motivé — mais ne bloque plus la séance entière. Une absence PRÉVUE n'est pas une panne.
  const oblFails = results.filter(r => r.slot.obligatoire && r.blocked && !M_PRIMING_ROLES.has(r.slot.role) && !r.slot.absence_acceptable && !r.parContre);
  const optFails = results.filter(r => !r.slot.obligatoire && r.blocked);
  let status = 'ok';
  if(oblFails.length) status = 'blocked';
  else if(optFails.length || results.some(r=>r.substituted)) status = 'partial';
  return {results, status, oblFails, optFails};
}

function parseReposAll(r){
  if(!r||r==='\u2014'||r==='-') return [];
  const out=[];
  // Split on / but keep "4-5 min/paire" as one (no sec before /)
  const parts = r.split('/');
  for(const part of parts){
    const mm=part.match(/(\d+)(?:-(\d+))?\s*min/);
    if(mm){const v=mm[2]?parseInt(mm[2]):parseInt(mm[1]);out.push({sec:v*60,lbl:v+'min'});continue;}
    const ss=part.match(/(\d+)(?:-(\d+))?s(?!\w)/);
    if(ss){const v=ss[2]?parseInt(ss[2]):parseInt(ss[1]);out.push({sec:v,lbl:v+'s'});}
  }
  // Deduplicate by sec value, keep unique
  return out.filter((t,i,a)=>a.findIndex(x=>x.sec===t.sec)===i).filter(t=>t.sec>0);
}

function _beep(freq,dur){
  try{
    if(!_audioCtx) return;
    if(_audioCtx.state==='suspended') _audioCtx.resume();
    const o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
    o.type='square';
    o.connect(g);g.connect(_audioCtx.destination);
    o.frequency.value=freq;
    g.gain.setValueAtTime(1.0,_audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,_audioCtx.currentTime+dur);
    o.start(_audioCtx.currentTime);o.stop(_audioCtx.currentTime+dur+0.05);
  }catch(e){}
}

  try{

  }catch(e){}
}

    if(_audioCtx.state==='suspended')_audioCtx.resume();
    const t=_audioCtx.currentTime;
    [[880,1.0,2.5],[1320,0.5,1.8],[2200,0.25,1.2],[440,0.3,2.0]].forEach(([freq,gain,decay])=>{
      const o=_audioCtx.createOscillator(),g=_audioCtx.createGain();
      o.type='sine';o.connect(g);g.connect(_audioCtx.destination);
      o.frequency.value=freq;
      g.gain.setValueAtTime(gain,t);

  }catch(e){}

  const bolt7=L7.map(d=>Number(d.log.matin?.bolt)).filter(v=>v>0);
  if(bolt7.length>=3){
    const trend=bolt7[0]-bolt7[bolt7.length-1];
    if(trend<-4)
      flags.push({lvl:'orange',icon:'🫁',metric:`BOLT -${Math.abs(Math.round(trend))}s cette semaine`,msg:'Régression BOLT. Augmenter cohérence cardiaque + humming. Vérifier respiration nasale pendant AGT.'});
  }

  // ── ACWR (Gabbett) ────────────────────────────────────────────────────────
  const acute=L7.reduce((s,d)=>s+(Number(d.log.soir?.rpe)||0),0);
  const chronic4w=L28.reduce((s,d)=>s+(Number(d.log.soir?.rpe)||0),0)/4;
  if(acute>0&&chronic4w>0){
    const acwr=acute/chronic4w;
    if(acwr>1.5)
      flags.push({lvl:'red',icon:'📈',metric:`ACWR ${acwr.toFixed(2)} · zone rouge`,msg:'Risque blessure élevé (Gabbett >1.5). Déload obligatoire cette semaine.'});
    else if(acwr>1.3)
      flags.push({lvl:'orange',icon:'⚠️',metric:`ACWR ${acwr.toFixed(2)} · attention`,msg:'Au-dessus du seuil optimal (0.8-1.3). Pas de surcharge. Maintenir les charges actuelles.'});
  }

  // ── SÉANCE COMPRESSÉE (jour rouge) ─────────────────────────────────────────
  // Déclencheurs : sommeil <6h OU HRV -10% OU douleur >= modérée (légère persistante ou forte)
  const todayLog = L7[0] ? L7[0].log : {};
  const tm = todayLog.matin || {};
  const sleepLow = tm.sleep_hours!==undefined && tm.sleep_hours!=='' && Number(tm.sleep_hours) < 6;
  let hrvDrop10 = false;
  if(hrv7.length>=3 && hrv14.length>=5){
    const base=hrv14.reduce((a,b)=>a+b,0)/hrv14.length;
    const rec=hrv7.slice(0,3).reduce((a,b)=>a+b,0)/Math.min(3,hrv7.length);
    if((base-rec)/base > 0.1) hrvDrop10 = true;
  }
  const painMod = (tm.douleur_genou==='forte'||tm.douleur_genou==='légère'||tm.douleur_poignet==='forte'||tm.douleur_epaule==='forte'||tm.douleur_epaule==='légère');
  if(sleepLow || hrvDrop10 || painMod){
    const raisons=[];
    if(sleepLow) raisons.push('sommeil <6h');
    if(hrvDrop10) raisons.push('HRV -10%');
    if(painMod) raisons.push('douleur ≥ modérée');
    flags.unshift({lvl:'orange',icon:'🗜️',metric:'Jour compressé conseillé ('+raisons.join(' · ')+')',msg:'Signaux de récupération basse. La version allégée du jour s\'affiche en tête de l\'onglet Séance. Règle : on coupe du VOLUME et des séances, on GARDE l\'intensité du top set (programme §2 · manuel ch. 11). Ne saute pas, allège — sauf VO2max (à remplacer par une Z2) et AGT (à supprimer) : celles-là se font entières ou pas du tout.',compressed:true});
  }

  return flags;
}

function tLoad(){ return load('tests_results') || {}; }
function tSave(d){ save('tests_results', d); }

// ── SCORES COMPOSITES ─────────────────────────────────────────────────────
function tPDC(){ const r=tLoad().pdc; const v=r?parseFloat(r.val):NaN; return isNaN(v)?null:v; }

function tRSA(){
  const d=tLoad(), pdc=tPDC();
  const g=k=>{ const r=d[k]; const v=r?parseFloat(r.val):NaN; return isNaN(v)?null:v; };
  const fs=g('fs3'), bp=g('bench3'), hg=g('hinge3'), tr=g('tractions');
  if(pdc==null||fs==null||bp==null||hg==null||tr==null) return null;
  const e1=x=>x*1.10;                       // 3RM → 1RM estimé (Epley)
  const pts=Math.min(tr,20)*0.10*pdc;       // tractions plafonnées à 20
  return (e1(fs)+e1(bp)+e1(hg)+pts)/pdc;
}
function tRSALabel(v){ return v==null?'—' : v<5.75?'Poor' : v<6.5?'Good' : 'Excellent'; }

function tMTI45(){
  const d=tLoad(), pdc=tPDC();
  const g=k=>{ const r=d[k]; const v=r?parseFloat(r.val):NaN; return isNaN(v)?null:v; };
  let total=0, n=0, detail=[];
  const hg=g('hinge3');
  if(hg!=null && pdc){ const r=hg/pdc;
    const p = r<1.36?0 : r<1.46?1 : r<1.56?2 : r<=1.65?3 : 4;
    total+=p; n++; detail.push(['Hinge '+r.toFixed(2)+'× PDC', p]); }
  [['pompes','Pompes HR'],['keglift','Keg lift'],['longue','Épreuve longue']].forEach(([k,lbl])=>{
    const ep=T_EPREUVES.find(e=>e.id===k), v=g(k);
    if(v!=null && ep.score){ const p=ep.score(v); total+=p; n++; detail.push([lbl,p]); }
  });
  return {total, n, detail};
}
function tMTILabel(t){ return t<8?'Poor' : t<12?'Good' : 'Excellent'; }

// VO2max estimé depuis le test 3 min all-out (course) — équation validée athlètes fonctionnels
function tVO2fromCS(){
  const r=tLoad().test3min; const cs=r?parseFloat(r.val):NaN;
  if(isNaN(cs)||cs<=0) return null;
  return 8.449*cs + 4.387 + 14.683;   // homme
}
// VO2max retenu : saisie directe prioritaire, sinon estimation 3 min
function tVO2(){
  const d=tLoad().vo2max; const v=d?parseFloat(d.val):NaN;
  if(!isNaN(v)&&v>0) return {val:v, src:'mesuré'};
  const e=tVO2fromCS();
  return e!=null ? {val:e, src:'estimé 3 min'} : null;
}

function tScoreOf(ep, res){
  if(!res || res.val===''||res.val==null) return null;
  const v = parseFloat(res.val);
  if(isNaN(v)) return null;
  return ep.score ? ep.score(v) : null;
}

// Combien de créneaux de la semaine active portent CE mouvement — et, à défaut, est-il seulement
// atteignable par un sélecteur ?
function tMvtStatut(exId){
  if(!exId || !M_EX_BY_ID[exId]) return null;
  let creneaux = 0;
  (MTPL.session_types||[]).forEach(st => {
    if(!M_SEMAINE_ACTIVE.includes(st.id)) return;
    (st.slots||[]).forEach(sl => { if(sl.exercice_pref === exId) creneaux++; });
  });
  [].concat(typeof GTG_EXERCICES!=='undefined'?GTG_EXERCICES:[],
           typeof ROUTINE_MATIN!=='undefined'?ROUTINE_MATIN:[]).forEach(it=>{
    if((T_ALIAS_CATALOGUE[it.id]||it.id) === exId) creneaux++;
  });
  // rôles réellement présents dans la semaine
  const rolesSemaine = new Set();
  (MTPL.session_types||[]).forEach(st => {
    if(!M_SEMAINE_ACTIVE.includes(st.id)) return;
    (st.slots||[]).forEach(sl => rolesSemaine.add(sl.role));
  });
  let selecteur = null;
  for(const gk in SWAP_GROUPS){
    const grp = SWAP_GROUPS[gk];
    if(!grp.choices.some(c => c[0] === exId)) continue;
    const roles = [...grp.roles].filter(r => rolesSemaine.has(r));
    if(roles.length) selecteur = roles[0];
  }
  return {creneaux, selecteur};
}
function tAxeMatch(spec, ex){
  if(!spec || spec.mesureSeule) return false;
  const qs = ex.qualities || [];
  if(spec.q && !spec.q.some(q => qs.includes(q))) return false;
  if(spec.p && !spec.p.includes(ex.pattern)) return false;
  if(spec.charge === true  && !M_CHARGE_PROG.includes(ex.progression_type)) return false;
  if(spec.charge === false &&  M_CHARGE_PROG.includes(ex.progression_type)) return false;
  return true;
}
// Nombre de VECTEURS de la semaine active par axe noté, toutes couches confondues.
function tVecteursSemaine(){
  const out = {};
  Object.keys(T_AXE_VECTEURS).forEach(a => out[a] = {n:0, detail:[]});
  const compte = (ex, couche, libelle) => {
    if(!ex) return;
    Object.keys(T_AXE_VECTEURS).forEach(a => {
      if(tAxeMatch(T_AXE_VECTEURS[a], ex)){ out[a].n++; out[a].detail.push(couche+' · '+libelle); }
    });
  };
  // ① séances de la semaine active
  (MTPL.session_types||[]).forEach(st => {
    if(!M_SEMAINE_ACTIVE.includes(st.id)) return;
    (st.slots||[]).forEach(sl => compte(M_EX_BY_ID[sl.exercice_pref], st.nom||st.id, sl.role));
  });
  // ② GTG quotidien  ③ routine du matin
  const horsSeance = [].concat(
    (typeof GTG_EXERCICES !== 'undefined' ? GTG_EXERCICES : []).map(g => [g, 'GTG']),
    (typeof ROUTINE_MATIN !== 'undefined' ? ROUTINE_MATIN : []).map(r => [r, 'Routine'])
  );
  horsSeance.forEach(([item, couche]) => {
    const alias = T_ALIAS_CATALOGUE[item.id] || item.id;
    let ex = M_EX_BY_ID[alias];
    if(!ex && T_QUALITES_HORS_CATALOGUE[item.id]){
      ex = {qualities:T_QUALITES_HORS_CATALOGUE[item.id], pattern:'none', progression_type:'aucun'};
    }
    compte(ex, couche, item.name || item.id);
  });
  return out;
}

// axes du radar = qualités uniques, score = meilleur score disponible sur l'axe
function tAxes(){
  const res = tLoad();
  const map = {};
  const pdc = tPDC();
  T_EPREUVES.forEach(ep=>{
    if(!ep.axe) return;                     // PDC : donnée, pas une qualité
    if(!map[ep.axe]) map[ep.axe] = {axe:ep.axe, cat:ep.cat, scores:[], tested:false};
    const r = res[ep.id];
    if(r && r.val!=='') map[ep.axe].tested = true;
    let sc = null;
    if(ep.ratio && r && r.val!=='' && pdc){  // 3RM : score = ratio atteint / ratio Good
      const ratio = parseFloat(r.val)/pdc;
      const g = ep.ratio;
      sc = ratio < g*0.8 ? 0 : ratio < g*0.92 ? 1 : ratio < g ? 2 : ratio < g*1.15 ? 3 : 4;
    } else { sc = tScoreOf(ep, r); }
    if(sc!=null) map[ep.axe].scores.push(sc);
  });
  // VO2max : compléter par l'estimation issue du test 3 min si pas de mesure directe
  const vo2 = tVO2();
  if(vo2 && map['VO2max / PMA'] && !map['VO2max / PMA'].scores.length){
    map['VO2max / PMA'].tested = true;
    const v=vo2.val;
    map['VO2max / PMA'].scores.push(v<45?0 : v<50?1 : v<55?2 : v<60?3 : 4);
  }
  // Le RSA n'alimente AUCUN axe : les axes Force max sont déjà notés en ratio du PDC.
  // Il reste un score composite, affiché en bas — sinon les mêmes 3RM compteraient deux fois.
  return Object.values(map).map(a=>({
    ...a, score: a.scores.length ? a.scores.reduce((x,y)=>x+y,0)/a.scores.length : null
  }));
}

const T_CAT_LABEL = {force:'FORCE', puiss:'PUISSANCE', filiere:'FILIÈRES', oper:'OPÉRATIONNEL', struct:'STRUCTURE'};

// regroupe les 18 axes en 5 familles (mêmes familles que la carte de couverture du manuel)
function tAxesGrouped(){
  const axes = tAxes();
  return ['force','puiss','filiere','oper','struct'].map(cat=>{
    const subs = axes.filter(a=>a.cat===cat);
    const scored = subs.filter(a=>a.score!=null);
    return {
      cat, label:T_CAT_LABEL[cat],
      score: scored.length ? scored.reduce((s,a)=>s+a.score,0)/scored.length : null,
      tested: subs.some(a=>a.tested),
      nTested: subs.filter(a=>a.tested).length,
      n: subs.length,
      subs
    };
  });
}

// items: [{label, score(0-4|null), tested, color}] · onItemClick(it,i) rend les points/labels cliquables
function tRadarSVGGeneric(items, onItemClick){
  // v4.5 : avec 18 axes, les libellés voisins se chevauchaient en haut du radar. On resserre
  // le polygone pour dégager de la marge et on éloigne un peu les libellés de l'anneau.
  const n = items.length, cx=190, cy=175, R = n <= 6 ? 112 : 96;
  const NS='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(NS,'svg');
  svg.setAttribute('viewBox','0 0 380 350');
  svg.setAttribute('width','100%');
  const mk=(t,at)=>{ const e=document.createElementNS(NS,t); Object.entries(at).forEach(([k,v])=>e.setAttribute(k,v)); return e; };
  // cercles
  [1,2,3,4].forEach(lv=>{
    svg.appendChild(mk('circle',{cx,cy,r:R*lv/4,fill:'none',stroke:'#1e293b','stroke-width':1,'stroke-dasharray':'3 3'}));
  });
  const pt=(i,r)=>{ const a=-Math.PI/2 + i*2*Math.PI/n; return [cx+r*Math.cos(a), cy+r*Math.sin(a)]; };
  // v4.5 : la lisibilité dépend du NOMBRE d'axes, pas du fait qu'ils soient cliquables.
  // 5 familles → gros labels ; 18 qualités → petits, sinon ça se chevauche.
  const fs = n <= 6 ? 10.5 : 8.2;
  const hitR = n <= 6 ? 22 : 13;
  // rayons + labels
  items.forEach((it,i)=>{
    const [x,y]=pt(i,R);
    const grp = mk('g',{});
    svg.appendChild(grp);
    grp.appendChild(mk('line',{x1:cx,y1:cy,x2:x,y2:y,stroke:'#1e293b','stroke-width':1}));
    const [lx,ly]=pt(i, R + (n <= 6 ? 17 : 20));
    const anchor = lx>cx+6?'start':(lx<cx-6?'end':'middle');
    // découpe en 2 lignes si le libellé est long
    const w = it.label.split(' ');
    let l1=it.label, l2='';
    if(it.label.length>13 && w.length>1){
      let acc='';
      for(let k=0;k<w.length;k++){
        if((acc+' '+w[k]).trim().length<=13){ acc=(acc+' '+w[k]).trim(); }
        else { l1=acc; l2=w.slice(k).join(' '); break; }
      }
      if(!l2){ l1=it.label; }
    }
    const col = it.tested? '#e2e8f0':'#475569';
    const dy = l2 ? -3 : 0;
    const t=mk('text',{x:lx,y:ly+dy,'font-size':fs,'font-weight':700,fill:col,'text-anchor':anchor});
    t.textContent = l1;
    grp.appendChild(t);
    if(l2){
      const t2=mk('text',{x:lx,y:ly+7,'font-size':fs,'font-weight':700,fill:col,'text-anchor':anchor});
      t2.textContent = l2;
      grp.appendChild(t2);
    }
    if(onItemClick){
      grp.setAttribute('style','cursor:pointer');
      grp.appendChild(mk('circle',{cx:lx,cy:ly,r:hitR,fill:'transparent'}));
      grp.addEventListener('click',()=>onItemClick(it,i));
    }
  });
  // polygone des scores
  const pts = items.map((it,i)=> pt(i, it.score!=null ? R*it.score/4 : 0));
  if(items.some(it=>it.score!=null)){
    svg.appendChild(mk('polygon',{points:pts.map(p=>p.join(',')).join(' '),
      fill:'#f5a623','fill-opacity':0.18,stroke:'#f5a623','stroke-width':2}));
  }
  items.forEach((it,i)=>{
    const [x,y]=pt(i, it.score!=null ? R*it.score/4 : 0);
    if(it.score!=null){
      svg.appendChild(mk('circle',{cx:x,cy:y,r:3.5,fill:it.color||'#f5a623',stroke:'#0d1525','stroke-width':1.5}));
    } else {
      const [ox,oy]=pt(i,R);
      svg.appendChild(mk('circle',{cx:ox,cy:oy,r:3,fill:'none',stroke:'#475569','stroke-width':1.5,'stroke-dasharray':'2 2'}));
    }
  });
  return svg;
}

// v4.5 — TROIS MODES DE RADAR, tous cliquables :
//   null   → les 5 FAMILLES (vue d'ensemble) · un clic zoome sur la famille
//   'all'  → les 18 QUALITÉS d'un coup (vue historique, réintroduite à la demande de J)
//   <cat>  → les qualités d'UNE famille
// Dans les deux derniers, un clic sur un axe FILTRE la liste des tests sur cette qualité :
// le radar cesse d'être une image et devient la navigation de l'écran.
function tRadarSVG(mode){
  if(mode === 'all'){
    const items = tAxes().map(a=>({label:a.axe, score:a.score, tested:a.tested, color:T_CAT_COLOR[a.cat], axe:a.axe}));
    return tRadarSVGGeneric(items, (it)=>{ S.testsAxeFocus = it.axe; render(); });
  }
  if(mode){
    const g = tAxesGrouped().find(g=>g.cat===mode);
    if(g){
      const items = g.subs.map(a=>({label:a.axe, score:a.score, tested:a.tested, color:T_CAT_COLOR[a.cat], axe:a.axe}));
      return tRadarSVGGeneric(items, (it)=>{ S.testsAxeFocus = it.axe; render(); });
    }
  }
  const items = tAxesGrouped().map(g=>({label:g.label, score:g.score, tested:g.nTested>0, color:T_CAT_COLOR[g.cat], cat:g.cat}));
  return tRadarSVGGeneric(items, (it)=>{ S.testsRadarZoom = it.cat; S.testsAxeFocus = null; render(); });
}

  if(alerts.length){

    alerts.forEach(a=>box.appendChild($('div',{style:{fontSize:'10px',color:'#fecaca'}},'· '+a)));
    wrap.appendChild(box);
  }

  // radar
  const rbox=$('div',{style:{background:'#0d1525',borderRadius:'10px',padding:'6px',marginBottom:'10px'}});
  const mode = S.testsRadarZoom;                          // null · 'all' · <cat>
  const zoomGroup = (mode && mode!=='all') ? tAxesGrouped().find(g=>g.cat===mode) : null;

  // Bascule 5 familles ⇄ 18 qualités (v4.5, demande de J) — toujours visible.
  const seg = $('div',{style:{display:'flex',gap:'5px',padding:'4px 4px 2px',alignItems:'center'}});
  const segBtn = (lbl, actif, on) => $('button',{
    style:{flex:'1 1 0',padding:'6px 4px',borderRadius:'7px',fontSize:'10.5px',fontWeight:'700',

  seg.appendChild(segBtn('5 familles', mode===null || !!zoomGroup,
    ()=>{ S.testsRadarZoom=null; S.testsAxeFocus=null; render(); }));
  seg.appendChild(segBtn('18 qualités', mode==='all',

  if(zoomGroup){
    const bar = $('div',{style:{display:'flex',alignItems:'center',gap:'8px',padding:'2px 6px'}});

    bar.appendChild($('span',{style:{fontFamily:'var(--font-d)',fontSize:'14px',letterSpacing:'1.5px',
      color:T_CAT_COLOR[mode]||'#f5a623'}}, zoomGroup.label));

  rbox.appendChild($('div',{style:{fontSize:'8px',color:'#475569',textAlign:'center',paddingBottom:'4px'}},
    zoomGroup
      ? zoomGroup.nTested+' / '+zoomGroup.n+' qualités mesurées · touchez un axe pour filtrer les tests'
      : mode==='all'
        ? 'Les 18 qualités · touchez un axe pour filtrer les tests'
        : 'Anneaux = 1 à 4 points · touchez une famille pour voir le détail'));
  wrap.appendChild(rbox);

  // Filtre actif sur une qualité → puce d'annulation
  if(S.testsAxeFocus){
    const chip = $('div',{style:{display:'flex',alignItems:'center',gap:'8px',background:'#1a2942',
      border:'1px solid #f5a623',borderRadius:'8px',padding:'6px 10px',marginBottom:'8px'}});

  // ── SAISIES, GROUPÉES PAR QUALITÉ PHYSIQUE (v4.5) ──────────────────────
  // Avant : une liste plate de 30 lignes, où rien ne disait à quelle qualité chaque test
  // se rapportait — alors que le radar juste au-dessus raisonne, lui, par qualité. La liste
  // et le radar lisaient les mêmes données sans jamais se parler. Elles sont maintenant
  // la même vue : famille → qualité → tests, et le radar filtre la liste.
  const axesById = {};
  tAxes().forEach(a=>{ axesById[a.axe]=a; });
  const CATS = ['force','puiss','filiere','oper','struct'];
  const ANCRAGE = 'Ancrage (hors score)';

  const renderEpreuve = (ep)=>{
    const r = res[ep.id] || {val:'',date:''};
    const sc = tScoreOf(ep,r);
    const row=$('div',{style:{background:'#111d2e',borderRadius:'8px',padding:'7px 9px',marginBottom:'6px'}});
    const top=$('div',{style:{display:'flex',alignItems:'center',gap:'6px',marginBottom:'5px'}});
    top.appendChild($('span',{style:{fontSize:'11px',fontWeight:'700',flex:'1'}}, ep.lbl));
    if(sc!=null) top.appendChild($('span',{style:{fontSize:'10px',fontWeight:'800',
      color: sc>=3?'#10b981': sc>=2?'#f59e0b':'#ef4444'}}, sc+'/4'));
    top.appendChild($('button',{class:'info-btn',onclick:(e)=>{ e.stopPropagation(); showTooltip(e,ep.help); }},'?'));
    row.appendChild(top);
    // CHANTIER 57 — LE MOUVEMENT DE TEST A-T-IL UN CRÉNEAU ? Un axe peut être vert alors que le
    // mouvement qu'on note n'est travaillé nulle part : c'est le cas du front squat, seul lift sous
    // le plancher opérationnel, présent uniquement comme option d'un sélecteur.
    const _mv = tMvtStatut(T_EPREUVE_MVT[ep.id]);
    if(_mv && _mv.creneaux === 0){
      const msg = _mv.selecteur
        ? '⚠ aucun créneau dédié — atteignable seulement par le sélecteur du créneau « '+_mv.selecteur+' »'
        : '⚠ aucun vecteur d\'entraînement dans la semaine — on mesure ce qu\'on ne travaille pas';
      row.appendChild($('div',{style:{fontSize:'9.5px',fontWeight:'700',
        color:_mv.selecteur?'#f59e0b':'#ef4444',marginBottom:'5px',lineHeight:'1.3'}}, msg));
    }
    const line=$('div',{style:{display:'flex',gap:'5px',alignItems:'center'}});
    const iv=$('input',{class:'input-mod',type:'number',step:'0.01',style:{width:'72px'},
      value:r.val, placeholder:'—',
      onchange:(e)=>{ const d=tLoad(); d[ep.id]={val:e.target.value, date:(d[ep.id]&&d[ep.id].date)||todayStr}; tSave(d); render(); }});
    line.appendChild(iv);
    line.appendChild($('span',{style:{fontSize:'9px',color:'#475569',minWidth:'46px'}}, ep.unit));
    const dv=$('input',{type:'date',class:'input-mod',style:{width:'128px',fontSize:'10px'},
      value:r.date||'',
      onchange:(e)=>{ const d=tLoad(); d[ep.id]={val:(d[ep.id]&&d[ep.id].val)||'', date:e.target.value}; tSave(d); render(); }});
    line.appendChild(dv);
    if(r.val!==''){
      line.appendChild($('span',{style:{marginLeft:'auto',fontSize:'14px',cursor:'pointer',color:'#475569'},
        onclick:()=>{ const d=tLoad(); delete d[ep.id]; tSave(d); render(); }},'🗑'));
    }
    row.appendChild(line);
    return row;
  };

  CATS.forEach(cat=>{
    const eps = T_EPREUVES.filter(ep=>ep.cat===cat);
    if(!eps.length) return;
    // Regroupe les épreuves de la famille par qualité (axe). Les épreuves sans axe
    // (PDC, FTP, VMA, PMA, test 3 min) sont des DONNÉES D'ANCRAGE : elles ne notent
    // aucune qualité, elles calibrent les autres. Elles ont donc leur propre bloc.
    const parAxe = {};
    eps.forEach(ep=>{ const k = ep.axe || ANCRAGE; (parAxe[k] = parAxe[k] || []).push(ep); });
    const axesDeLaFamille = Object.keys(parAxe)
      .sort((a,b)=> a===ANCRAGE ? 1 : b===ANCRAGE ? -1 : 0);

    const visibles = axesDeLaFamille.filter(k=>{
      if(S.testsAxeFocus) return k === S.testsAxeFocus;
      if(zoomGroup) return cat === mode;
      return true;
    });
    if(!visibles.length) return;

    const g = tAxesGrouped().find(x=>x.cat===cat);
    const hdr = $('div',{style:{display:'flex',alignItems:'baseline',gap:'8px',
      margin:'14px 0 6px',paddingBottom:'4px',borderBottom:'2px solid '+(T_CAT_COLOR[cat]||'#1e2d42')}});
    hdr.appendChild($('span',{style:{fontFamily:'var(--font-d)',fontSize:'15px',letterSpacing:'1.5px',
      color:T_CAT_COLOR[cat]||'#94a3b8',flex:'1'}}, T_CAT_LABEL[cat]));
    if(g) hdr.appendChild($('span',{style:{fontSize:'10px',color:'#64748b'}},
      g.nTested+'/'+g.n+' mesurées'+(g.score!=null? ' · '+g.score.toFixed(1)+'/4':'')));
    wrap.appendChild(hdr);

    visibles.forEach(axeKey=>{
      const a = axesById[axeKey];
      const sub = $('div',{style:{display:'flex',alignItems:'baseline',gap:'6px',margin:'8px 0 4px'}});
      sub.appendChild($('span',{style:{fontSize:'11px',fontWeight:'800',
        color: axeKey===ANCRAGE ? '#475569' : '#cbd5e1',flex:'1'}}, axeKey));
      // CHANTIER 57 — ce qui ENTRAÎNE cet axe dans la semaine active (séances + GTG + routine).
      // Un axe noté sans aucun vecteur est un standard qu'on mesure sans jamais le travailler.
      if(axeKey !== ANCRAGE){
        const spec = T_AXE_VECTEURS[axeKey];
        const v = (_tVect || (_tVect = tVecteursSemaine()))[axeKey];
        let txt = null, col = '#475569';
        if(spec && spec.differe){ txt = spec.differe; }
        else if(spec && spec.mesureSeule){ txt = 'mesure, pas un entraînement'; }
        else if(v && v.n === 0){ txt = '⚠ AUCUN VECTEUR DANS LA SEMAINE'; col = '#ef4444'; }
        else if(v){ txt = v.n + ' créneau' + (v.n>1?'x':'') + '/sem'; col = v.n>=2 ? '#10b981' : '#f59e0b'; }
        if(txt){
          const b = $('span',{style:{fontSize:'9.5px',fontWeight:'700',color:col,whiteSpace:'nowrap'}}, txt);
          if(v && v.detail.length) b.title = v.detail.join('\n');
          sub.appendChild(b);
        }
      }
      if(a && a.score!=null){
        sub.appendChild($('span',{style:{fontSize:'10px',fontWeight:'800',
          color: a.score>=3?'#10b981': a.score>=2?'#f59e0b':'#ef4444'}}, a.score.toFixed(1)+'/4'));
      } else if(axeKey!==ANCRAGE){
        sub.appendChild($('span',{style:{fontSize:'9px',color:'#475569'}},'non mesurée'));
      }
      wrap.appendChild(sub);
      parAxe[axeKey].forEach(ep=> wrap.appendChild(renderEpreuve(ep)));
    });
  });

  // ── SCORES COMPOSITES (info) ──
  const rsa = tRSA(), mti = tMTI45();
  const box=$('div',{style:{background:'#0d1525',border:'1px solid #1e2d42',borderRadius:'10px',padding:'10px 12px',marginTop:'10px'}});
  box.appendChild($('div',{style:{fontSize:'10px',fontWeight:'800',color:'#f5a623',marginBottom:'4px'}},'SCORES COMPOSITES'));
  box.appendChild($('div',{style:{fontSize:'8.5px',color:'#64748b',marginBottom:'8px',lineHeight:'1.45'}},
    'Deux lectures complémentaires. Le RSA mesure la FORCE RELATIVE seule : il dit si tu es assez fort pour le métier. Le MTI 45+ mesure la POLYVALENCE — force, endurance de force, work capacity, moteur : il dit si aucune qualité ne décroche. Un RSA élevé avec un 45+ bas signale un athlète fort mais incomplet.'));

  const l1=$('div',{style:{display:'flex',alignItems:'baseline',gap:'7px',marginBottom:'3px'}});
  l1.appendChild($('span',{style:{fontSize:'11px',fontWeight:'700',flex:'1'}},'RSA (MTI)'));
  l1.appendChild($('span',{style:{fontSize:'14px',fontWeight:'800',
    color: rsa==null?'#475569' : rsa>=6.5?'#10b981' : rsa>=5.75?'#f59e0b':'#ef4444'}},
    rsa==null?'—':rsa.toFixed(2)));
  l1.appendChild($('span',{style:{fontSize:'10px',color:'#64748b'}}, rsa==null?'':tRSALabel(rsa)));
  box.appendChild(l1);
  box.appendChild($('div',{style:{fontSize:'8.5px',color:'#475569',marginBottom:'7px'}},
    rsa==null ? 'Renseigner PDC + les 3 lifts 3RM + tractions'
              : 'Good ≥ 5,75 · Excellent ≥ 6,5 — calculé sur les 3RM convertis (×1,10)'));

  const l2=$('div',{style:{display:'flex',alignItems:'baseline',gap:'7px',marginBottom:'3px'}});
  l2.appendChild($('span',{style:{fontSize:'11px',fontWeight:'700',flex:'1'}},'MTI 45+'));
  l2.appendChild($('span',{style:{fontSize:'14px',fontWeight:'800',
    color: mti.total>=12?'#10b981' : mti.total>=8?'#f59e0b':'#ef4444'}}, mti.total+'/16'));
  l2.appendChild($('span',{style:{fontSize:'10px',color:'#64748b'}}, mti.n?tMTILabel(mti.total):''));
  box.appendChild(l2);
  box.appendChild($('div',{style:{fontSize:'8.5px',color:'#475569'}},
    mti.n ? mti.detail.map(d=>d[0]+' '+d[1]+'pt').join(' · ')+(mti.n<4?' — '+(4-mti.n)+' épreuve(s) manquante(s)':'')
          : 'Hinge 3RM + pompes + keg lift + épreuve longue'));
  box.appendChild($('div',{style:{fontSize:'8.5px',color:'#475569',marginTop:'2px'}},'Good 8-11 · Excellent ≥ 12'));

  const v2=tVO2();
  if(v2){
    const l3=$('div',{style:{display:'flex',alignItems:'baseline',gap:'7px',marginTop:'7px',paddingTop:'7px',borderTop:'1px solid #1e2d42'}});
    l3.appendChild($('span',{style:{fontSize:'11px',fontWeight:'700',flex:'1'}},'VO2max'));
    l3.appendChild($('span',{style:{fontSize:'14px',fontWeight:'800',
      color: v2.val>=55?'#10b981' : v2.val>=50?'#f59e0b':'#ef4444'}}, v2.val.toFixed(1)));
    l3.appendChild($('span',{style:{fontSize:'9px',color:'#64748b'}}, v2.src));
    box.appendChild(l3);
    box.appendChild($('div',{style:{fontSize:'8.5px',color:'#475569'}},
      '47,7 = moy. entraînement fonctionnel · 55 = amateur MMA / UFC moyen · 56 = élite CrossFit · >60 = élite MMA'));
  }
  wrap.appendChild(box);

  return wrap;
}

function showTooltip(e, text){
  closeTooltip();
  // Support multi-lignes : découpe sur les retours à la ligne, une idée par ligne.
  const lines = String(text).split(/\n+/).filter(x=>x.trim());
  const body = $('div',{});
  if(lines.length>1){
    lines.forEach(ln=>body.appendChild($('div',{style:{padding:'2px 0'}}, ln.trim())));
  } else {
    body.appendChild($('span',{}, text));
  }
  const tt = $('div',{class:'tooltip'}, body, $('span',{class:'tooltip-close',onclick:closeTooltip},'✕ fermer'));
  const rect = e.target.getBoundingClientRect();
  document.body.appendChild(tt);
  const ttH = tt.offsetHeight;
  const top = rect.top > ttH + 20 ? rect.top - ttH - 8 : rect.bottom + 8;
  tt.style.top = top+'px';
  tt.style.left = Math.max(8, Math.min(window.innerWidth - 296, rect.left - 140))+'px';
  S.tooltipTarget = tt;
}

// ── ONGLET 1 — ROUTINE DU MATIN ──────────────────────────────────────────


// ── STATS: progression chart per exercise ──────────────────────────────────
let _statsEx = null;
let _statsFmt = null;

// ── Libellé de format normalisé pour les statistiques ────────────────────────────────────
// Les stats séparent les charges par schéma de séries (un 3 reps et un 8-12 ne se comparent pas),
// mais le TEXTE des formats a changé au fil des versions : le même top set apparaissait alors sous
// trois libellés différents. On ramène chaque format à son schéma de répétitions.
function moteurCanonFmt(fmt){
  if(!fmt) return '';
  const f = String(fmt);
  if(/top set/i.test(f) && !/jamais|pas de|sans/i.test(f)) return 'Top set ×3';
  if(/3RM|1RM|test/i.test(f)) return 'Test RM';
  let m = f.match(/[×x]\s*(\d+)\s*[-\u2013]\s*(\d+)\s*s\b/i);  // 3×30-40 s -> tenue
  if(m) return m[1]+'-'+m[2]+' s';
  m = f.match(/[×x]\s*(\d+)\s*s\b/i);                          // 3×45 s -> tenue
  if(m) return m[1]+' s';
  m = f.match(/[×x]\s*(\d+)\s*[-\u2013]\s*(\d+)/);      // 3-4×8-12 -> 8-12
  if(m) return m[1]+'-'+m[2]+' reps';
  m = f.match(/[×x]\s*(\d+)/);                                  // 4×5 -> 5
  if(m) return m[1]+' reps';
  m = f.match(/(\d+)\s*[-\u2013]\s*(\d+)\s*(?:reps?|r\b)/i);
  if(m) return m[1]+'-'+m[2]+' reps';
  m = f.match(/(\d+)\s*[-\u2013]\s*(\d+)\s*s\b/i);           // 30-40 s -> tenue
  if(m) return m[1]+'-'+m[2]+' s';
  return f.length>18 ? f.slice(0,18)+'…' : f;
}
// Catégorie de stats basée sur les REPS RÉELLES quand elles sont saisies.
// Sinon on garde la catégorie prévue (moteurCanonFmt du format).
// Exceptions gardant la catégorie prévue même avec reps réelles : top set (le ×3 est nominal, la
// perf réelle est la charge du triple), tests RM, et tenues en secondes (pas des reps).
function moteurCanonFmtReps(fmtVal, reps){
  const prevu = moteurCanonFmt(fmtVal||'');
  if(reps==null || reps==='' || isNaN(Number(reps))) return prevu;
  // Cas spéciaux : on NE recatégorise PAS sur les reps réelles.
  if(/top set|test rm/i.test(prevu)) return prevu;   // top set / test : catégorie nominale conservée
  if(/\bs\b|\bs$| s$/.test(prevu)) return prevu;         // tenues en secondes : pas des reps
  // Sinon : la catégorie DEVIENT le nombre de reps réellement effectuées.
  return Number(reps)+' reps';
}

function getAllExerciseData(){
  // Scan all localStorage logs, collect {exName: [{date, charge, rpe}]}
  const data = {};
  for(let i=0;i<localStorage.length;i++){
    const k = localStorage.key(i);
    if(!k || !k.startsWith('log:')) continue;
    const dateStr = k.substring(4);
    let log;
    try{ log = JSON.parse(localStorage.getItem(k)); }catch(e){ continue; }
    if(!log) continue;
    Object.keys(log).forEach(key=>{
      if(!key.startsWith('ex_')) return;
      const entry = log[key];
      if(!entry || (!entry.charge && !entry.rpe)) return;

      let baseName, blocId, fmtVal, sessionLabel;
      const mMoteur = key.match(/^ex_moteur_(.+)$/);
      if(mMoteur){
        // Clé = ex_moteur_<exerciceId>[@<séance>]. Le suffixe de séance isole les séries cochées
        // d'une séance à l'autre, mais NE DOIT PAS scinder les statistiques : un même mouvement
        // garde un seul historique de performance quelle que soit la séance où il a été fait.
        const rawId = mMoteur[1].split('@')[0];
        const exObj = (typeof M_EX_BY_ID_NAME!=='undefined') ? M_EX_BY_ID_NAME[rawId] : null;
        baseName = exObj || rawId;
        blocId = 0; fmtVal = moteurCanonFmt(entry.fmt||'');
        const doneSessions = (log.moteur_sessions||[]).map(sid=>{
          const st = (typeof MTPL!=='undefined') ? MTPL.session_types.find(s=>s.id===sid) : null;
          return st ? st.nom : sid;
        });
        sessionLabel = doneSessions.length ? doneSessions.join('/') : 'Moteur';
      } else {
        // Ancien format Guyane : ex_<seance>_b<bloc>_<idx>
        const m = key.match(/^ex_(.+)_b(\d)_(\d+)(?:_\w+)?$/);
        if(!m) return;
        const seanceName=m[1], blocNum=Number(m[2]), exIdx=Number(m[3]);
        const seance=SEANCES[seanceName];
        if(!seance||!seance.blocs||!seance.blocs[blocNum]) return;
        const exList=seance.blocs[blocNum].exercices||[];
        const ex=exList[exIdx];
        if(!ex) return;
        baseName=ex.name.replace(/[\u2605\u26a1\u26a0]/g,'').replace(/\s+/g,' ').trim().split('\u00b7')[0].trim();
        blocId = blocNum; fmtVal = moteurCanonFmt(ex.fmt||'');
        sessionLabel = seanceName;
      }
      // Un id brut qui aurait échappé au catalogue (underscores, pas d'espace) est normalisé
      // avant canonicalisation, sinon il crée un bucket parasite à côté du vrai exercice.
      if(baseName && baseName.indexOf('_')>=0 && baseName.indexOf(' ')<0){
        baseName = baseName.replace(/_/g,' ').replace(/\b\w/g, ch=>ch.toUpperCase());
      }
      // Canonicalisation : fusionner les variantes du même exercice (noms changés entre blocs, et entre
      // l'ancien système Guyane et le nouveau moteur — mêmes mouvements, même bucket de stats)
      const _canon=[
        [/militaire/i,'Militaire'],
        [/db bench inclin/i,'DB Bench incliné'],
        [/bench plat/i,'Bench plat'],
        [/db press vertical/i,'DB Press vertical'],
        [/pendlay/i,'Pendlay Row'],
        [/gorilla/i,'Gorilla Row'],
        [/chin-ups|pull-up/i,'Chin-ups'],
        [/romanian|^rdl|\brdl\b/i,'RDL'],
        [/zercher/i,'Zercher'],
        [/front squat/i,'Front Squat'],
        [/copenhagen/i,'Copenhagen'],
        [/bulgarian/i,'Bulgarian'],
        [/nordic/i,'Nordic Curl'],
        [/pallof/i,'Pallof'],
        [/face pull/i,'Face Pull'],
        [/rotation ext/i,'Rotation externe'],
        [/nuque/i,'Nuque ISO'],
        [/farmer carry/i,'Farmer carry'],
        [/alactique|kb swing/i,'Alactique KB'],
        [/dragon flag/i,'Dragon flag'],
        [/back extension/i,'Back extension'],
      ];
      for(const [re,name] of _canon){ if(re.test(baseName)){ baseName=name; break; } }
      if(!data[baseName]) data[baseName]=[];
      const chargeNum=(()=>{
        if(typeof entry.charge === 'number') return entry.charge;
        let raw=String(entry.charge||'').replace(',','.').trim();
        if(!raw) return null;
        // Format "NxM" ou "Nx M kg" → prendre M (la charge par main), pas N (le nombre)
        let mx=raw.match(/(\d+(?:\.\d+)?)\s*[x\u00d7]\s*(\d+(?:\.\d+)?)/i);
        if(mx) return parseFloat(mx[2]);
        // Format "PDC+Nkg" → prendre N (le lest)
        let mp=raw.match(/(?:PDC|pdc)\s*\+\s*(\d+(?:\.\d+)?)/);
        if(mp) return parseFloat(mp[1]);
        // Sinon premier nombre
        let m1=raw.match(/(\d+(?:\.\d+)?)/);
        return m1?parseFloat(m1[1]):null;
      })();
      if(chargeNum===null||isNaN(chargeNum)) return; // skip if no charge entered
      const repsReel = (entry.reps!=null&&entry.reps!=='')?Number(entry.reps):null;
      const fmtCat = moteurCanonFmtReps(fmtVal, repsReel);
      data[baseName].push({date:dateStr, charge:chargeNum, chargeRaw: entry.charge!=null?String(entry.charge):'', rpe:Number(entry.rpe)||null, reps:repsReel, fmt:fmtCat, fmtPrevu:fmtVal, bloc:blocId, session:sessionLabel});
    });
  }
  // Sort each by date
  Object.values(data).forEach(arr=>arr.sort((a,b)=>a.date.localeCompare(b.date)));
  return data;
}

// Ratios ×PDC (1RM), sourcés par exercice — convertis en 3RM (Epley ≈ ×0.909) pour être directement
// comparables aux séances réelles en 5×3 (le top set d'un 5×3 est un effort proche du 3RM).
// Le vrai MTI Relative Strength Assessment (màj janvier 2021) = Front Squat + Hinge Lift + Bench Press
// (1RM chacun) + tractions strictes (plafond 20), score = (somme 1RM + tractions×10%PDC) / PDC.
// Military Press n'est PAS dans le RSA ni dans aucun standard MTI — retiré des standards sourcés,
// suivi à la place en % du Bench (repère auto-calibré, pas de prétention de standard externe).
const M_STANDARDS_RATIOS = {
  bench_plat_barre: {label:'Bench Press', min:1.0, obj:1.25, exc:1.5, source:'MTI (RSA)'},
  rdl: {label:'Hinge — RDL hanches-hautes (test MTI Hinge Lift)', min:1.5, obj:1.75, exc:2.0, source:'MTI Hinge Lift (RSA)'},
  front_squat: {label:'Front Squat', min:1.0, obj:1.25, exc:1.5, source:'MTI (RSA)'},
  push_press: {label:'Push Press', min:null, obj:null, exc:1.1, source:'MTI (hors RSA — seule Excellence publiée)'},
  squat_clean: {label:'Squat Clean', min:null, obj:null, exc:1.25, source:'MTI (hors RSA — seule Excellence publiée)'},
  // ⏸ CHANTIER 45 — EN ATTENTE D'ARBITRAGE DE J. Le Zercher n'a AUCUN standard externe publié :
  // le barème ci-dessous est celui du front squat, appliqué à un mouvement que le manuel décrit
  // lui-même comme « structurellement plus dur ». Un standard sans référence externe n'en est pas un.
  // Recommandation du chantier : le RETIRER du tableau et suivre le Zercher en tendance personnelle
  // (comme le Pendlay Row). Alternative : abattement explicite de −10 à −15 %.
  // Conservé à titre CONSERVATOIRE tant que J n'a pas tranché — le libellé le dit à l'écran.
  zercher_squat: {label:'Zercher Squat ⏸ (repère indicatif)', min:1.0, obj:1.25, exc:1.5, source:'⏸ à arbitrer — barème du front squat appliqué par défaut ; aucun standard Zercher publié, et le Zercher est structurellement plus dur'},
};
const M_RM_FACTOR = 0.909; // 3RM ≈ 1RM × 0.909 (Epley)
// e1RM honnête : Epley avec les reps réelles du format + la réserve (RIR = 10 − RPE, plafonné à 4).
// Ne suppose plus que la dernière charge est un 3RM — un 4×6 @RPE 8 et un top set 5×3 @RPE 9
// donnent chacun leur vraie estimation. Formats gérés : '3RM', '4×6', '3-4×6', '3×6-8' (borne
// basse), rejet des durées ('2-3×8s'). Sans format ni RPE : défaut historique 3 reps, RIR 0.
function moteurEst1RM(entry){
  if(!entry || entry.charge==null || entry.charge==='') return null;
  const w = parseFloat(String(entry.charge).replace(',','.'));
  if(!isFinite(w) || w<=0) return null;
  const fmt = entry.fmt ? String(entry.fmt) : '';
  let reps = null;
  let m = fmt.match(/(\d+)\s*RM/i);
  if(m) reps = Number(m[1]);
  if(reps==null){
    m = fmt.match(/[×x]\s*(\d+)\s*([a-z]?)/i);
    if(m && m[2].toLowerCase()!=='s') reps = Number(m[1]); // '×8s' = secondes, pas des reps
  }
  if(reps==null) reps = 3;
  let rir = 0;
  const rpe = parseFloat(entry.rpe);
  if(isFinite(rpe)) rir = Math.min(4, Math.max(0, 10 - rpe));
  return w * (1 + (reps + rir)/30);
}
function moteurGetBodyweight(){
  const v = load('user_bodyweight_kg');
  return (v!=null && v!=='') ? Number(v) : 75;
}
function moteurSetBodyweight(v){

  const log = load('user_bodyweight_log') || [];
  const today = new Date().toISOString().slice(0,10);
  const i = log.findIndex(e => e.date === today);
  if(i >= 0) log[i].kg = v; else log.push({date: today, kg: v});
  save('user_bodyweight_log', log);
  render();
}
function moteurBodyweightLog(){ return load('user_bodyweight_log') || []; }
// Tractions strictes max (reps) — saisie dédiée pour le RSA : le champ charge de chin_ups
// contient un LEST en kg (ex. +10), jamais des répétitions.
function moteurGetPullupsMax(){

// Tests de référence (RM réels) — saisis après chaque batterie (fin Guyane, mini-test S5, fin de
// fenêtre maison). Quand un RM testé existe, le RSA et le % bench l'utilisent EN PRIORITÉ ;
